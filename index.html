<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>중간고사 통합 문제집</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: 과목 탭(고정) → 과목별 필터 줄 → 주차·장 단위 섹션의 문제지. 자바는 코드 리스팅 + 빈칸별 보기 묶음 */
:root{
  --bg:#f1f2f6; --surface:#ffffff; --ink:#171d2a; --muted:#5a6273; --line:#d9dde6; --soft:#e9ecf2;
  --dl:#b8195a; --lx:#7a2a63; --bd:#24407a; --jv:#0d7466;
  --sub:var(--dl); --sub-soft:#f8e3ec;
  --ok:#1d7a4b; --ok-soft:#e2f3e9; --bad:#b3261e; --bad-soft:#fbe6e3; --gold:#8f6400; --gold-soft:#faf0d6;
  --dl-soft:#f9e4ec; --lx-soft:#f3e6ef; --bd-soft:#e6ebf6; --jv-soft:#dff1ee; --ok-line:#8fc4a6; --bad-line:#e2a49d;
  --code-bg:#101a25; --code-fg:#dbe5ee; --code-num:#5b7184; --code-cmt:#86a2b6; --code-str:#f2c38b; --code-kw:#8fd3c7;
  --blank:#ffd866; --blank-ink:#171d2a;
  --f-display:"Black Han Sans","IBM Plex Sans KR",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"D2Coding",Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10131a; --surface:#181c26; --ink:#e7eaf1; --muted:#9aa2b4; --line:#2a303d; --soft:#212634;
  --dl:#f06292; --lx:#e08bc6; --bd:#9db7ef; --jv:#4cc7b2;
  --ok:#5cc792; --ok-soft:#163224; --bad:#ff8a7c; --bad-soft:#3a1d1a; --gold:#e3b54f; --gold-soft:#372d15;
  --dl-soft:#3a1d2a; --lx-soft:#3a2333; --bd-soft:#222c40; --jv-soft:#15302c; --ok-line:#2f6b4a; --bad-line:#7a3a33;
  --code-bg:#0a1118; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10131a; --surface:#181c26; --ink:#e7eaf1; --muted:#9aa2b4; --line:#2a303d; --soft:#212634;
  --dl:#f06292; --lx:#e08bc6; --bd:#9db7ef; --jv:#4cc7b2;
  --ok:#5cc792; --ok-soft:#163224; --bad:#ff8a7c; --bad-soft:#3a1d1a; --gold:#e3b54f; --gold-soft:#372d15;
  --dl-soft:#3a1d2a; --lx-soft:#3a2333; --bd-soft:#222c40; --jv-soft:#15302c; --ok-line:#2f6b4a; --bad-line:#7a3a33;
  --code-bg:#0a1118; color-scheme:dark}
body[data-s="dl"]{--sub:var(--dl);--sub-soft:var(--dl-soft)} body[data-s="lx"]{--sub:var(--lx);--sub-soft:var(--lx-soft)} body[data-s="bd"]{--sub:var(--bd);--sub-soft:var(--bd-soft)} body[data-s="jv"]{--sub:var(--jv);--sub-soft:var(--jv-soft)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,textarea{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{cursor:pointer;-webkit-appearance:none;appearance:none;margin:0}
:focus-visible{outline:2px solid var(--sub);outline-offset:2px}
.wrap{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
code{font-family:var(--f-mono);font-size:.88em;background:var(--soft);padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}

header.top .wrap{padding-block:26px 14px;display:flex;flex-direction:column;gap:6px}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:700}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(28px,6vw,40px);line-height:1.15;margin:0;text-wrap:balance}
.lede{margin:0;color:var(--muted);max-width:64ch}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .wrap{padding-block:8px}
.filters{background:var(--surface);border-bottom:1px solid var(--line)}
.filters .wrap{padding-block:8px 10px;display:flex;flex-direction:column;gap:8px}
.totop{position:fixed;right:max(16px,calc(env(safe-area-inset-right,0px) + 12px));bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:6;width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:20px;box-shadow:0 4px 14px rgba(0,0,0,.18);padding:0}
.subjects{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.subj{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:7px 10px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0;position:relative;overflow:hidden}
.subj b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.subj small{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.subj i{position:absolute;left:0;bottom:0;height:3px;background:var(--c);opacity:.85}
.subj[aria-selected="true"]{background:var(--c);border-color:var(--c);color:var(--surface)}
.subj[aria-selected="true"] small{color:inherit;opacity:.85}
.subj[aria-selected="true"] i{background:var(--surface);opacity:.6}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.row.scroll{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin-inline:-4px;padding:2px 4px}
.row.scroll::-webkit-scrollbar{display:none}
.row.scroll>*{flex:none}
.lbl{font-size:11.5px;color:var(--muted);letter-spacing:.06em;margin-right:2px;font-weight:700}
.chip{font-size:13px;border:1px solid var(--line);background:transparent;border-radius:999px;padding:3px 11px;min-height:32px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--sub);border-color:var(--sub);color:var(--surface)}
.chip.tool[aria-pressed="true"]{background:var(--sub-soft);color:var(--sub);border-color:var(--sub);font-weight:700}
.chip.warn{border-color:var(--bad);color:var(--bad)}
.score{margin-left:auto;font-family:var(--f-mono);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.score b{color:var(--ink)}

main{padding-block:14px calc(88px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:26px}
.intro{display:flex;flex-direction:column;gap:2px;border-left:3px solid var(--sub);padding:2px 0 2px 12px}
.intro h2{font-family:var(--f-display);font-weight:400;font-size:24px;margin:0;line-height:1.25;text-wrap:balance}
.intro p{margin:0;color:var(--muted);font-size:13.5px}
section.part{display:flex;flex-direction:column;gap:10px}
.part-h{display:flex;align-items:baseline;gap:10px;border-bottom:2px solid var(--ink);padding-bottom:4px}
.part-h h3{font-family:var(--f-display);font-weight:400;font-size:20px;margin:0}
.part-h span{font-size:12.5px;color:var(--muted);margin-left:auto;font-variant-numeric:tabular-nums;text-align:right}
.subh{font-size:13px;font-weight:700;color:var(--sub);margin:6px 0 -2px}

.q{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr);gap:10px;min-width:0}
.q.ok{border-color:var(--ok-line)}
.q.bad{border-color:var(--bad-line)}
.qh{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.num{font-family:var(--f-mono);font-weight:600;color:var(--sub);font-variant-numeric:tabular-nums}
.tag{font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 6px;line-height:1.7}
.tag.past{background:var(--gold-soft);color:var(--gold);border-color:transparent;font-weight:700}
.tag.long{background:var(--sub-soft);color:var(--sub);border-color:transparent;font-weight:700}
.src{font-size:12px;color:var(--muted);font-family:var(--f-mono);overflow-wrap:anywhere}
.stem{margin:0;font-weight:500;overflow-wrap:anywhere}
.stem.pre{white-space:pre-line}

.ox{display:flex;gap:10px}
.bub{width:48px;height:48px;border-radius:50%;border:2px solid var(--sub);background:transparent;color:var(--sub);font:700 18px var(--f-mono);padding:0}
.bub.pick{background:var(--sub);color:var(--surface)}
.bub.right{border-color:var(--ok);background:var(--ok);color:var(--surface)}
.bub.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.opts{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.opt{width:100%;text-align:left;display:flex;gap:10px;align-items:flex-start;background:transparent;border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:44px;min-width:0}
.opt .b{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--sub);color:var(--sub);font:600 12px/19px var(--f-mono);text-align:center;margin-top:1px}
.opt .t{min-width:0;overflow-wrap:anywhere}
.opt .t.mono{font-family:var(--f-mono);font-size:13px;white-space:pre-wrap}
@media (hover:hover){.opt:not(:disabled):hover{border-color:var(--sub)}}
.opt:disabled{cursor:default;opacity:1;-webkit-text-fill-color:currentColor}
.opt.right{background:var(--ok-soft);border-color:var(--ok)} .opt.right .b{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)} .opt.wrong .b{border-color:var(--bad);color:var(--bad)}

.ans-in{display:flex;gap:8px;flex-wrap:wrap}
.ans-in input{flex:1 1 220px;min-width:0;font-size:16px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.ans-in input:disabled{opacity:1;-webkit-text-fill-color:var(--ink)}
.btn{font-size:13px;padding:6px 13px;min-height:40px;border-radius:8px;border:1px solid var(--ink);background:transparent}
.btn.solid{background:var(--ink);color:var(--surface)}
.btn.sm{min-height:34px;padding:4px 11px}
.btn.ok{border-color:var(--ok);color:var(--ok)} .btn.no{border-color:var(--bad);color:var(--bad)}
.btn.ok.on{background:var(--ok);color:var(--surface)} .btn.no.on{background:var(--bad);color:var(--surface)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mark{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.fb{padding:9px 13px;border-left:3px solid var(--ok);background:var(--ok-soft);border-radius:0 8px 8px 0;font-size:14px;display:flex;flex-direction:column;gap:4px;min-width:0;overflow-wrap:anywhere}
.fb.bad{border-left-color:var(--bad);background:var(--bad-soft)}
.fb.neutral{border-left-color:var(--sub);background:var(--sub-soft)}
.fb .k{font-weight:700}
.fb.ok .k{color:var(--ok)} .fb.bad .k{color:var(--bad)}
.fb ul{margin:2px 0 0;padding-left:1.2em}
.fb .pre{white-space:pre-line}
.fb .steps{font-family:var(--f-mono);font-size:13px;white-space:pre-wrap;overflow-x:auto}
.fb .srcl{font-size:12px;color:var(--muted)}

.file{border-radius:10px;overflow:hidden;background:var(--code-bg);min-width:0}
.fname{font-family:var(--f-mono);font-size:12px;color:var(--code-num);padding:6px 12px;border-bottom:1px solid #1e2c3a;display:flex;gap:8px;align-items:center}
.fname::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--jv)}
pre.code{margin:0;padding:10px 0;overflow-x:auto;-webkit-overflow-scrolling:touch;font-family:var(--f-mono);font-size:13px;line-height:1.7;color:var(--code-fg)}
.ln{display:flex;padding-right:16px;min-height:1.7em}
.ln i{flex:none;font-style:normal;color:var(--code-num);width:3.2em;text-align:right;padding-right:1em;user-select:none;-webkit-user-select:none}
.lc{white-space:pre;min-width:0}
body.wrapcode pre.code{overflow-x:hidden}
body.wrapcode .ln{padding-right:10px}
body.wrapcode .lc{white-space:pre-wrap;overflow-wrap:anywhere;flex:1}
.ln.hasblank{background:rgba(255,216,102,.06)}
.cmt{color:var(--code-cmt)} .str{color:var(--code-str)} .kw{color:var(--code-kw)}
.blank{background:var(--blank);color:var(--blank-ink);border-radius:3px;padding:0 6px;font-weight:600;border:0;font:inherit;font-weight:600}
.blank.line{display:inline-block;min-width:min(22ch,60%);max-width:100%;text-align:left;cursor:pointer;white-space:pre-wrap;padding:1px 8px;min-height:1.5em}
.blank.ok{background:var(--ok);color:#fff}.blank.bad{background:var(--bad);color:#fff}
details.out summary{cursor:pointer;color:var(--muted);font-size:13px}
details.out pre{background:var(--sub-soft);border-radius:8px;padding:8px 12px;margin:6px 0 0;white-space:pre-wrap;font-family:var(--f-mono);font-size:13px;overflow-x:auto}
.bset{display:flex;flex-direction:column;gap:8px;border-top:1px dashed var(--line);padding-top:10px;scroll-margin-top:96px}
.bset h4{margin:0;font-size:13.5px;display:flex;gap:8px;align-items:center}
.bset h4 .c{font-family:var(--f-mono);color:var(--sub);font-size:15px}
.opts.grid{grid-template-columns:1fr 1fr}
@media (max-width:620px){.opts.grid{grid-template-columns:minmax(0,1fr)}}
.jsum{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}

.note{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 20px 20px;min-width:0}
.note h2{font-family:var(--f-display);font-weight:400;font-size:22px;margin:26px 0 8px;padding-top:10px;border-top:2px solid var(--ink);scroll-margin-top:96px}
.note-toc .chip{text-decoration:none;color:var(--ink)}
.note h3{font-size:16px;margin:18px 0 6px;color:var(--sub)}
.note h4{font-size:15px;margin:14px 0 4px}
.note p{margin:6px 0;max-width:72ch}
.note ul,.note ol{margin:6px 0;padding-left:1.25em}
.note li{margin:3px 0}
.note .tbl{overflow-x:auto;margin:8px 0;-webkit-overflow-scrolling:touch}
.note table{border-collapse:collapse;font-size:13.5px;min-width:100%}
.note th,.note td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
.note th{background:var(--soft);white-space:nowrap}
.note pre.nc{background:var(--code-bg);color:var(--code-fg);font-family:var(--f-mono);font-size:13px;border-radius:8px;padding:10px 14px;overflow-x:auto}
.note .math{overflow-x:auto;margin:8px 0;padding:4px 0}
.note-toc{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 4px}
.empty{color:var(--muted);text-align:center;padding:40px 0}
@media (max-width:560px){
  .bar .wrap{gap:6px;padding-block:6px 8px}
  .subjects{gap:4px}
  .subj{padding:5px 7px;border-radius:8px}
  .subj b{font-size:13.5px}
  .subj small{font-size:10.5px}
  .subj small .long{display:none}
  .chip{min-height:30px;font-size:12.5px;padding:2px 10px}
  #tools{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-4px;padding:2px 4px}
  #tools::-webkit-scrollbar{display:none}
  #tools>*{flex:none}
  .score{margin-left:4px}
  .bset{scroll-margin-top:84px}
  pre.code{font-size:12px}
  .ln i{width:2.6em;padding-right:.7em}
  .q{gap:9px}
  h1{font-size:26px}
  .intro h2{font-size:21px}
  .q{padding:12px}
  .note{padding:4px 14px 16px}
}
@media (prefers-reduced-motion:no-preference){.fb{animation:in .16s ease-out}@keyframes in{from{transform:translateY(-3px)}to{transform:none}}}
</style>
</head>
<body>


<header class="top"><div class="wrap">
  <div class="eyebrow">중간고사 대비 · 4과목 · 노트 1권</div>
  <h1>중간고사 통합 문제집</h1>
  <p class="lede">딥러닝, 리눅스 시스템, 빅데이터이해, 자바프로그래밍 문제를 한곳에 모았습니다. 풀이 기록은 이 브라우저에 저장되어 과목을 오가도 유지됩니다.</p>
</div></header>

<div class="bar"><div class="wrap">
  <div class="subjects" id="subjects" role="tablist"></div>
</div></div>
<div class="filters"><div class="wrap">
  <div class="row scroll" id="groups"></div>
  <div class="row scroll" id="types"></div>
  <div class="row" id="tools"></div>
</div></div>

<main class="wrap" id="main"></main>
<button class="totop" id="totop" hidden aria-label="필터와 과목 탭으로 올라가기">↑</button>

<script>window.MathJax={startup:{typeset:false},svg:{fontCache:"global"}};</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.js" id="MathJax-script" async></script>
<script>
const DATA={"items": [{"id": "dl0", "s": "dl", "g": 1, "t": "ox", "q": "Python에서 <code>7 / 5<\/code>의 결과는 1이다.", "h": 1, "a": false, "e": "나눗셈은 실수 결과 → 1.4"}, {"id": "dl1", "s": "dl", "g": 1, "t": "ox", "q": "<code>np.arange(0, 10, 2)<\/code>의 결과에는 끝값 10이 포함된다.", "h": 1, "a": false, "e": "arange는 끝값 제외 → [0 2 4 6 8]"}, {"id": "dl2", "s": "dl", "g": 1, "t": "ox", "q": "<code>np.linspace(0, 1, 5)<\/code>는 끝값 1을 포함한다.", "h": 1, "a": true, "e": "linspace는 끝값 포함 → [0 0.25 0.5 0.75 1]"}, {"id": "dl3", "s": "dl", "g": 1, "t": "ox", "q": "NumPy에서 <code>x * y<\/code>는 행렬 곱을 계산한다.", "h": 1, "a": false, "e": "x*y는 원소별 곱, 행렬 곱은 np.dot"}, {"id": "dl4", "s": "dl", "g": 1, "t": "ox", "q": "<code>c = b<\/code>로 대입한 뒤 b를 바꿔도 c는 바뀌지 않는다.", "h": 1, "a": false, "e": "같은 배열을 참조하므로 c도 바뀐다. 분리하려면 b.copy()"}, {"id": "dl5", "s": "dl", "g": 2, "t": "ox", "q": "딥러닝은 머신러닝의 하위 분야이다.", "h": 1, "a": true, "e": "AI ⊃ 머신러닝 ⊃ 딥러닝"}, {"id": "dl6", "s": "dl", "g": 2, "t": "ox", "q": "비지도학습은 라벨(정답)이 있는 데이터를 사용한다.", "h": 1, "a": false, "e": "라벨 없는 데이터에서 패턴·구조를 찾는다"}, {"id": "dl7", "s": "dl", "g": 2, "t": "ox", "q": "인공 신경망은 비매개변수적 학습에 속한다.", "h": 1, "a": false, "e": "가중치 개수가 구조로 고정 → 매개변수적"}, {"id": "dl8", "s": "dl", "g": 2, "t": "ox", "q": "K-NN은 데이터가 늘수록 계산량이 늘어나는 비매개변수적 모델이다.", "h": 1, "a": true, "e": "데이터를 저장하고 새 데이터와 비교해 예측"}, {"id": "dl9", "s": "dl", "g": 3, "t": "ox", "q": "단층 퍼셉트론으로 XOR 문제를 해결할 수 있다.", "h": 1, "a": false, "e": "직선 하나로 분리 불가 → 다층 퍼셉트론 필요"}, {"id": "dl10", "s": "dl", "g": 3, "t": "ox", "q": "바이어스 b는 −θ와 같다.", "h": 1, "a": true, "e": "Σwx > θ ⇔ Σwx + b > 0, b = −θ"}, {"id": "dl11", "s": "dl", "g": 3, "t": "ox", "q": "퍼셉트론에서 가중합이 θ와 정확히 같으면 출력은 1이다.", "h": 1, "a": false, "e": "가중합 > θ일 때만 1, 같으면 0"}, {"id": "dl12", "s": "dl", "g": 4, "t": "ox", "q": "활성화 함수 없이 층을 쌓으면 결국 하나의 선형 변환과 같다.", "h": 1, "a": true, "e": "W⁽ᴸ⁾⋯W⁽¹⁾a + 편향합 = 단일 선형 변환"}, {"id": "dl13", "s": "dl", "g": 4, "t": "ox", "q": "Step 함수는 미분 가능해서 경사하강법 학습에 적합하다.", "h": 1, "a": false, "e": "불연속 → 미분 불가 → 학습에 못 씀"}, {"id": "dl14", "s": "dl", "g": 4, "t": "ox", "q": "Tanh 함수의 출력 범위는 (0, 1)이다.", "h": 1, "a": false, "e": "Tanh는 (−1, 1), 0 중심. (0, 1)은 Sigmoid"}, {"id": "dl15", "s": "dl", "g": 4, "t": "ox", "q": "행렬 곱은 교환법칙이 성립한다(AB = BA).", "h": 1, "a": false, "e": "일반적으로 AB ≠ BA"}, {"id": "dl16", "s": "dl", "g": 5, "t": "ox", "q": "Softmax 출력값을 모두 더하면 1이다.", "h": 1, "a": true, "e": "확률 분포로 변환"}, {"id": "dl17", "s": "dl", "g": 5, "t": "ox", "q": "Softmax 입력에서 max(z)를 빼고 계산하면 결과 확률이 달라진다.", "h": 1, "a": false, "e": "분자·분모에 같은 값이 곱해져 결과는 동일"}, {"id": "dl18", "s": "dl", "g": 6, "t": "ox", "q": "교차 엔트로피 손실은 주로 회귀 문제에 사용한다.", "h": 1, "a": false, "e": "CE는 분류, SSE는 회귀"}, {"id": "dl19", "s": "dl", "g": 6, "t": "ox", "q": "MNIST의 학습 데이터는 10,000개, 테스트 데이터는 60,000개이다.", "h": 1, "a": false, "e": "학습 60,000 / 테스트 10,000"}, {"id": "dl20", "s": "dl", "g": 6, "t": "ox", "q": "배치 크기가 작을수록 기울기 노이즈(랜덤성)가 커진다.", "h": 1, "a": true, "e": "배치 평균 분산 σ²/B → B가 작을수록 커짐"}, {"id": "dl21", "s": "dl", "g": 7, "t": "ox", "q": "중앙 차분의 오차는 O(h²)로 전방 차분 O(h)보다 작다.", "h": 1, "a": true, "e": "실용적으로 중앙 차분 사용"}, {"id": "dl22", "s": "dl", "g": 7, "t": "ox", "q": "학습률이 너무 크면 최솟값을 지나쳐 발산할 수 있다.", "h": 1, "a": true, "e": "overshoot, 발산"}, {"id": "dl23", "s": "dl", "g": 7, "t": "ox", "q": "Adagrad는 기울기 제곱의 지수 이동 평균을 사용한다.", "h": 1, "a": false, "e": "Adagrad는 누적 합. 지수 이동 평균은 RMSprop"}, {"id": "dl24", "s": "dl", "g": 1, "t": "short", "q": "크기가 다른 배열끼리 연산할 때 작은 배열이 큰 배열 크기로 자동 확장되는 NumPy 기능은?", "h": 1, "a": "브로드캐스팅(Broadcasting)"}, {"id": "dl25", "s": "dl", "g": 1, "t": "short", "q": "프로젝트별로 독립된 Python 환경을 만들어 패키지 충돌을 막고 재현성을 보장하는 것은?", "h": 1, "a": "가상 환경 (conda create -n …)"}, {"id": "dl26", "s": "dl", "g": 1, "t": "short", "q": "값을 (x − min) / (max − min)으로 바꿔 0~1 사이로 만드는 스케일링 방법은?", "h": 1, "a": "Min-Max 스케일링"}, {"id": "dl27", "s": "dl", "g": 1, "t": "short", "q": "Matplotlib에서 데이터 분포를 구간(bins)별로 나타내는 그래프 함수 이름은?", "h": 1, "a": "plt.hist()"}, {"id": "dl28", "s": "dl", "g": 2, "t": "short", "q": "1959년 '머신러닝'이라는 용어를 처음 사용하고 체커 자가 학습 프로그램을 만든 사람은?", "h": 1, "a": "아서 사무엘"}, {"id": "dl29", "s": "dl", "g": 2, "t": "short", "q": "입력과 정답(라벨)이 쌍으로 주어진 데이터로 입력과 출력 사이의 관계를 학습하는 방법은?", "h": 1, "a": "지도학습"}, {"id": "dl30", "s": "dl", "g": 2, "t": "short", "q": "데이터 크기와 관계없이 고정된 수의 매개변수로 데이터를 설명하는 학습 방식은?", "h": 1, "a": "매개변수적 학습"}, {"id": "dl31", "s": "dl", "g": 2, "t": "short", "q": "가장 가까운 이웃 k개를 참조해 예측하는 비매개변수적 알고리즘은?", "h": 1, "a": "K-NN (K-최근접 이웃)"}, {"id": "dl32", "s": "dl", "g": 3, "t": "short", "q": "1957년 로젠블랫이 고안한, 입력의 가중합이 임계값을 넘으면 1을 출력하는 최초의 학습 가능한 신경망은?", "h": 1, "a": "퍼셉트론"}, {"id": "dl33", "s": "dl", "g": 3, "t": "short", "q": "AND의 반대 결과를 내며 디지털 회로의 범용 게이트로 불리는 게이트는?", "h": 1, "a": "NAND"}, {"id": "dl34", "s": "dl", "g": 3, "t": "short", "q": "두 입력이 다를 때만 1을 출력하고, 단층 퍼셉트론으로 표현할 수 없는 게이트는?", "h": 1, "a": "XOR"}, {"id": "dl35", "s": "dl", "g": 4, "t": "short", "q": "오차를 출력층에서 입력층 방향으로 거꾸로 전파해 가중치를 조정하는 알고리즘(1986)은?", "h": 1, "a": "역전파(Backpropagation)"}, {"id": "dl36", "s": "dl", "g": 4, "t": "short", "q": "max(0, x)로 정의되는 활성화 함수는?", "h": 1, "a": "ReLU"}, {"id": "dl37", "s": "dl", "g": 4, "t": "short", "q": "출력이 (0, 1)인 S자 곡선으로 확률로 해석할 수 있고, 기울기 소실 문제가 있는 활성화 함수는?", "h": 1, "a": "Sigmoid"}, {"id": "dl38", "s": "dl", "g": 4, "t": "short", "q": "출력이 0이나 1에 가까워질 때 기울기가 0에 수렴해 깊은 층일수록 학습이 어려워지는 현상은?", "h": 1, "a": "기울기 소실(Vanishing Gradient)"}, {"id": "dl39", "s": "dl", "g": 4, "t": "short", "q": "0 이하 입력에 항상 0을 출력해 뉴런이 더 이상 학습하지 못하는 현상은?", "h": 1, "a": "Dying ReLU (해결: Leaky ReLU, Parametric ReLU)"}, {"id": "dl40", "s": "dl", "g": 5, "t": "short", "q": "입력을 그대로 출력하며 회귀 문제의 출력층에 쓰는 함수는?", "h": 1, "a": "항등 함수(Identity)"}, {"id": "dl41", "s": "dl", "g": 5, "t": "short", "q": "출력을 합이 1인 확률 분포로 바꾸는, 다중 클래스 분류 출력층 함수는?", "h": 1, "a": "Softmax"}, {"id": "dl42", "s": "dl", "g": 5, "t": "short", "q": "Softmax의 overflow를 막기 위해 모든 입력에서 max(z)를 빼고 계산하는 기법은?", "h": 1, "a": "Log-Sum-Exp 기법"}, {"id": "dl43", "s": "dl", "g": 6, "t": "short", "q": "사람이 특징을 설계하지 않고 원시 데이터 → 신경망 → 출력으로 바로 학습하는 방식은?", "h": 1, "a": "End-to-End 학습"}, {"id": "dl44", "s": "dl", "g": 6, "t": "short", "q": "학습 데이터에 지나치게 맞춰져 새 데이터에서 성능이 떨어지는 현상은?", "h": 1, "a": "과적합(Overfitting)"}, {"id": "dl45", "s": "dl", "g": 6, "t": "short", "q": "예측값을 [ε, 1−ε] 사이로 제한해 교차 엔트로피의 log(0) 문제를 막는 NumPy 함수는?", "h": 1, "a": "np.clip(y_pred, eps, 1 − eps)"}, {"id": "dl46", "s": "dl", "g": 6, "t": "short", "q": "전체 학습 데이터를 일정 크기로 나눈 묶음으로, 이 단위로 손실을 계산해 가중치를 갱신하는 것은?", "h": 1, "a": "미니배치"}, {"id": "dl47", "s": "dl", "g": 7, "t": "short", "q": "손실 함수의 기울기 반대 방향으로 가중치를 반복 갱신해 손실을 줄이는 최적화 알고리즘은?", "h": 1, "a": "경사하강법 (θ := θ − α∇J(θ))"}, {"id": "dl48", "s": "dl", "g": 7, "t": "short", "q": "모든 변수의 편미분을 모은 벡터로, 함수가 가장 빠르게 증가하는 방향을 나타내는 것은?", "h": 1, "a": "기울기(Gradient)"}, {"id": "dl49", "s": "dl", "g": 7, "t": "short", "q": "랜덤하게 고른 데이터 1개로 기울기를 계산하는 경사하강법은?", "h": 1, "a": "SGD (확률적 경사하강법)"}, {"id": "dl50", "s": "dl", "g": 7, "t": "short", "q": "1차 모멘트(평균)와 2차 모멘트(분산)를 함께 써서 RMSprop에 모멘텀을 더한 옵티마이저는?", "h": 1, "a": "Adam"}, {"id": "dl51", "s": "dl", "g": 2, "t": "mc", "q": "다음 중 <b>비매개변수적<\/b> 모델은?", "h": 1, "o": ["선형 회귀", "로지스틱 회귀", "결정 트리", "SVM"], "a": 2, "e": "비매개변수적: K-NN·결정 트리·랜덤 포레스트·커널 밀도 추정"}, {"id": "dl52", "s": "dl", "g": 2, "t": "mc", "q": "다음 중 비지도학습 기법이 <b>아닌<\/b> 것은?", "h": 1, "o": ["K-평균", "PCA", "오토인코더", "선형 회귀"], "a": 3, "e": "선형 회귀는 지도학습"}, {"id": "dl53", "s": "dl", "g": 2, "t": "mc", "q": "지도학습의 핵심 개념 4가지에 속하지 <b>않는<\/b> 것은?", "h": 1, "o": ["손실 함수", "최적화", "일반화", "군집화"], "a": 3, "e": "지도학습 핵심: 목표·손실 함수·최적화·일반화. 군집화는 비지도"}, {"id": "dl54", "s": "dl", "g": 2, "t": "mc", "q": "생성자와 판별자가 서로 경쟁하며 학습하는 생성형 모델은?", "h": 1, "o": ["CNN", "GAN", "RNN", "SVM"], "a": 1, "e": ""}, {"id": "dl55", "s": "dl", "g": 2, "t": "mc", "q": "2012년 ImageNet 대회에서 우승해 이미지 처리 혁신을 이끈 모델은?", "h": 1, "o": ["AlexNet", "LeNet", "Transformer", "LSTM"], "a": 0, "e": ""}, {"id": "dl56", "s": "dl", "g": 3, "t": "mc", "q": "1969년 퍼셉트론이 XOR 같은 비선형 문제를 풀 수 없음을 지적해 신경망 침체를 불러온 인물은?", "h": 1, "o": ["로젠블랫", "민스키와 페퍼트", "힌튼", "얀 르쿤"], "a": 1, "e": ""}, {"id": "dl57", "s": "dl", "g": 3, "t": "mc", "q": "XOR을 게이트 조합으로 바르게 나타낸 것은?", "h": 1, "o": ["AND( NAND, OR )", "OR( AND, NAND )", "NAND( AND, OR )", "AND( OR, OR )"], "a": 0, "e": "NAND·OR가 은닉층, AND가 출력층인 2층 퍼셉트론"}, {"id": "dl58", "s": "dl", "g": 3, "t": "mc", "q": "NAND 게이트를 만드는 가중치·임계값으로 알맞은 것은?", "h": 1, "o": ["w=(0.5, 0.5), θ=0.7", "w=(0.5, 0.5), θ=0.2", "w=(−0.5, −0.5), θ=−0.7", "w=(−1.0), θ=−0.5"], "a": 2, "e": "①AND ②OR ③NAND ④NOT"}, {"id": "dl59", "s": "dl", "g": 4, "t": "mc", "q": "출력이 0을 중심으로 대칭이라 Sigmoid보다 학습에 유리한 활성화 함수는?", "h": 1, "o": ["Step", "Tanh", "ReLU", "Softmax"], "a": 1, "e": ""}, {"id": "dl60", "s": "dl", "g": 4, "t": "mc", "q": "A(3×2) 행렬과 B(2×4) 행렬을 곱한 결과의 크기는?", "h": 1, "o": ["2×2", "3×4", "2×4", "곱할 수 없다"], "a": 1, "e": "(m×n)(n×p) = m×p"}, {"id": "dl61", "s": "dl", "g": 5, "t": "mc", "q": "다중 클래스 분류 신경망의 출력층 함수와 손실 함수 조합으로 가장 알맞은 것은?", "h": 1, "o": ["Identity + SSE", "Softmax + 교차 엔트로피", "ReLU + 교차 엔트로피", "Step + SSE"], "a": 1, "e": ""}, {"id": "dl62", "s": "dl", "g": 5, "t": "mc", "q": "다중 입력 → 다중 출력 신경망의 순전파에 쓰는 연산은?", "h": 1, "o": ["원소별 곱(ele_mul)", "벡터-행렬 곱(vect_mat_mul)", "외적(outer_prod)", "스칼라 덧셈"], "a": 1, "e": "단일입력→다중출력은 원소별 곱, 다중입력→단일출력은 가중합(내적)"}, {"id": "dl63", "s": "dl", "g": 6, "t": "mc", "q": "MNIST 이미지 한 장의 크기는?", "h": 1, "o": ["28×28", "32×32", "64×64", "224×224"], "a": 0, "e": "784차원 벡터로 펼칠 수 있음, 픽셀 0~255"}, {"id": "dl64", "s": "dl", "g": 6, "t": "mc", "q": "배치 크기가 <b>클 때<\/b>의 특징으로 옳은 것은?", "h": 1, "o": ["메모리 사용 감소", "기울기 노이즈 증가", "안정적인 기울기, 메모리 사용 증가", "학습 경로 불안정"], "a": 2, "e": ""}, {"id": "dl65", "s": "dl", "g": 7, "t": "mc", "q": "기울기 제곱의 지수 이동 평균으로 Adagrad의 학습률 감소 문제를 해결한 기법은?", "h": 1, "o": ["SGD", "Adagrad", "RMSprop", "미니배치 경사하강법"], "a": 2, "e": ""}, {"id": "dl66", "s": "dl", "g": 7, "t": "mc", "q": "학습률이 너무 <b>작을<\/b> 때 나타나는 현상은?", "h": 1, "o": ["발산", "최솟값을 지나쳐 튐", "학습이 매우 느리고 수렴이 오래 걸림", "즉시 수렴"], "a": 2, "e": ""}, {"id": "dl67", "s": "dl", "g": 7, "t": "mc", "q": "다중 입력 → 다중 출력 신경망 학습에서 weight_delta를 구하는 방법은?", "h": 1, "o": ["입력 벡터와 delta 벡터의 외적", "입력과 delta의 내적", "delta의 제곱", "입력의 전치"], "a": 0, "e": ""}, {"id": "dl68", "s": "dl", "g": 7, "t": "mc", "q": "수치 미분에서 일반적으로 쓰는 h 값은?", "h": 1, "o": ["1", "0.1", "약 10⁻⁵", "10⁻⁵⁰"], "a": 2, "e": "너무 크면 근사 오차, 너무 작으면 반올림 오차"}, {"id": "dl69", "s": "dl", "g": 3, "t": "essay", "q": "단층 퍼셉트론이 XOR 문제를 풀 수 없는 이유와 해결 방법을 서술하시오.", "h": 1, "k": ["(0,0)·(1,1)=0, (0,1)·(1,0)=1이 대각선으로 놓여 직선 하나로 분리 불가", "선형식을 조합해도 선형 → 단층으로는 비선형성 불가", "은닉층을 둔 다층 퍼셉트론: XOR = AND(NAND, OR)"]}, {"id": "dl70", "s": "dl", "g": 4, "t": "essay", "q": "신경망에서 활성화 함수가 비선형이어야 하는 이유를 서술하시오.", "h": 1, "k": ["활성화 함수가 없으면 a⁽ᴸ⁾ = W⁽ᴸ⁾⋯W⁽¹⁾a + b, 단일 선형 변환", "층을 쌓아도 단층 퍼셉트론처럼 선형 문제만 해결", "비선형 함수가 비선형성을 더해 XOR 같은 문제 해결"]}, {"id": "dl71", "s": "dl", "g": 4, "t": "essay", "q": "Sigmoid와 ReLU를 출력 범위, 장점, 단점으로 비교하시오.", "h": 1, "k": ["Sigmoid: (0,1), 확률 해석 가능 / 기울기 소실", "ReLU: [0,∞), 계산 단순·기울기 소실 거의 없음 / Dying ReLU", "은닉층은 주로 ReLU"]}, {"id": "dl72", "s": "dl", "g": 2, "t": "essay", "q": "지도학습과 비지도학습의 차이를 데이터, 목표, 예시로 서술하시오.", "h": 1, "k": ["지도: 라벨 있음, 입출력 관계 학습, 분류·예측 (선형 회귀, SVM, CNN)", "비지도: 라벨 없음, 숨은 패턴·구조 발견, 군집화·차원 축소 (K-평균, PCA)", "한계: 지도는 대규모 라벨 필요 / 비지도는 군집 의미 해석 어려움"]}, {"id": "dl73", "s": "dl", "g": 2, "t": "essay", "q": "매개변수적 학습과 비매개변수적 학습의 차이를 서술하시오.", "h": 1, "k": ["매개변수적: 매개변수 수 고정, 빠르고 해석 쉬움 (선형 회귀 y=ax+b, 신경망)", "비매개변수적: 데이터 크기에 따라 변함, 데이터를 저장해 비교 (K-NN, 결정 트리)", "복잡·비선형·대규모 데이터에 강하지만 계산량 증가·과적합 위험"]}, {"id": "dl74", "s": "dl", "g": 5, "t": "essay", "q": "Softmax 계산의 overflow 문제와 해결 방법을 서술하시오.", "h": 1, "k": ["z가 크면(예: 1000) e^z가 무한대가 되어 계산이 깨짐", "Log-Sum-Exp: 모든 입력에서 max(z)를 빼고 계산", "최대값이 0, 나머지는 음수 → e^값이 0~1, 결과는 동일"]}, {"id": "dl75", "s": "dl", "g": 6, "t": "essay", "q": "학습 데이터와 테스트 데이터를 나누는 이유를 서술하시오.", "h": 1, "k": ["학습 데이터: 가중치 최적화에 사용", "테스트 데이터: 학습에 쓰지 않은 데이터로 일반화 성능 검증", "나누지 않으면 과적합을 알아챌 수 없음"]}, {"id": "dl76", "s": "dl", "g": 6, "t": "essay", "q": "교차 엔트로피 손실에서 '−log'를 쓰는 의미를 서술하시오.", "h": 1, "k": ["원-핫 정답이라 정답 클래스의 예측 확률 하나만 계산", "정답 확률이 낮을수록 −log 값이 커져 큰 벌점 (y=1이면 손실 0)", "log 값이 음수라 −를 붙여 양수로 만듦"]}, {"id": "dl77", "s": "dl", "g": 7, "t": "essay", "q": "경사하강법의 갱신식을 쓰고 학습률이 미치는 영향을 서술하시오.", "h": 1, "k": ["θ := θ − α∇J(θ), 기울기는 증가 방향이므로 빼서 반대로 이동", "α 너무 크면 overshoot·발산, 너무 작으면 매우 느림", "보통 0.01~0.1에서 시작, 스케줄링·적응형 학습률(Adam 등)"]}, {"id": "dl78", "s": "dl", "g": 7, "t": "essay", "q": "실제 학습에서 수치 미분 대신 역전파를 쓰는 이유를 서술하시오.", "h": 1, "k": ["변수가 n개면 편미분을 n번 계산해야 해 계산량이 큼", "역전파는 계산 그래프로 기울기를 효율적으로 계산", "수치 미분은 기울기 계산이 맞는지 확인(디버깅)에 사용"]}, {"id": "dl79", "s": "dl", "g": 3, "t": "calc", "q": "퍼셉트론에서 x = (1, 1), w = (0.3, 0.4), θ = 0.7일 때 출력 y는?", "h": 1, "a": "y = 0", "steps": "가중합 = 1×0.3 + 1×0.4 = 0.7\n0.7 > 0.7 ? 아니오 (같음) → y = 0"}, {"id": "dl80", "s": "dl", "g": 3, "t": "calc", "q": "NAND 게이트(w = −0.5, −0.5, θ = −0.7)에 입력 (1, 0)을 넣으면 출력은?", "h": 1, "a": "1", "steps": "가중합 = −0.5×1 + −0.5×0 = −0.5\n−0.5 > −0.7 → 1"}, {"id": "dl81", "s": "dl", "g": 4, "t": "calc", "q": "벡터 내적 [3, 4]·[1, 2]의 값은?", "h": 1, "a": "11", "steps": "3×1 + 4×2 = 3 + 8 = 11"}, {"id": "dl82", "s": "dl", "g": 4, "t": "calc", "q": "[[1, 2], [3, 4]] · [[5, 6], [7, 8]]의 행렬 곱 결과는?", "h": 1, "a": "[[19, 22], [43, 50]]", "steps": "1·5+2·7=19   1·6+2·8=22\n3·5+4·7=43   3·6+4·8=50"}, {"id": "dl83", "s": "dl", "g": 5, "t": "calc", "q": "W = [[1, 2, 3], [4, 5, 6]], x = [0.1, 0.2, 0.3], b = [0.5, 0.6]일 때 z = W·x + b는?", "h": 1, "a": "[1.9, 3.8]", "steps": "W·x = [0.1+0.4+0.9, 0.4+1.0+1.8] = [1.4, 3.2]\n+ b → [1.9, 3.8]"}, {"id": "dl84", "s": "dl", "g": 4, "t": "calc", "q": "z = [−1, 3.2, 0.2]에 ReLU를 적용한 결과와, Sigmoid(0)의 값은?", "h": 1, "a": "ReLU → [0, 3.2, 0.2], Sigmoid(0) = 0.5", "steps": "ReLU = max(0, z)\nSigmoid(0) = 1 / (1 + e⁰) = 1/2"}, {"id": "dl85", "s": "dl", "g": 5, "t": "calc", "q": "z = [2.0, 1.0, 0.1]의 Softmax 값을 구하시오. (e² ≈ 7.39, e¹ ≈ 2.72, e⁰·¹ ≈ 1.11)", "h": 1, "a": "[0.659, 0.242, 0.099]", "steps": "합 = 7.39 + 2.72 + 1.11 ≈ 11.22\n7.39/11.22 ≈ 0.659\n2.72/11.22 ≈ 0.242\n1.11/11.22 ≈ 0.099   (합 = 1)"}, {"id": "dl86", "s": "dl", "g": 6, "t": "calc", "q": "y_true = [1, 0, 0], y_pred = [0.7, 0.2, 0.1]일 때 SSE와 교차 엔트로피(자연로그)를 구하시오. (ln 0.7 ≈ −0.357)", "h": 1, "a": "SSE = 0.07, CE ≈ 0.357", "steps": "SSE = ½[(1−0.7)² + (0−0.2)² + (0−0.1)²]\n    = ½(0.09 + 0.04 + 0.01) = 0.07\nCE = −(1·ln 0.7) ≈ 0.357  (정답 자리만 남음)"}, {"id": "dl87", "s": "dl", "g": 6, "t": "calc", "q": "MNIST 학습 데이터 60,000개를 배치 크기 128로 나누면 한 에폭에 몇 번 입력하는가?", "h": 1, "a": "469번", "steps": "60,000 / 128 = 468.75 → 올림 → 469\n(참고: 배치 64는 937.5 → 938)"}, {"id": "dl88", "s": "dl", "g": 1, "t": "calc", "q": "점수 [50, 60, 70, 80, 90]을 Min-Max 스케일링하면 70은 얼마가 되는가?", "h": 1, "a": "0.5", "steps": "(70 − 50) / (90 − 50) = 20 / 40 = 0.5"}, {"id": "dl89", "s": "dl", "g": 7, "t": "calc", "q": "f(x) = x², x = 2, h = 0.1일 때 전방 차분과 중앙 차분 값을 구하시오.", "h": 1, "a": "전방 4.1, 중앙 4.0 (참값 4)", "steps": "전방: (f(2.1) − f(2)) / 0.1 = (4.41 − 4) / 0.1 = 4.1\n중앙: (f(2.1) − f(1.9)) / 0.2 = (4.41 − 3.61) / 0.2 = 4.0"}, {"id": "dl90", "s": "dl", "g": 7, "t": "calc", "q": "J(θ) = θ², θ = 1, 학습률 α = 0.1일 때 경사하강법으로 한 번 갱신한 θ는?", "h": 1, "a": "θ = 0.8", "steps": "∇J = 2θ = 2\nθ := 1 − 0.1 × 2 = 0.8   (매번 0.8배 → 0으로 수렴)"}, {"id": "dl91", "s": "dl", "g": 7, "t": "calc", "q": "입력 8.5, 가중치 0.1, 예측 0.86, 정답 1, 학습률 0.01일 때 갱신된 가중치는?", "h": 1, "a": "0.1119", "steps": "delta = pred − true = 0.86 − 1 = −0.14\nweight_delta = delta × input = −0.14 × 8.5 = −1.19\nw = 0.1 − 0.01 × (−1.19) = 0.1119"}, {"id": "lx1-0-0", "s": "lx", "g": 1, "sub": "운영체제 개념 및 구성 요소", "fmt": "lx", "q": "소프트웨어 개발은 운영체제의 주요 기능 중 하나다.", "t": "ox", "a": false, "e": "OS 기능은 자원 관리, 프로세스 스케줄링, 사용자 인터페이스 제공."}, {"id": "lx1-0-1", "s": "lx", "g": 1, "sub": "운영체제 개념 및 구성 요소", "fmt": "lx", "q": "Oracle DB는 운영체제의 한 종류다.", "t": "ox", "a": false, "e": "Oracle DB는 DBMS."}, {"id": "lx1-0-2", "s": "lx", "g": 1, "sub": "운영체제 개념 및 구성 요소", "fmt": "lx", "q": "사용자 명령을 해석하는 것은 커널의 기능이다.", "t": "ox", "a": false, "e": "명령어 해석은 쉘의 기능."}, {"id": "lx1-0-3", "s": "lx", "g": 1, "sub": "운영체제 개념 및 구성 요소", "fmt": "lx", "q": "장치 드라이버는 일반적으로 커널 모듈 형태로 구현된다.", "t": "ox", "a": true, "e": ""}, {"id": "lx1-0-4", "s": "lx", "g": 1, "sub": "운영체제 개념 및 구성 요소", "fmt": "lx", "q": "리눅스는 모놀리틱 커널, 윈도우는 하이브리드 커널 구조다.", "t": "ox", "a": true, "e": ""}, {"id": "lx1-0-5", "s": "lx", "g": 1, "sub": "운영체제 개념 및 구성 요소", "fmt": "lx", "q": "마이크로 커널은 프로세스·메모리·파일시스템 등 OS 서비스를 하나의 커널에 통합한 구조다.", "t": "ox", "a": false, "e": "그건 모놀리틱 커널. 마이크로 커널은 최소 기능만 커널에 두고 나머지는 모듈로 분리."}, {"id": "lx1-0-6", "s": "lx", "g": 1, "sub": "운영체제 개념 및 구성 요소", "fmt": "lx", "q": "워드 프로세서는 OS 소프트웨어 구성 요소다.", "t": "ox", "a": false, "e": "응용 프로그램이다."}, {"id": "lx1-0-7", "s": "lx", "g": 1, "sub": "운영체제 개념 및 구성 요소", "fmt": "lx", "q": "사용자와 커널 사이를 중재하는 명령어 인터프리터는?", "t": "short", "a": "쉘 (Shell)", "keys": ["쉘", "셸", "shell"], "e": ""}, {"id": "lx1-0-8", "s": "lx", "g": 1, "sub": "운영체제 개념 및 구성 요소", "fmt": "lx", "q": "커널 전체를 다시 빌드하지 않고 기능을 동적으로 추가·제거할 수 있는 커널 코드 단위는?", "t": "short", "a": "커널 모듈", "keys": ["모듈", "module"], "e": ""}, {"id": "lx1-0-9", "s": "lx", "g": 1, "sub": "운영체제 개념 및 구성 요소", "fmt": "lx", "q": "용도별로 최적화된 커널 배포형(예: generic, lowlatency, server)을 무엇이라 하나?", "t": "short", "a": "커널 플래이버", "keys": ["플래이버", "플레이버", "flavor", "flavour"], "e": ""}, {"id": "lx1-0-10", "s": "lx", "g": 1, "sub": "운영체제 개념 및 구성 요소", "fmt": "lx", "q": "모놀리틱 커널의 장점은?", "t": "short", "a": "구조 단순성 (빠른 성능)", "keys": ["단순", "성능"], "e": ""}, {"id": "lx1-1-0", "s": "lx", "g": 1, "sub": "유닉스/리눅스 역사 및 철학", "fmt": "lx", "q": "1969년 켄 톰슨은 C 언어로 유닉스 첫 버전을 작성했다.", "t": "ox", "a": false, "e": "첫 버전은 어셈블리어. C로 재작성한 것은 1973년."}, {"id": "lx1-1-1", "s": "lx", "g": 1, "sub": "유닉스/리눅스 역사 및 철학", "fmt": "lx", "q": "1973년 유닉스를 C 언어로 재작성한 판은 제4판이다.", "t": "ox", "a": true, "e": ""}, {"id": "lx1-1-2", "s": "lx", "g": 1, "sub": "유닉스/리눅스 역사 및 철학", "fmt": "lx", "q": "GNU는 \"GNU's Not Unix\"의 재귀 약어다.", "t": "ox", "a": true, "e": ""}, {"id": "lx1-1-3", "s": "lx", "g": 1, "sub": "유닉스/리눅스 역사 및 철학", "fmt": "lx", "q": "MINIX는 리누스 토발즈가 만든 교육용 OS다.", "t": "ox", "a": false, "e": "MINIX는 앤드류 타넨바움(1987). 토발즈는 MINIX 영향으로 리눅 "s": "lx", "g": 3, "sub": "SSH · 가상 터미널 · gedit", "fmt": "lx", "q": "ssh 접속 형식은 ssh 도메인@계정 이다.", "t": "ox", "a": false, "e": "ssh 계정@도메인."}, {"id": "lx3-5-1", "s": "lx", "g": 3, "sub": "SSH · 가상 터미널 · gedit", "fmt": "lx", "q": "Telnet의 기본 포트는 23번이다.", "t": "ox", "a": true, "e": ""}, {"id": "lx3-5-2", "s": "lx", "g": 3, "sub": "SSH · 가상 터미널 · gedit", "fmt": "lx", "q": "gedit은 파일 시스템 관리 기능을 제공한다.", "t": "ox", "a": false, "e": "그건 Nautilus. gedit은 구문 강조 지원 텍스트 에디터."}, {"id": "lx3-5-3", "s": "lx", "g": 3, "sub": "SSH · 가상 터미널 · gedit", "fmt": "lx", "q": "Ctrl + Alt + F3 을 누르면 tty3으로 전환된다.", "t": "ox", "a": true, "e": ""}, {"id": "lx3-5-4", "s": "lx", "g": 3, "sub": "SSH · 가상 터미널 · gedit", "fmt": "lx", "q": "Ubuntu에 SSH를 설치하는 명령은?", "t": "short", "a": "sudo apt install ssh", "keys": ["aptinstallssh"], "e": ""}, {"id": "lx3-5-5", "s": "lx", "g": 3, "sub": "SSH · 가상 터미널 · gedit", "fmt": "lx", "q": "Windows에서 쓰는 대표 SSH 유틸리티는?", "t": "short", "a": "PuTTY", "keys": ["putty", "퍼티"], "e": ""}, {"id": "lx3-5-6", "s": "lx", "g": 3, "sub": "SSH · 가상 터미널 · gedit", "fmt": "lx", "q": "포트를 지정해 SSH 접속하는 명령 형식은?", "t": "short", "a": "ssh -p포트번호 계정@도메인", "keys": ["ssh-p"], "e": ""}, {"id": "lx3-5-7", "s": "lx", "g": 3, "sub": "SSH · 가상 터미널 · gedit", "fmt": "lx", "q": "VM 재설치 등으로 키가 바뀌어 경고가 날 때, 저장된 host 키를 제거하는 명령은?", "t": "short", "a": "ssh-keygen -R 호스트이름", "keys": ["sshkeygenr", "keygen"], "e": ""}, {"id": "lx3-5-8", "s": "lx", "g": 3, "sub": "SSH · 가상 터미널 · gedit", "fmt": "lx", "q": "gedit에서 저장 단축키는?", "t": "short", "a": "Ctrl + S", "keys": ["ctrls"], "e": ""}, {"id": "lx3-5-9", "s": "lx", "g": 3, "sub": "SSH · 가상 터미널 · gedit", "fmt": "lx", "q": "SSH의 목적과 기본 포트는?", "t": "short", "a": "보안(암호화) 원격 접속, 22번", "keys": ["22"], "e": ""}, {"id": "bdw1-ox1", "s": "bd", "g": 1, "t": "ox", "q": "디지털 트랜스포메이션의 'Transformation'은 기존에 추구해 온 변화보다 한층 높은 강도의 근본적인 변화와 변혁을 의미한다.", "src": "01 디지털 트랜스포메이션", "pre": 1, "a": true, "e": "강의에서 Transformation을 '변화, 변신 – 기존 변화보다 한층 높은 강도의 근본적인 변화와 변혁'으로 정의했다."}, {"id": "bdw1-ox2", "s": "bd", "g": 1, "t": "ox", "q": "아디다스 '스피드 팩토리'는 3D 프린팅·로봇·첨단자동화 장비로 제조공정을 혁신해, 근로자 10명으로 50만 켤레를 맞춤 생산했다.", "src": "01 디지털 트랜스포메이션", "pre": 1, "a": true, "e": "제조·유통비용의 혁신, 지역과 임금에 제약 없는 자동화된 중소형 공장 모델을 제시한 사례."}, {"id": "bdw1-ox3", "s": "bd", "g": 1, "t": "ox", "q": "오바마 캠페인 웹페이지 실험에서 가입 전환율이 가장 높았던 조합은 'Sign Up Now' 버튼과 'Barack's Video' 미디어였다.", "src": "01 디지털 트랜스포메이션 – 직관이 아닌 데이터로 선택하기", "pre": 1, "a": false, "e": "가장 높은 조합은 'Learn More' 버튼과 'Family Image'였다. 직관(동영상이 좋을 것)이 아닌 데이터로 선택해야 한다는 것이 이 사례의 요점이다."}, {"id": "bdw1-ox4", "s": "bd", "g": 1, "t": "ox", "q": "빅데이터는 기존의 정형화된 자료만을 의미하며, 이미지·동영상·텍스트 같은 비정형 자료는 포함하지 않는다.", "src": "02 빅데이터란?", "pre": 1, "a": false, "e": "빅데이터 = 정형 자료(Structured) + 비정형 자료(Unstructured). 비정형화된 이미지, 동영상, 문자, 언어, 위치정보 등을 포함한다."}, {"id": "bdw1-ox5", "s": "bd", "g": 1, "t": "ox", "q": "빅데이터의 3V는 Volume(크기), Variety(다양성), Value(가치)이다.", "src": "02 빅데이터란?", "pre": 1, "a": false, "e": "3V는 Volume·Variety·Velocity(속도). 여기에 2V인 Value(가치)와 Veracity(정확성)를 더해 5V라고 한다."}, {"id": "bdw1-ox6", "s": "bd", "g": 1, "t": "ox", "q": "하둡(Hadoop)과 NoSQL은 빅데이터 분석 단계 중 '저장(Store)' 단계의 대표 기술이다.", "src": "02 빅데이터란?", "pre": 1, "a": true, "e": "하둡의 분산형 파일 시스템/HBase/카산드라 등이 대표적 저장 기술이다. 분석 단계는 Hive, Mahout, R 등."}, {"id": "bdw1-sa1", "s": "bd", "g": 1, "t": "short", "q": "디지털 능력을 기반으로 새로운 비즈니스 모델, 제품, 서비스를 만들어 경영에 적용하고 주도하여 기업을 지속가능하게 하는 것을 무엇이라 하는가?", "src": "01 디지털 트랜스포메이션", "pre": 1, "a": "디지털 트랜스포메이션 (Digital Transformation)", "e": ""}, {"id": "bdw1-sa2", "s": "bd", "g": 1, "t": "short", "q": "빅데이터의 특징 중 '데이터 처리의 빠른 속도와 실시간 처리 가능성(사물인터넷 센서 데이터, 스트리밍 정보 증가)'을 뜻하는 것은?", "src": "02 빅데이터란?", "pre": 1, "a": "속도 (Velocity)", "e": "크기(Volume): 데이터 규모 / 다양성(Variety): 형태의 다양성 / 속도(Velocity): 생성·처리 속도."}, {"id": "bdw1-sa3", "s": "bd", "g": 1, "t": "short", "q": "빅데이터 5V 중 '빅데이터를 이용해 뽑아낸 데이터의 신뢰성'을 의미하는 것은?", "src": "02 빅데이터란?", "pre": 1, "a": "정확성 (Veracity)", "e": "Value(가치)는 '유의미한 가치를 갖는 지표'."}, {"id": "bdw1-sa4", "s": "bd", "g": 1, "t": "short", "q": "빅데이터 분석 단계를 순서대로 쓰시오. (4단계, 영문 또는 한글)", "src": "02 빅데이터란? · 05 정형데이터 활용사례", "pre": 1, "a": "수집(Collecting) → 저장(Store) → 분석(Analysis) → 시각화(Visualization)", "e": "5·6번 자료에서는 앞에 '해결하고자 하는 문제(Defined Business Need)', 뒤에 '가치(Value)'를 붙여 확장했다."}, {"id": "bdw1-sa5", "s": "bd", "g": 1, "t": "short", "q": "영국 일간지 '인디펜던트'가 종이신문 발행을 중단한 연도는?", "src": "01 디지털 트랜스포메이션", "pre": 1, "a": "2016년 (3월 26일)", "e": "스마트폰 이용자의 99%가 스마트폰으로 뉴스·생활정보를 확인하는 등 전통 미디어기업의 경쟁력 악화가 배경."}, {"id": "bdw1-es1", "s": "bd", "g": 1, "t": "essay", "q": "온라인 쇼핑몰에서 수집할 수 있는 정형 데이터와 비정형 데이터를 각각 예를 들어 서술하시오.", "src": "02 빅데이터란? · 09 데이터와 통계 분석(데이터 유형) · 08 데이터 수집", "pre": 1, "p": 1, "a": "[모범답안]\n• 정형 데이터: 행과 열의 고정된 구조를 가져 관계형 DB 테이블에 저장되고 SQL로 처리할 수 있는 데이터.\n  예) 회원정보(나이, 성별, 지역), 주문·결제 내역(주문번호, 상품코드, 수량, 금액, 일시), 상품 가격·재고 수량, 장바구니 목록, 반품 기록\n• 비정형 데이터: 정의된 구조가 없어 텍스트 마이닝·이미지 처리 등으로 분석하는 데이터.\n  예) 상품 리뷰·Q&A 텍스트, 고객센터 상담 채팅·통화 음성, 상품 사진·리뷰 이미지, 상품 소개 동영상, SNS 언급\n• (가산점) 반정형: 웹 로그, JSON/XML 형식의 클릭스트림 데이터", "e": "채점 포인트: ① 두 데이터의 정의(구조 유무) ② 각 2개 이상의 구체적 예 ③ 활용 방향(예: 주문 데이터로 구매 패턴 분석, 리뷰 텍스트로 감성 분석). 비정형은 전체 데이터의 70~85%를 차지한다는 점을 덧붙이면 좋다."}, {"id": "bdw1-es2", "s": "bd", "g": 1, "t": "essay", "q": "빅데이터의 특징 3V를 각각 설명하고, 데이터가 가치로 이어지는 과정을 서술하시오.", "src": "02 빅데이터란?", "pre": 1, "a": "[모범답안]\n• Volume(크기): IT 일상화로 디지털 정보량이 기하급수적으로 폭증. 분석 데이터의 크기뿐 아니라 새로운 형태의 데이터 포함.\n• Variety(다양성): 로그, SNS, 위치데이터 등 종류 증가, 문자·음성·동영상 등 비정형 데이터 유형의 다양화.\n• Velocity(속도): 사물인터넷 센서 데이터, 스트리밍 정보 증가로 데이터 생성·이동 속도 증가, 실시간 처리 필요.\n• 가치 창출 과정: 수집 → 저장 → 분석 → 시각화를 통해 이전에는 파악하지 못한 새로운 지식을 발견하거나 새로운 관계를 찾아 가치(Value)를 창출한다.", "e": ""}, {"id": "bdw2-ox1", "s": "bd", "g": 2, "t": "ox", "q": "데이터 엔지니어는 '데이터 자체와 데이터를 둘러싼 시스템을 책임지는 사람'이다.", "src": "03 데이터 사이언티스트·엔지니어 업무", "pre": 1, "a": true, "e": "데이터 파이프라인, 데이터 레이크/웨어하우스 구축, 플랫폼 개발 등을 담당한다."}, {"id": "bdw2-ox2", "s": "bd", "g": 2, "t": "ox", "q": "ETL 파이프라인은 적재(Load) → 변환(Transform) → 추출(Extract) 순으로 진행된다.", "src": "03 · 08", "pre": 1, "a": false, "e": "추출(Extraction) → 가공/변환(Transform) → 적재(Loading) 순서."}, {"id": "bdw2-ox3", "s": "bd", "g": 2, "t": "ox", "q": "데이터 레이크는 가공하지 않은 대용량 데이터를 한 곳에 모아 두는 저장소이다.", "src": "03 데이터 사이언티스트·엔지니어 업무", "pre": 1, "a": true, "e": "공통된 형식으로 가공해 저장하는 곳은 데이터 웨어하우스."}, {"id": "bdw2-ox4", "s": "bd", "g": 2, "t": "ox", "q": "의료 서비스 분야 데이터의 80% 이상은 정형 자료이다.", "src": "04 산업별 빅데이터 활용사례", "pre": 1, "a": false, "e": "검진, 질병, EMR, 유전자, 영상 자료 등 80% 이상이 비정형 자료이다."}, {"id": "bdw2-ox5", "s": "bd", "g": 2, "t": "ox", "q": "구글 독감 트렌드는 2013년 플루 대유행 시기에 140%의 오류를 보였고, 2015년 프로그램이 폐지되었다.", "src": "04 산업별 빅데이터 활용사례", "pre": 1, "a": true, "e": "검색어와 독감 환자 수 사이의 상관관계를 이용했지만 한계가 드러난 사례."}, {"id": "bdw2-ox6", "s": "bd", "g": 2, "t": "ox", "q": "씬 파일러(Thin Filer)는 금융 거래 기록이 풍부해 신용평가가 쉬운 고객을 말한다.", "src": "04 산업별 빅데이터 활용사례", "pre": 1, "a": false, "e": "금융 거래 정보가 부족해 신용등급 산정 시 불이익을 받는 사람(대학생, 사회초년생, 노년층 등)."}, {"id": "bdw2-ox7", "s": "bd", "g": 2, "t": "ox", "q": "데이터 사이언티스트가 수행하는 탐색적 데이터 분석(EDA)은 데이터를 다각도로 관찰하며 도출할 인사이트를 고민하고 부족한 부분을 보완하는 과정이다.", "src": "03 데이터 사이언티스트·엔지니어 업무", "pre": 1, "a": true, "e": ""}, {"id": "bdw2-sa1", "s": "bd", "g": 2, "t": "short", "q": "추출(Extraction), 변환(Transform), 적재(Loading)로 이루어진 데이터 가공 파이프라인을 영문 약어 3글자로 쓰시오.", "src": "03 · 08", "pre": 1, "a": "ETL", "e": ""}, {"id": "bdw2-sa2", "s": "bd", "g": 2, "t": "short", "q": "여러 데이터를 공통된 형식으로 변환해 저장하는 중앙집중형 통합 데이터 저장소는?", "src": "03 · 08", "pre": 1, "a": "데이터 웨어하우스 (Data Warehouse, DW)", "e": "특정 주제·부서별 데이터 집합은 데이터 마트(DM)."}, {"id": "bdw2-sa3", "s": "bd", "g": 2, "t": "short", "q": "'나와 평점 패턴이 비슷한 다른 사용자들이 좋아한 것'을 추천하는 기법(네이버 POI 맛집 추천 사례)은?", "src": "03 데이터 사이언티스트·엔지니어 업무", "pre": 1, "a": "협업 필터링 (Collaborative Filtering)", "e": ""}, {"id": "bdw2-sa4", "s": "bd", "g": 2, "t": "short", "q": "통신·쇼핑·연금 납부 기록 같은 비금융정보로 씬 파일러의 신용을 평가하는 시스템은? (영문 약어 가능)", "src": "04 산업별 빅데이터 활용사례", "pre": 1, "a": "대안신용평가시스템 (ACSS, Alternative Credit Scoring System)", "e": ""}, {"id": "bdw2-sa5", "s": "bd", "g": 2, "t": "short", "q": "사용자 유입부터 고객 전환까지의 단계별 수치 데이터를 무엇이라 하는가?", "src": "03 데이터 사이언티스트·엔지니어 업무", "pre": 1, "a": "퍼널 데이터 (Funnel data)", "e": "번개장터 데이터 엔지니어 인터뷰에서 수집 데이터 예로 제시."}, {"id": "bdw2-sa6", "s": "bd", "g": 2, "t": "short", "q": "서울시가 최근 3년 시계열을 관측해 신규 창업 위험도를 '정상·주의·위험·고위험' 4단계 색깔로 보여주는 서비스는?", "src": "04 산업별 빅데이터 활용사례 – 공공 분야", "pre": 1, "a": "상권 신호등 서비스 (창업위험도 예측 서비스)", "e": ""}, {"id": "bdw2-es1", "s": "bd", "g": 2, "t": "essay", "q": "데이터 사이언티스트와 데이터 엔지니어의 역할을 비교하여 서술하고, 두 직무가 어떻게 협업하는지 쓰시오.", "src": "03 데이터 사이언티스트·엔지니어 업무", "pre": 1, "a": "[모범답안]\n• 데이터 사이언티스트: 분석 방향 설정 → 데이터 수집 → 필터링·정제·전처리 → 탐색적 데이터 분석(EDA) → 깊이 있는 분석 기법(머신러닝 등) 적용으로 인사이트를 발굴하고 가치를 창출한다. 알고리즘 이론, 업종 지식, 인사이트 발굴 능력이 필요하다.\n• 데이터 엔지니어: 데이터 자체와 이를 둘러싼 시스템을 책임진다. ETL 파이프라인, 데이터 레이크·웨어하우스 구축, 데이터 플랫폼(수집·저장·분석·시각화 지원) 개발·운영. 인프라, 코딩, 데이터 모델링 지식이 필요하다.\n• 협업: 엔지니어가 구축한 파이프라인과 데이터 레이크/웨어하우스의 데이터를 사이언티스트가 분석하고, 사이언티스트가 만든 모델을 엔지니어가 서비스(API)에 적용한다. 두 직무는 데이터 가치 창출 과정에서 상호 보완적이다.", "e": ""}, {"id": "bdw2-es2", "s": "bd", "g": 2, "t": "essay", "q": "금융 분야에서 빅데이터가 활용되는 사례를 두 가지 이상 들어 서술하시오.", "src": "04 산업별 빅데이터 활용사례", "pre": 1, "a": "[모범답안 예시]\n• 고객 맞춤형 마케팅: 신한카드 마이샵, 삼성카드 LINK 등 개인별 소비 성향과 업종 트렌드를 분석해 이용 가능성이 높은 고객에게 타깃 마케팅.\n• 대안신용평가(ACSS): 금융 이력이 부족한 씬 파일러를 기저귀 구매 이력, 온라인 쇼핑 이력, 국민연금 납부 기록, 통신 정보 등으로 평가해 대출 기회 부여.\n• 인슈어테크: 레모네이드의 AI 보상처리 봇(3초 만에 보험금 처리), IoT 칫솔(beam) 양치 데이터로 보험료 산정.", "e": ""}, {"id": "bdw3-ox1", "s": "bd", "g": 3, "t": "ox", "q": "전기 에너지 소비량 분석 결과, 소비량은 월(月)·휴일보다 기온과 습도의 영향을 가장 크게 받았다.", "src": "05 정형데이터 활용사례", "pre": 1, "a": true, "e": "그래서 '여름'이 아니라 '고온·고습 조건' 중심의 절약 캠페인, 피크 시간대 요금 차등제를 제안했다."}, {"id": "bdw3-ox2", "s": "bd", "g": 3, "t": "ox", "q": "전기 에너지는 생산 후 대량으로 저장할 수 있으므로 소비량 예측의 중요성이 크지 않다.", "src": "05 정형데이터 활용사례", "pre": 1, "a": false, "e": "전기 에너지는 생산 후 저장할 수 없고, 부족하게 생산하면 큰 경제적 손실을 초래하므로 소비량 예측이 중요하다."}, {"id": "bdw3-ox3", "s": "bd", "g": 3, "t": "ox", "q": "야구장 일일 관중 수는 월요일·일요일 경기와 3~4월 시즌 초반에 증가하는 경향을 보였다.", "src": "05 정형데이터 활용사례", "pre": 1, "a": false, "e": "공휴일·금요일·5~6월·개막전 시리즈에서 증가하고, 3~4월·월요일·일요일·2022년 경기에서 적게 나타났다."}, {"id": "bdw3-ox4", "s": "bd", "g": 3, "t": "ox", "q": "선인장 식별 사례는 드론으로 촬영한 항공 사진, 즉 비정형 데이터를 활용한 분석이다.", "src": "06 비정형데이터 활용사례", "pre": 1, "a": true, "e": "멕시코 정부의 VIGIA 프로젝트. 이미지(JPG)와 레이블(CSV)을 함께 사용했다."}, {"id": "bdw3-ox5", "s": "bd", "g": 3, "t": "ox", "q": "선인장 식별 문제는 연속적인 수치를 예측하는 회귀(Regression) 문제이다.", "src": "06 비정형데이터 활용사례", "pre": 1, "a": false, "e": "has_cactus = 1(선인장) / 0(선인장 아님)을 구분하는 이진 분류(Binary Classification) 문제다."}, {"id": "bdw3-ox6", "s": "bd", "g": 3, "t": "ox", "q": "인공신경망 모델은 손실 함수(Loss) 값이 줄어드는 방향으로 학습한다.", "src": "06 비정형데이터 활용사례", "pre": 1, "a": true, "e": "Epoch이 진행되며 Loss가 감소하는 학습 곡선을 강의에서 보여 주었다."}, {"id": "bdw3-sa1", "s": "bd", "g": 3, "t": "short", "q": "정형·비정형 활용사례에서 빅데이터 분석 단계 맨 앞에 추가된 '해결하고자 하는 문제'를 정의하는 단계의 영문 명칭은?", "src": "05 · 06", "pre": 1, "a": "Defined Business Need", "e": "전체 흐름: Defined Business Need → Collecting → Store → Analysis → Visualization → Value"}, {"id": "bdw3-sa2", "s": "bd", "g": 3, "t": "short", "q": "야구장 관중 수 예측 모델의 설명력(R²)은 약 몇 %였는가?", "src": "05 정형데이터 활용사례", "pre": 1, "a": "약 78.9%", "e": ""}, {"id": "bdw3-sa3", "s": "bd", "g": 3, "t": "short", "q": "드론과 딥러닝 이미지 인식을 결합해 자연 보호 구역을 자율 감시한 멕시코 정부의 프로젝트 이름은?", "src": "06 비정형데이터 활용사례", "pre": 1, "a": "VIGIA 프로젝트", "e": ""}, {"id": "bdw3-sa4", "s": "bd", "g": 3, "t": "short", "q": "선인장 식별 데이터의 train.csv에서 정답(레이블)이 담긴 컬럼의 이름은?", "src": "06 비정형데이터 활용사례", "pre": 1, "a": "has_cactus", "e": "Id(이미지 파일명) + has_cactus(1/0)."}, {"id": "bdw3-sa5", "s": "bd", "g": 3, "t": "short", "q": "ChatGPT 질의 1회에 소비되는 전기 에너지(약 2.9Wh)는 기존 구글 검색의 약 몇 배 이상인가?", "src": "05 정형데이터 활용사례", "pre": 1, "a": "약 10배 이상", "e": ""}, {"id": "bdw3-es1", "s": "bd", "g": 3, "t": "essay", "q": "정형데이터 활용사례(전기 에너지 소비량)와 비정형데이터 활용사례(선인장 식별)를 '데이터 형태 – 분석 방법 – 창출된 가치' 관점에서 비교하여 서술하시오.", "src": "05 · 06", "pre": 1, "a": "[모범답안]\n• 데이터 형태: 전기 – ComEd 시간대별 전력 소비량 + 기온·상대습도·기압 등 행/열 구조의 정형 데이터(CSV). 선인장 – 드론 항공 사진(JPG 이미지) 비정형 데이터 + 레이블 CSV.\n• 분석 방법: 전기 – 변수 선택 후 회귀 계열 머신러닝 모델로 소비량 예측, 변수 중요도 분석. 선인장 – 이미지를 픽셀 숫자로 전처리 후 인공신경망(딥러닝)으로 이진 분류, 손실 함수를 줄이는 방향으로 학습.\n• 가치: 전기 – 피크 시간대 요금 차등제, 고온·고습 조건 중심 절약 캠페인, 발전기 출력·예비력 사전 최적화로 블랙아웃 방지. 선인장 – 현장 조사 인력 최소화, 대규모 지역 신속 분석, 객관적 생태 모니터링 체계 구축.", "e": ""}, {"id": "bdw4-ox1", "s": "bd", "g": 4, "t": "ox", "q": "분석 대상(what)과 분석 방법(how)을 모두 알고 있는 경우의 분석 유형은 '최적화(Optimization)'이다.", "src": "07 빅데이터 분석 기획", "pre": 1, "a": true, "e": "대상 known·방법 known → 최적화 / 대상 unknown·방법 known → 통찰 / 대상 known·방법 unknown → 솔루션 / 둘 다 unknown → 발견."}, {"id": "bdw4-ox2", "s": "bd", "g": 4, "t": "ox", "q": "상향식(데이터 주도) 접근법에서 데이터는 비즈니스 문제 해결을 가능하게 하는 '실행 동인(enabler)' 역할을 한다.", "src": "07 빅데이터 분석 기획", "pre": 1, "a": false, "e": "하향식(수요기반): 데이터 = 실행 동인(enabler). 상향식(데이터 주도): 데이터 = 비즈니스 변화를 이끄는 추진 동인(driver). 두 접근법은 상호 보완적."}, {"id": "bdw4-ox3", "s": "bd", "g": 4, "t": "ox", "q": "과제 기획 단계에서 필요한 데이터가 가용하지 않으면, 개념적 모델을 조정하거나 대안을 폐기한다.", "src": "07 빅데이터 분석 기획", "pre": 1, "a": true, "e": "데이터 가용 → 논리적 모델 설계로 진행."}, {"id": "bdw4-ox4", "s": "bd", "g": 4, "t": "ox", "q": "데이터 웨어하우스(DW)는 구매관리·판매관리처럼 특정 주제나 부서별로 구성한 데이터 집합이다.", "src": "08 빅데이터 분석 프로세스", "pre": 1, "a": false, "e": "특정 주제/부서별 데이터 집합은 데이터 마트(DM). DW는 중앙집중형 전사 데이터 통합 저장소."}, {"id": "bdw4-ox5", "s": "bd", "g": 4, "t": "ox", "q": "'성별' 컬럼에 남, male, M이 섞여 있는 것은 불일치(inconsistency)에 해당하며, 하나의 값으로 통일하여 정제한다.", "src": "08 빅데이터 분석 프로세스", "pre": 1, "a": true, "e": "결측치(누락), 이상치(정상 범위 이탈), 불일치(동일 속성 값 불일치), 잡음(무작위 오류)."}, {"id": "bdw4-ox6", "s": "bd", "g": 4, "t": "ox", "q": "독립변수는 현상의 결과가 되는 변수로, 결과변수 또는 반응변수라고도 한다.", "src": "08 빅데이터 분석 프로세스", "pre": 1, "a": false, "e": "독립변수 = 원인변수·설명변수. 종속변수 = 결과변수·반응변수."}, {"id": "bdw4-ox7", "s": "bd", "g": 4, "t": "ox", "q": "분류(Classification)와 회귀(Regression)는 지도학습, 군집화(Clustering)는 비지도학습에 속한다.", "src": "08 · 13", "pre": 1, "a": true, "e": ""}, {"id": "bdw4-sa1", "s": "bd", "g": 4, "t": "short", "q": "데이터 전처리(Data Preprocessing)의 정의를 쓰시오.", "src": "08 빅데이터 분석 프로세스", "pre": 1, "p": 1, "a": "분석 효율과 모델 성능 극대화를 위해 데이터를 처리하기 적합한 형태로 준비하는 모든 과정", "e": "정제(Cleaning), 데이터 축소(Reduction), 데이터 통합(Integration), 데이터 변환(Transformation) 등을 포함한다.\n참고 – 데이터 정제: 데이터의 정확성·완전성·일관성 확보를 위해 원본 데이터의 오류·불일치·불완전성을 수정하는 과정."}, {"id": "bdw4-sa2", "s": "bd", "g": 4, "t": "short", "q": "분석 대상과 방법을 모두 모르는 상태에서 미지의 새로운 기회나 위험을 찾아내는 분석 유형은? (예: 수요일에 기저귀 + 맥주 동시 구매 고객 증가)", "src": "07 빅데이터 분석 기획", "pre": 1, "a": "발견 (Discovery)", "e": ""}, {"id": "bdw4-sa3", "s": "bd", "g": 4, "t": "short", "q": "성공적 목표 달성을 위해 핵심적으로 관리해야 하는 요소들에 대한 성과지표를 영문 약어로 쓰시오.", "src": "07 빅데이터 분석 기획", "pre": 1, "a": "KPI (Key Performance Indicator, 핵심성과지표)", "e": ""}, {"id": "bdw4-sa4", "s": "bd", "g": 4, "t": "short", "q": "데이터 수집 및 분석을 통해서 검증하고자 하는 잠정적 가정을 무엇이라 하는가?", "src": "07 빅데이터 분석 기획", "pre": 1, "a": "가설 (Hypothesis)", "e": "예) '쿠폰을 제공하면 이탈율이 낮아질 것이다.'"}, {"id": "bdw4-sa5", "s": "bd", "g": 4, "t": "short", "q": "'월수입'(수백만 단위)과 '나이'(수십 단위)처럼 단위가 다른 변수들의 값 범위를 0~1 사이 등으로 일정하게 맞추는 전처리 기법은?", "src": "08 빅데이터 분석 프로세스", "pre": 1, "a": "스케일링 (Scaling, 예: Min-Max 정규화)", "e": "범주형 문자 → 숫자 변환은 인코딩, 새 변수 생성은 Feature Engineering."}, {"id": "bdw4-sa6", "s": "bd", "g": 4, "t": "short", "q": "과제 타당성 평가의 세 가지 관점을 쓰시오.", "src": "07 빅데이터 분석 기획", "pre": 1, "a": "경제적 타당성, 데이터 및 기술적 타당성, 운영적 타당성", "e": ""}, {"id": "bdw4-sa7", "s": "bd", "g": 4, "t": "short", "q": "분석 성숙도 사분면에서 준비도와 성숙도가 모두 높아 분석을 전사적으로 활용하는 유형은?", "src": "08 빅데이터 분석 프로세스", "pre": 1, "a": "확산형", "e": "준비형(둘 다 낮음) · 도입형(준비도↑ 성숙도↓) · 정착형(준비도↓ 성숙도↑) · 확산형(둘 다 높음)."}, {"id": "bdw4-sa8", "s": "bd", "g": 4, "t": "short", "q": "자동화된 SW 프로그램을 사용하여 World Wide Web을 체계적으로 탐색하고 정보를 수집하는 기술은?", "src": "08 빅데이터 분석 프로세스 · 02 빅데이터란?", "pre": 1, "a": "웹 크롤링 (Web Crawling)", "e": ""}, {"id": "bdw4-es1", "s": "bd", "g": 4, "t": "essay", "q": "분석 과제 발굴의 하향식 접근법과 상향식 접근법을 비교하여 서술하시오.", "src": "07 빅데이터 분석 기획", "pre": 1, "a": "[모범답안]\n• 하향식(Top-down, 수요기반, problem solving): 해결할 문제를 알고 있는 상태에서 출발. 비용 절감·품질/생산성 향상 등 KPI 개선을 추구하며, 문제 해결 시나리오를 정의하고 필요한 데이터와 분석 기법을 탐색한다. 데이터는 문제 해결을 가능하게 하는 '실행 동인(enabler)'.\n• 상향식(Bottom-up, 데이터 주도, problem creation): 운영 실적, 소셜·센서/IoT 등 축적된 데이터에서 출발. 데이터 간 연관분석·통합 시각화로 미지의 현상과 인사이트를 추출한다. 데이터는 비즈니스 변화를 이끄는 '추진 동인(driver)'.\n• 두 접근법은 상호 보완적 관계이다.", "e": ""}, {"id": "bdw4-es2", "s": "bd", "g": 4, "t": "essay", "q": "데이터 정제에서 처리하는 문제 데이터 네 가지를 쓰고, 각각의 처리 예시를 서술하시오.", "src": "08 빅데이터 분석 프로세스", "pre": 1, "a": "[모범답안]\n• 결측치: 누락된 데이터 → 삭제, 평균·중앙값·최빈값 대체, 회귀식 예측. 예) '나이' NA → 평균 나이로 대체\n• 이상치: 정상 범위를 벗어난 데이터 → 제거 또는 대체. 예) 월수입 9,999,999,999 → 중앙값으로 대체\n• 불일치: 동일 속성 값이 일치하지 않음 → 통일. 예) 남/male/M → Male\n• 잡음: 무작위적이거나 의미 없는 오류 → 이전 측정값으로 대체 또는 제거. 예) 허용 범위를 벗어난 온도", "e": ""}, {"id": "bdw5-ox1", "s": "bd", "g": 5, "t": "ox", "q": "모수(parameter)는 표본에 따라 값이 달라지는 확률 변수이다.", "src": "09 데이터와 통계 분석", "pre": 1, "a": false, "e": "모수: 모집단의 알기 어려운 참값, 고정된 상수. 통계량: 표본으로 계산한 값, 표본에 따라 변하는 확률 변수."}, {"id": "bdw5-ox2", "s": "bd", "g": 5, "t": "ox", "q": "전수조사는 모집단 전부를 조사하므로 표본오차가 없다.", "src": "09 데이터와 통계 분석", "pre": 1, "a": true, "e": "대신 조사 비용, 시간, 범위가 크다. 예) 인구주택총조사."}, {"id": "bdw5-ox3", "s": "bd", "g": 5, "t": "ox", "q": "구간(등간)척도는 절대 0이 존재하므로 사칙연산이 모두 가능하다.", "src": "09 데이터와 통계 분석", "pre": 1, "a": false, "e": "구간척도는 간격이 동일하지만 절대 0이 없다(온도, IQ). 절대 0이 있고 사칙연산이 가능한 것은 비율척도(길이, 무게, 소득)."}, {"id": "bdw5-ox4", "s": "bd", "g": 5, "t": "ox", "q": "전체 데이터 중 정형 데이터가 차지하는 비율은 약 70~85%이다.", "src": "09 데이터와 통계 분석", "pre": 1, "a": false, "e": "정형 10~20%, 반정형 5~10%, 비정형 70~85%."}, {"id": "bdw5-ox5", "s": "bd", "g": 5, "t": "ox", "q": "유의확률(p-value)이 유의수준(α)보다 작으면 귀무가설을 기각하고 대립가설을 채택한다.", "src": "10 통계적 추정과 검정", "pre": 1, "a": true, "e": "p-value ≥ α 이면 H0 기각 실패(H0 유지)."}, {"id": "bdw5-ox6", "s": "bd", "g": 5, "t": "ox", "q": "세 개 이상 집단의 평균 차이를 비교할 때는 t-검정을 사용한다.", "src": "10 통계적 추정과 검정", "pre": 1, "a": false, "e": "t-검정: 두 집단 평균 비교 / F-검정(분산분석, ANOVA): 세 개 이상 집단 평균 비교 / χ²-검정: 빈도·비율 차이(질적 변수)."}, {"id": "bdw5-ox7", "s": "bd", "g": 5, "t": "ox", "q": "제1종 오류는 옳은 귀무가설을 기각하는 오류로, '생산자 위험'이라고도 한다.", "src": "10 통계적 추정과 검정", "pre": 1, "a": true, "e": "예) 정상 제품을 불량품으로 판정. 제2종 오류(β, 소비자 위험)는 틀린 귀무가설을 채택하는 오류."}, {"id": "bdw5-sa1", "s": "bd", "g": 5, "t": "short", "q": "척도는 명목척도 → 서열(순서)척도 → 등간(구간)척도 → (   ) 순으로 정보 수준이 높아진다. 빈칸에 들어갈 척도의 이름은?", "src": "09 데이터와 통계 분석", "pre": 1, "p": 1, "a": "비율척도 (ratio scale)", "e": "절대 0이 있고 사칙연산이 가능. 예) 길이, 무게, 시간, 소득. 명목·서열 = 질적(범주형), 등간·비율 = 양적(연속형)."}, {"id": "bdw5-sa2", "s": "bd", "g": 5, "t": "short", "q": "혈액형·성별처럼 대상을 확인·분류만 하는 척도의 이름과, 이 척도에서 중심위치를 나타내는 대푯값을 쓰시오.", "src": "09 데이터와 통계 분석", "pre": 1, "a": "명목척도 / 최빈값", "e": "순서척도 → 중앙값, 구간·비율척도 → 평균."}, {"id": "bdw5-sa3", "s": "bd", "g": 5, "t": "short", "q": "학생 3명의 점수가 95, 90, 85점인 표본의 표본분산과 표본표준편차를 구하시오.", "src": "09 데이터와 통계 분석", "pre": 1, "a": "표본분산 s² = 25, 표본표준편차 s = 5점", "e": "평균 90. 편차제곱합 = 25 + 0 + 25 = 50. 표본분산은 n−1로 나눔 → 50 / 2 = 25. s = √25 = 5."}, {"id": "bdw5-sa4", "s": "bd", "g": 5, "t": "short", "q": "문서 내 특정 단어의 중요도를 숫자 벡터로 변환하는 텍스트 마이닝 기법(Term Frequency–Inverse Document Frequency)의 약어는?", "src": "09 데이터와 통계 분석", "pre": 1, "a": "TF-IDF", "e": "비정형 데이터도 정형 데이터로 변환한 뒤 분석한다는 예시."}, {"id": "bdw5-sa5", "s": "bd", "g": 5, "t": "short", "q": "선거 출구조사에서 '투표자 5명마다 1명씩' 등간격으로 표본을 뽑는 추출 방법은?", "src": "09 데이터와 통계 분석", "pre": 1, "a": "계통추출 (계통 표본추출)", "e": ""}, {"id": "bdw5-sa6", "s": "bd", "g": 5, "t": "short", "q": "통계적으로 기각하고자 하는 대상인 '기존의 주장'을 나타내는 가설은?", "src": "10 통계적 추정과 검정", "pre": 1, "a": "귀무가설 (H0, 영가설)", "e": "입증하려는 주장은 대립가설(H1, 연구가설)."}, {"id": "bdw5-sa7", "s": "bd", "g": 5, "t": "short", "q": "실제 암 환자를 정상으로 판정하는 오류의 이름과, 1에서 그 확률을 뺀 값(1−β)의 명칭을 쓰시오.", "src": "10 통계적 추정과 검정", "pre": 1, "a": "제2종 오류(β 오류, 소비자 위험) / 검정력", "e": ""}, {"id": "bdw5-sa8", "s": "bd", "g": 5, "t": "short", "q": "남녀 대학생 간 디저트 메뉴 선호도(범주형 변수)에 차이가 있는지 검정하는 방법은?", "src": "10 통계적 추정과 검정", "pre": 1, "a": "χ²-검정 (카이제곱 검정)", "e": ""}, {"id": "bdw5-sa9", "s": "bd", "g": 5, "t": "short", "q": "바람직한 추정량이 갖추어야 할 세 가지 성질을 쓰시오.", "src": "10 통계적 추정과 검정", "pre": 1, "a": "불편성(Unbiasedness), 효율성(Efficiency), 일치성(Consistency)", "e": ""}, {"id": "bdw5-es1", "s": "bd", "g": 5, "t": "essay", "q": "기술통계와 추론통계를 비교하고, 추론통계의 두 가지 방법(추정, 검정)을 서술하시오.", "src": "09 · 10", "pre": 1, "a": "[모범답안]\n• 기술통계: '무슨 일이 일어났는가?' 데이터의 특성을 정리·요약·시각화(평균, 분산, 그래프).\n• 추론통계: '왜 일어났고 전체에 적용 가능한가?' 표본의 통계량으로 모집단의 모수를 추론.\n  – 추정: 표본 데이터로 모집단의 특성(평균, 비율)이 '대략 얼마일까'를 찾는 과정. 점추정(한 값) / 구간추정(신뢰구간). 예) 출구조사 51.7% ± 0.8%p.\n  – 검정: 모집단에 대한 가설이 '통계적으로 믿을 만한가'를 판단. 귀무·대립가설 수립 → 검정통계량 계산 → 유의수준·기각역으로 기각 여부 판정.", "e": ""}, {"id": "bdw5-es2", "s": "bd", "g": 5, "t": "essay", "q": "제1종 오류와 제2종 오류를 정의하고, 각각의 예를 드시오.", "src": "10 통계적 추정과 검정", "pre": 1, "a": "[모범답안]\n• 제1종 오류(α, 생산자 위험): 귀무가설이 옳은데 기각하는 오류. 예) 정상 제품을 불량품으로 판정, 건강한 사람을 암 환자로 판정. 신뢰도 = 1−α.\n• 제2종 오류(β, 소비자 위험): 귀무가설이 틀렸는데 채택하는 오류. 예) 불량 제품을 정상으로 판정, 실제 암 환자를 정상으로 판정. 검정력 = 1−β.", "e": ""}, {"id": "bdw6-ox1", "s": "bd", "g": 6, "t": "ox", "q": "두 변수 사이에 상관관계가 있으면 반드시 인과관계도 존재한다.", "src": "11 상관분석과 회귀분석", "pre": 1, "a": false, "e": "인과관계 ⊂ 상관관계. 아이스크림 판매량과 익사 사고처럼 우연한 상관도 있다. 콜센터 사례: 데이터로 도출되는 인사이트는 상관관계까지만 알려준다."}, {"id": "bdw6-ox2", "s": "bd", "g": 6, "t": "ox", "q": "상관계수 r = −0.85는 강한 음(−)의 상관관계를 의미한다.", "src": "11 상관분석과 회귀분석", "pre": 1, "a": true, "e": "−1 ≤ r < −0.7: 강한 음의 상관 / −0.7 ≤ r < −0.3: 약한 음의 상관 / −0.3 ≤ r < 0: 거의 상관 없음."}, {"id": "bdw6-ox3", "s": "bd", "g": 6, "t": "ox", "q": "최소제곱법은 잔차의 합을 최대화하는 회귀선을 찾는 방법이다.", "src": "11 상관분석과 회귀분석", "pre": 1, "a": false, "e": "잔차제곱합(Σeᵢ²)을 최소화한다."}, {"id": "bdw6-ox4", "s": "bd", "g": 6, "t": "ox", "q": "결정계수 R²는 0과 1 사이의 값을 가지며, 1에 가까울수록 회귀모형의 설명력이 높다.", "src": "11 상관분석과 회귀분석", "pre": 1, "a": true, "e": "R² = SSR/SST = 1 − SSE/SST."}, {"id": "bdw6-ox5", "s": "bd", "g": 6, "t": "ox", "q": "연관규칙의 향상도(Lift)가 1보다 작으면 두 상품은 보완재 관계이다.", "src": "12 데이터 마이닝 개요", "pre": 1, "a": false, "e": "Lift = 1: 독립 / Lift > 1: 양의 상관(보완재) / Lift < 1: 음의 상관(대체재)."}, {"id": "bdw6-ox6", "s": "bd", "g": 6, "t": "ox", "q": "연관분석과 군집화는 '기술(descriptive)' 모델, 분류와 회귀는 '예측(predictive)' 모델이다.", "src": "12 데이터 마이닝 개요", "pre": 1, "a": true, "e": ""}, {"id": "bdw6-ox7", "s": "bd", "g": 6, "t": "ox", "q": "Rapidminer는 Drag & Drop 방식의 Low-code/No-code 데이터 분석 플랫폼이다.", "src": "12 데이터 마이닝 개요", "pre": 1, "a": true, "e": "2001년 Dortmund 대학 YALE 프로젝트에서 출발, 2025년 Siemens 인수."}, {"id": "bdw6-sa1", "s": "bd", "g": 6, "t": "short", "q": "재구매율 = 16.1 × (만족도) + 3.94 라는 회귀식에서 만족도가 4.7이 되면 예측 재구매율은 몇 %인가?", "src": "11 상관분석과 회귀분석", "pre": 1, "a": "79.61%", "e": "16.1 × 4.7 = 75.67, 75.67 + 3.94 = 79.61"}, {"id": "bdw6-sa2", "s": "bd", "g": 6, "t": "short", "q": "표본으로부터 추정한 회귀선과 실제 관측값의 차이를 무엇이라 하는가?", "src": "11 상관분석과 회귀분석", "pre": 1, "a": "잔차 (residual)", "e": ""}, {"id": "bdw6-sa3", "s": "bd", "g": 6, "t": "short", "q": "어떤 회귀모형의 총변동 SST = 200, 잔차변동 SSE = 50 일 때 결정계수 R²는?", "src": "11 상관분석과 회귀분석", "pre": 1, "a": "0.75", "e": "R² = 1 − SSE/SST = 1 − 50/200 = 0.75"}, {"id": "bdw6-sa4", "s": "bd", "g": 6, "t": "short", "q": "연관규칙 X→Y의 평가 지표 세 가지를 쓰시오.", "src": "12 데이터 마이닝 개요", "pre": 1, "a": "지지도(Support), 신뢰도(Confidence), 향상도(Lift)", "e": ""}, {"id": "bdw6-sa5", "s": "bd", "g": 6, "t": "short", "q": "다음 5건의 거래에서 규칙 {우유} → {빵}의 지지도, 신뢰도, 향상도를 구하시오.\n① 우유, 빵  ② 우유, 기저귀, 맥주  ③ 빵, 버터  ④ 우유, 빵, 버터  ⑤ 우유, 기저귀, 빵", "src": "12 데이터 마이닝 개요", "pre": 1, "a": "지지도 0.6, 신뢰도 0.75, 향상도 약 0.94", "e": "P(우유)=4/5=0.8, P(빵)=4/5=0.8, P(우유∩빵)=3/5=0.6\n신뢰도 = 0.6 / 0.8 = 0.75\n향상도 = 0.75 / 0.8 = 0.9375 (1보다 작음 → 약한 음의 관계)"}, {"id": "bdw6-sa6", "s": "bd", "g": 6, "t": "short", "q": "위 5건의 거래에서 규칙 {기저귀} → {우유}의 신뢰도와 향상도를 구하시오.", "src": "12 데이터 마이닝 개요", "pre": 1, "a": "신뢰도 1.0, 향상도 1.25", "e": "P(기저귀)=2/5=0.4, P(기저귀∩우유)=2/5=0.4 → 신뢰도 = 0.4/0.4 = 1.0\n향상도 = 1.0 / P(우유)0.8 = 1.25"}, {"id": "bdw6-sa7", "s": "bd", "g": 6, "t": "short", "q": "Excel/Google Sheets에서 두 변수 범위의 Pearson 상관계수를 구하는 함수는?", "src": "11 상관분석과 회귀분석", "pre": 1, "a": "CORREL( )", "e": "선형회귀식은 LINEST( )."}, {"id": "bdw6-es1", "s": "bd", "g": 6, "t": "essay", "q": "상관관계와 인과관계의 차이를 설명하고, 상관분석과 회귀분석의 목적을 비교하여 서술하시오.", "src": "11 상관분석과 회귀분석", "pre": 1, "a": "[모범답안]\n• 상관관계: 두 변수가 일정한 방향과 강도로 함께 변화하는 경향. 원인-결과를 의미하지 않는다. 인과관계: 한 변수가 다른 변수의 원인이 되는 관계로 상관관계의 부분집합.\n• 상관분석: 두 양적 변수 간 선형 관계의 방향과 강도를 Pearson 상관계수 r(−1~1)로 측정.\n• 회귀분석: 독립변수(원인)와 종속변수(결과)의 함수관계를 회귀식(Y = a + bX + e)으로 추정해 예측에 활용. 최소제곱법으로 추정하고 결정계수 R²로 설명력을 평가.\n• 예: 콜센터 조기 퇴사자 분석은 특정 특성과 퇴사율의 상관관계만 알려줄 뿐 인과관계를 알려주지 않는다.", "e": ""}, {"id": "bdw6-es2", "s": "bd", "g": 6, "t": "essay", "q": "연관규칙의 지지도·신뢰도·향상도의 의미를 쓰고, 연관분석의 활용 분야를 두 가지 이상 서술하시오.", "src": "12 데이터 마이닝 개요", "pre": 1, "a": "[모범답안]\n• 지지도: 전체 거래 중 X와 Y가 함께 포함된 거래 비율, P(X∩Y). 얼마나 자주 나타나는가.\n• 신뢰도: X가 포함된 거래 중 Y도 포함된 비율, P(Y|X). 규칙의 강도.\n• 향상도: P(Y|X)/P(Y). X, Y가 독립일 때보다 얼마나 자주 함께 발생하는가. 1이면 독립, >1 보완재, <1 대체재.\n• 활용: 교차 판매, 묶음 판매(맥주와 기저귀), 상품 진열 배치, 웹 로그 분석, 의료 진단, 부정 탐지.", "e": ""}, {"id": "bdw7-ox1", "s": "bd", "g": 7, "t": "ox", "q": "의사결정나무에서 노드 분할이 많이 될수록 노드의 불순도(impurity) 값은 작아진다.", "src": "13 분류와 군집화", "pre": 1, "p": 1, "a": true, "e": "노드 분할의 목표가 '불순도 최소화'이므로 분할할수록 각 노드는 순수해진다. 단, 지나치게 분할하면 과적합이 생기므로 가지치기(pruning)를 한다. (OX 판정 시 '분할 ↔ 불순도 감소' 관계를 묻는 문제로 해석)"}, {"id": "bdw7-ox2", "s": "bd", "g": 7, "t": "ox", "q": "지니(Gini) 지수가 0이면 노드 안의 데이터가 모두 같은 클래스(완전 순수)라는 뜻이다.", "src": "13 분류와 군집화", "pre": 1, "a": true, "e": "Gini = 1 − Σpᵢ². 두 클래스가 반반이면 0.5로 가장 불순."}, {"id": "bdw7-ox3", "s": "bd", "g": 7, "t": "ox", "q": "분류(Classification)는 비지도학습이고, 군집화(Clustering)는 지도학습이다.", "src": "13 분류와 군집화", "pre": 1, "a": false, "e": "분류 = 정답(레이블)이 있는 지도학습, 군집화 = 레이블 없이 유사한 것끼리 묶는 비지도학습."}, {"id": "bdw7-ox4", "s": "bd", "g": 7, "t": "ox", "q": "k-means 군집화는 군집 수 k를 미리 정해야 하며, 초기 중심점에 따라 결과가 달라질 수 있다.", "src": "13 분류와 군집화", "pre": 1, "a": true, "e": "장점: 빠르고 쉽게 처리. 단점: k 사전 지정, 초기값 의존."}, {"id": "bdw7-ox5", "s": "bd", "g": 7, "t": "ox", "q": "계층적 군집분석에서는 한 번 특정 군집에 속한 개체도 이후 다른 군집으로 이동할 수 있다.", "src": "13 분류와 군집화", "pre": 1, "a": false, "e": "계층적 군집분석은 개체가 소속된 군집을 변경할 수 없고, 데이터가 많으면 분석이 어렵다."}, {"id": "bdw7-ox6", "s": "bd", "g": 7, "t": "ox", "q": "CART 알고리즘은 χ² 통계량을 최대화하는 기준으로 노드를 분할한다.", "src": "13 분류와 군집화", "pre": 1, "a": false, "e": "CART: Gini 지수 최소화(이진 분할) / C4.5: 정보이득비율 최대화 / CHAID: χ² 통계량 최대화."}, {"id": "bdw7-ox7", "s": "bd", "g": 7, "t": "ox", "q": "의사결정나무는 선형성·정규성·등분산성 가정이 필요한 모수적 모형이다.", "src": "13 분류와 군집화", "pre": 1, "a": false, "e": "가정이 불필요한 비모수적 모형이다(장점)."}, {"id": "bdw7-ox8", "s": "bd", "g": 7, "t": "ox", "q": "Manhattan 거리는 이상치가 많은 수치형 데이터에, Cosine 유사도는 텍스트·단어 빈도 데이터에 적합하다.", "src": "13 분류와 군집화", "pre": 1, "a": true, "e": "Euclidean: 정규화된 수치형·위치 정보 / Jaccard: 두 집합 사이 유사도."}, {"id": "bdw7-sa1", "s": "bd", "g": 7, "t": "short", "q": "두 점 A(2, 3), B(5, 7) 사이의 Euclidean 거리를 구하시오.", "src": "13 분류와 군집화 – 유사도 측정", "pre": 1, "p": 1, "a": "5", "e": "d = √((5−2)² + (7−3)²) = √(9 + 16) = √25 = 5\n(같은 두 점의 Manhattan 거리는 |5−2| + |7−3| = 7)"}, {"id": "bdw7-sa2", "s": "bd", "g": 7, "t": "short", "q": "새 데이터 N(5, 5)와 학습 데이터 A(2, 6) 사이의 Euclidean 거리를 소수 셋째 자리까지 구하시오.", "src": "13 분류와 군집화 – 유사도 측정", "pre": 1, "p": 1, "a": "3.162", "e": "√((5−2)² + (5−6)²) = √(9 + 1) = √10 ≈ 3.162\n(강의 예제: N과 B(3,7)의 거리는 √8 ≈ 2.828이므로 N은 B에 더 가깝다)"}, {"id": "bdw7-sa3", "s": "bd", "g": 7, "t": "short", "q": "강아지 6마리, 고양이 2마리가 들어 있는 노드의 지니 지수를 구하시오.", "src": "13 분류와 군집화", "pre": 1, "a": "0.375", "e": "Gini = 1 − (0.75² + 0.25²) = 1 − (0.5625 + 0.0625) = 0.375"}, {"id": "bdw7-sa4", "s": "bd", "g": 7, "t": "short", "q": "정밀도(Precision)와 재현율(Recall)의 조화평균으로 계산하는 이진분류 성능 지표는?", "src": "13 분류와 군집화", "pre": 1, "a": "F1 Score", "e": "F1 = 2 × (Precision × Recall) / (Precision + Recall), 1에 가까울수록 우수."}, {"id": "bdw7-sa5", "s": "bd", "g": 7, "t": "short", "q": "모델이 훈련 데이터에 지나치게 최적화되어 새로운 데이터에 대한 예측 능력이 떨어지는 현상과, 의사결정나무에서 이를 막기 위해 가지를 제거하는 과정을 쓰시오.", "src": "13 분류와 군집화", "pre": 1, "a": "과적합(Overfitting) / 가지치기(Pruning)", "e": ""}, {"id": "bdw7-sa6", "s": "bd", "g": 7, "t": "short", "q": "데이터를 k개의 소그룹으로 나누어 k번 반복 학습·평가한 뒤 성능지표를 평균하는 방법은?", "src": "13 분류와 군집화", "pre": 1, "a": "k-fold 교차검증 (교차분석)", "e": ""}, {"id": "bdw7-sa7", "s": "bd", "g": 7, "t": "short", "q": "계층적 군집분석의 단계적 군집 형성 과정을 나무 모양으로 나타낸 그림은?", "src": "13 분류와 군집화", "pre": 1, "a": "덴드로그램 (Dendrogram, 계통도·수상도)", "e": ""}, {"id": "bdw7-sa8", "s": "bd", "g": 7, "t": "short", "q": "여러 개의 의사결정나무를 만들어 다수결 또는 평균으로 예측하는 앙상블 기법은?", "src": "13 분류와 군집화", "pre": 1, "a": "랜덤 포레스트 (Random Forest)", "e": ""}, {"id": "bdw7-sa9", "s": "bd", "g": 7, "t": "short", "q": "Rapidminer에서 Excel 파일을 읽고 누락 데이터를 평균값으로 대체할 때 사용하는 두 연산자를 쓰시오.", "src": "14 데이터 마이닝 실습", "pre": 1, "a": "Read Excel, Replace Missing Values", "e": ""}, {"id": "bdw7-es1", "s": "bd", "g": 7, "t": "essay", "q": "분류와 군집화의 차이를 설명하고, k-means 군집화의 절차를 서술하시오.", "src": "13 분류와 군집화", "pre": 1, "a": "[모범답안]\n• 분류: 지도학습. 정답(레이블)이 있는 데이터로 학습해 새 데이터가 속하는 클래스를 예측. 예) 스팸/정상 메일, k-NN, 의사결정나무.\n• 군집화: 비지도학습. 레이블 없이 특성이 유사한 개체끼리 묶음. 군집 내 유사도 최대(동질성), 군집 간 유사도 최소(이질성). 예) 구매 패턴에 따른 고객 그룹화.\n• k-means 절차: ① 군집 수 k 선택 ② 각 군집의 중심점을 무작위 선택 ③ 각 데이터를 가장 가까운 중심점에 할당 ④ 중심점을 군집 평균으로 업데이트 ⑤ 중심점이 더 이상 변하지 않으면(또는 최대 반복 도달) 종료.", "e": ""}, {"id": "bdw7-es2", "s": "bd", "g": 7, "t": "essay", "q": "의사결정나무의 분석 과정과 장·단점을 서술하시오.", "src": "13 분류와 군집화", "pre": 1, "a": "[모범답안]\n• 분석 과정: Tree 성장(분할 기준·종료 규칙 설정, 불순도 최소화) → 가지치기(과적합 방지) → 타당성 평가(검증용 자료, 교차 타당성) → 해석 및 예측.\n• 장점: 주요 변수 선정 용이, 교호효과 해석, 비모수적 모형(가정 불필요), 해석이 쉬움, 규칙(Rule) 추출 가능.\n• 단점: 연속형 변수를 비연속적으로 취급해 경계에서 오류 가능, 선형·주효과 결여, 불안정성, 가지 수 과다(과적합), 컴퓨팅 비용.", "e": ""}, {"id": "jv0", "s": "jv", "g": 2, "t": "code", "kind": "word", "topic": "기본", "src": "예제 2-6 · InputExample.java", "q": "이름 \"miracle java\"(공백 포함)를 한 줄 통째로 입력받으려면 빈칸 ①에 들어갈 메서드는?", "files": [{"name": "InputExample.java", "code": "package sec01.exam06;\n\nimport java.util.Scanner;                      // java.util 패키지 가져오기\n\npublic class InputExample {\n    public static void main(String[] args) {\n        Scanner sin = new Scanner(System.in);   // Scanner 객체 sin 만들기\n\n        System.out.print(\"정수를 입력하세요: \");\n        int price = sin.nextInt();              // 정수형 입력받기\n        System.out.println(\"입력한 정수: \" + price);\n\n        System.out.print(\"실수를 입력하세요: \");\n        double weight = sin.nextDouble();       // 실수형 입력받기\n        System.out.println(\"입력한 실수: \" + weight);\n\n        sin.nextLine();                         // 버퍼 비우기\n        System.out.print(\"이름을 입력하세요: \");\n        String name = sin.@@();           // 한 줄 입력받기\n        System.out.println(\"입력한 이름: \" + name);\n\n        System.out.print(\"참/거짓 (true/false)를 입력하세요: \");\n        boolean isFry = sin.nextBoolean();      // 불리언 입력받기\n        System.out.println(\"입력한 값: \" + isFry);\n\n        sin.close();                            // Scanner 객체 sin 닫기\n    }\n}"}], "out": "이름을 입력하세요: miracle java\n입력한 이름: miracle java", "blanks": [{"o": ["next", "nextLine", "readLine", "nextString"], "a": 1, "e": "<code>next()<\/code>는 공백 앞까지만 읽으므로 \"miracle\"만 저장됩니다. Scanner에는 <code>readLine()<\/code>, <code>nextString()<\/code> 메서드가 없습니다."}]}, {"id": "jv1", "s": "jv", "g": 2, "t": "code", "kind": "word", "topic": "기본", "src": "예제 2-6 · InputExample.java", "q": "nextDouble() 뒤에 남은 엔터(줄바꿈)를 비워 다음 입력이 정상적으로 되게 하는 빈칸 ①은?", "files": [{"name": "InputExample.java (13~20행)", "start": 13, "code": "        System.out.print(\"실수를 입력하세요: \");\n        double weight = sin.nextDouble();       // 실수형 입력받기\n        System.out.println(\"입력한 실수: \" + weight);\n\n        sin.@@();                         // 버퍼 비우기\n        System.out.print(\"이름을 입력하세요: \");\n        String name = sin.nextLine();           // 한 줄 입력받기\n        System.out.println(\"입력한 이름: \" + name);"}], "out": "", "blanks": [{"o": ["close", "flush", "nextLine", "skip"], "a": 2, "e": "<code>nextDouble()<\/code>은 숫자만 읽고 줄바꿈 문자를 버퍼에 남깁니다. 이를 <code>nextLine()<\/code>으로 한 번 소비해야 이름 입력이 건너뛰어지지 않습니다. <code>close()<\/code>를 부르면 이후 입력 자체가 불가능하고, Scanner에는 <code>flush()<\/code>나 인자 없는 <code>skip()<\/code>이 없습니다."}]}, {"id": "jv2", "s": "jv", "g": 3, "t": "code", "kind": "word", "topic": "동적할당", "src": "예제 3-17 · JaggedArrayExample.java", "q": "가변 배열을 모두 출력하려 합니다. 빈칸 ①(두 곳 공통)에 들어갈 것은?", "files": [{"name": "JaggedArrayExample.java", "code": "package sec03.exam17;\n\npublic class JaggedArrayExample {\n    public static void main(String[] args) {\n        int[][] ja = new int[3][];          // 가변 객체 ja[3][] 선언\n        ja[0] = new int[] {1};              // 첫 번째 행: 1로 초기화\n        ja[1] = new int[] {2, 3};           // 두 번째 행: 2, 3으로 초기화\n        ja[2] = new int[] {4, 5, 6};        // 세 번째 행: 4, 5, 6으로 초기화\n\n        for (int i = 0; i < ja.@@; i++) {\n            for (int j = 0; j < ja[i].@@; j++) {\n                System.out.print(\"[\" + i + \"][\" + j + \"]=\" + ja[i][j] + \", \");\n            }\n            System.out.println();\n        }\n    }\n}"}], "out": "[0][0]=1,\n[1][0]=2, [1][1]=3,\n[2][0]=4, [2][1]=5, [2][2]=6,", "blanks": [{"o": ["length", "length()", "size()", "size"], "a": 0, "e": "배열의 길이는 괄호 없는 <b>필드<\/b> <code>length<\/code>입니다. <code>length()<\/code>는 String의 메서드, <code>size()<\/code>는 ArrayList 같은 컬렉션의 메서드입니다."}]}, {"id": "jv3", "s": "jv", "g": 4, "t": "code", "kind": "word", "topic": "기본", "src": "예제 4-6 · MethodExample.java", "q": "실행 결과가 아래와 같도록 getDiscount()의 빈칸 ①을 채우세요.", "files": [{"name": "MethodExample.java", "code": "package sec02.exam06;\n\nclass Donut {\n    int price;\n\n    Donut() {                       // 기본 생성자, price=2000으로 초기화\n        this.price = 2000;\n    }\n\n    public int getPrice() {                     // 원래 가격 반환 메서드\n        return this.price;\n    }\n\n    public int getDiscount(int discount) {      // 할인된 가격 반환 메서드\n        int result = @@;\n        return result;\n    }\n}\n\npublic class MethodExample {\n    public static void main(String[] args) {    // return 값이 없으므로 void\n        Donut d1 = new Donut();\n\n        int resultPrice = d1.getDiscount(500);   // 메서드 호출\n        System.out.println(\"원래 가격: \" + d1.getPrice() + \"원\");\n        System.out.println(\"할인 가격: \" + resultPrice + \"원\");\n    }\n}"}], "out": "원래 가격: 2000원\n할인 가격: 1500원", "blanks": [{"o": ["this.price -= discount", "discount - this.price", "this.price - discount", "price - this.discount"], "a": 2, "e": "<code>this.price -= discount<\/code>도 1500을 돌려주지만 필드 price 자체가 1500으로 바뀌어 \"원래 가격: 1500원\"이 출력됩니다. <code>discount - this.price<\/code>는 -1500, <code>this.discount<\/code>는 없는 필드라 컴파일 오류입니다."}]}, {"id": "jv4", "s": "jv", "g": 4, "t": "code", "kind": "word", "topic": "기본", "src": "예제 4-7 · MethodOverloadExample.java", "q": "세 번째 줄 \"이름, 가격, 맛\"이 출력되도록 빈칸 ①에 들어갈 인자는?", "files": [{"name": "MethodOverloadExample.java", "code": "package sec02.exam07;\n\nclass Donut {\n    String name;\n    int price;\n    String taste;\n\n    Donut(String name, int price, String taste) {\n        this.name = name;\n        this.price = price;\n        this.taste = taste;\n    }\n\n    void show() {                               // 이름만 출력\n        System.out.println(name);\n    }\n\n    void show(int price) {                      // 이름, 가격 출력\n        System.out.println(name + \", 가격: \" + price + \"원\");\n    }\n\n    void show(int price, String taste) {        // 이름, 가격, 맛 출력\n        System.out.println(name + \", 가격: \" + price + \"원, 맛: \" + taste);\n    }\n}\n\npublic class MethodOverloadExample {\n    public static void main(String[] args) {\n        Donut d1 = new Donut(\"초코 도넛\", 1500, \"달콤함\");\n\n        d1.show();                              // 이름만 출력\n        d1.show(d1.price);                      // 이름, 가격 출력\n        d1.show(@@);                // 이름, 가격, 맛 출력\n    }\n}"}], "out": "초코 도넛\n초코 도넛, 가격: 1500원\n초코 도넛, 가격: 1500원, 맛: 달콤함", "blanks": [{"o": ["d1.taste, d1.price", "d1.price, d1.taste", "price, taste", "d1.name, d1.price, d1.taste"], "a": 1, "e": "오버로딩은 매개변수의 <b>개수·타입·순서<\/b>로 구분합니다. <code>show(int, String)<\/code>이므로 int인 price가 먼저 와야 합니다. main에는 지역변수 price, taste가 없고, 인자 3개짜리 show()는 정의되어 있지 않습니다."}]}, {"id": "jv5", "s": "jv", "g": 4, "t": "code", "kind": "word", "topic": "동적할당", "src": "예제 4-9 · ArrayParaExample.java", "q": "배열의 주소를 넘겨받아 모든 요소에 10을 더하려면 빈칸 ①에 들어갈 매개변수 타입은?", "files": [{"name": "ArrayParaExample.java", "code": "package sec02.exam09;\n\npublic class ArrayParaExample {        // 배열의 모든 요소에 10을 더하는 메서드\n    public static void increaseAll(@@ arr) { // 매개변수로 배열의 주소값을 받음\n        for (int i = 0; i < arr.length; i++) {\n            arr[i] += 10;\n        }\n    }\n\n    public static void main(String[] args) {\n        int[] price = {1, 2, 3};\n\n        increaseAll(price);            // price의 주소값을 복사하여 전달\n        for (int n : price) {\n            System.out.print(n + \" \");\n        }\n    }\n}"}], "out": "11 12 13", "blanks": [{"o": ["int", "Integer[]", "int[][]", "int[]"], "a": 3, "e": "<code>price<\/code>는 <code>int[]<\/code>이므로 같은 타입으로 받아야 합니다. <code>Integer[]<\/code>는 int[]와 호환되지 않아 컴파일 오류이고, 참조(주소)가 전달되므로 메서드 안의 변경이 main의 배열에도 반영됩니다."}]}, {"id": "jv6", "s": "jv", "g": 4, "t": "code", "kind": "word", "topic": "동적할당", "src": "예제 4-10 · ArrayReturnExample.java", "q": "새 배열을 만들어 반환하는 메서드입니다. 빈칸 ①에 들어갈 반환형은?", "files": [{"name": "ArrayReturnExample.java", "code": "package sec02.exam10;\n\npublic class ArrayReturnExample {       // 새로운 배열을 만들어 반환하는 메서드\n    public static @@ createArray() {  // 반환형 int[]\n        int[] arr = {5, 10, 15};\n        return arr;\n    }\n\n    public static void main(String[] args) {\n        int[] price = createArray();     // 배열의 주소를 반환받음\n\n        for (int n : price) {\n            System.out.print(n + \" \");\n        }\n    }\n}"}], "out": "5 10 15", "blanks": [{"o": ["int[]", "void", "int", "int[3]"], "a": 0, "e": "배열 참조를 돌려주므로 반환형은 <code>int[]<\/code>입니다. <code>void<\/code>면 return arr에서 오류가 나고, 선언부에 <code>int[3]<\/code>처럼 크기를 쓸 수는 없습니다."}]}, {"id": "jv7", "s": "jv", "g": 4, "t": "code", "kind": "word", "topic": "기본", "src": "예제 4-8 · BasicParaExample.java", "q": "실행 결과가 \"increase : 15\"가 되도록 빈칸 ①에 들어갈 연산자는?", "files": [{"name": "BasicParaExample.java", "code": "package sec02.exam08;\n\npublic class BasicParaExample {\n    public static void increase(int value) {   // 매개변수로 정수를 받음\n        value @@ 10;\n        System.out.println(\"increase : \" + value);\n    }\n\n    public static void main(String[] args) {\n        int price = 5;\n\n        increase(price);                 // price의 값을 복사하여 전달\n        System.out.println(\"main : \" +  price);\n    }\n}"}], "out": "increase : 15\nmain : 5", "blanks": [{"o": ["=+", "+=", "++", "=="], "a": 1, "e": "<code>=+<\/code>는 <code>value = +10<\/code>으로 해석되어 \"increase : 10\"이 나옵니다. <code>value ++ 10<\/code>과 <code>value == 10;<\/code>은 문장으로 성립하지 않습니다. 기본형은 값이 복사되어 전달되므로 main의 price는 5 그대로입니다."}]}, {"id": "jv8", "s": "jv", "g": 5, "t": "code", "kind": "word", "topic": "기본", "src": "예제 5-5 · Donut.java / GetterSetterExample.java", "q": "유효성 검사를 통과한 값을 필드에 저장하려면 setPrice()의 빈칸 ①은?", "files": [{"name": "Donut.java", "code": "package sec01.exam05;\n\npublic class Donut {\n    private final String name;      // final 멤버 변수, 설정 후 변경 불가능\n    private int price;              // private로 외부 접근 차단\n\n    public Donut(String name) {     // 생성자: final 멤버 변수 name 초기화\n        this.name = name;\n    }\n\n    public String getName() {       // name 변수 게터\n        return name;                // name 변수 세터가 없으므로 변경 불가\n    }\n\n    public int getPrice() {         // price 변수 게터\n        return price;\n    }\n\n    public void setPrice(int price) {  // 유효성 검사가 포함된 price 변수 세터\n        if (price >= 0 && price <= 10000) {\n            @@ = price;\n        } else {\n            System.out.println(\"가격은 0원 이상 10,000원 이하만 가능!\");\n        }\n    }\n}"}, {"name": "GetterSetterExample.java", "code": "package sec01.exam05;\n\npublic class GetterSetterExample {\n    public static void main(String[] args) {\n        Donut d1 = new Donut(\"스페셜 너트 도넛\");  // 생성자를 통해 이름 설정\n\n        d1.setPrice(2000);                         // 가격 설정\n\n        System.out.println(\"도넛 이름: \" + d1.getName());\n        System.out.println(\"가격: \" + d1.getPrice() + \"원\");\n\n        d1.setPrice(-500);                         // 유효하지 않은 값 설정 시도\n    }\n}"}], "out": "도넛 이름: 스페셜 너트 도넛\n가격: 2000원\n가격은 0원 이상 10,000원 이하만 가능!", "blanks": [{"o": ["price", "Donut.price", "this.price", "super.price"], "a": 2, "e": "매개변수 이름이 필드와 같으므로 <code>this.price<\/code>로 필드를 가리켜야 합니다. <code>price = price<\/code>는 매개변수에 자기 자신을 넣을 뿐이라 \"가격: 0원\"이 나옵니다. price는 static이 아니므로 <code>Donut.price<\/code>는 오류, <code>super.price<\/code>는 부모(Object)에 없는 필드입니다."}]}, {"id": "jv9", "s": "jv", "g": 5, "t": "code", "kind": "word", "topic": "기본", "src": "예제 5-6 · StaticVariableExample.java", "q": "모든 도넛 객체가 공유하는 전체 판매량을 늘리려면 빈칸 ①(두 곳 공통)은?", "files": [{"name": "StaticVariableExample.java", "code": "package sec02.exam06;\n\nclass Donut {\n    String name;                    // 도넛 이름\n    int sales = 0;                  // 이 도넛의 개별 판매량 - 초깃값은 0\n\n    static int totalSales = 0;      // static은 전체 객체가 공유하는 변수\n\n    public Donut(String name) {\n        this.name = name;\n    }\n\n     public void sell() {\n        this.sales++;               // 이 도넛의 개별 판매량 1 증가\n        @@++;          // 전체 도넛 판매량 1 증가\n        System.out.println(this.name + \" 총 판매량: \" + this.sales + \"개\");\n        System.out.println(\"도넛 전체 판매량: \" + @@ + \"개\");\n    }\n}\n\npublic class StaticVariableExample {\n    public static void main(String[] args) {\n        Donut choco = new Donut(\"초코 도넛\");\n        Donut lemon = new Donut(\"레몬 도넛\");\n        Donut nut = new Donut(\"너트 도넛\");\n\n        choco.sell();               // 초코 도넛 1개 판매\n        lemon.sell();               // 레몬 도넛 1개 판매\n        nut.sell();                 // 너트 도넛 1개 판매\n        lemon.sell();               // 레몬 도넛 1개 더 판매\n    }\n}"}], "out": "초코 도넛 총 판매량: 1개\n도넛 전체 판매량: 1개\n레몬 도넛 총 판매량: 1개\n도넛 전체 판매량: 2개\n너트 도넛 총 판매량: 1개\n도넛 전체 판매량: 3개\n레몬 도넛 총 판매량: 2개\n도넛 전체 판매량: 4개", "blanks": [{"o": ["Donut.totalSales", "this.sales", "Donut.sales", "static.totalSales"], "a": 0, "e": "static 변수는 <code>클래스명.변수명<\/code>으로 접근합니다. <code>this.sales<\/code>는 객체마다 따로인 개별 판매량이라 1, 1, 1, 2가 출력되고, <code>Donut.sales<\/code>는 static이 아니라 오류, <code>static.<\/code>은 문법에 없습니다."}]}, {"id": "jv10", "s": "jv", "g": 5, "t": "code", "kind": "word", "topic": "기본", "src": "예제 5-9 · DonutOrderWithException.java", "q": "없는 메뉴 번호(예: 5)를 입력했을 때 \"메뉴 번호 오류!\"가 출력되도록 빈칸 ①에 들어갈 예외는?", "files": [{"name": "DonutOrderWithException.java (try-with-resources)", "code": "import java.util.Scanner;\n\npublic class DonutOrderWithException {\n    public static void main(String[] args) {\n        // try-with-resources를 사용하여 Scanner를 자동으로 닫음\n        try (Scanner scanner = new Scanner(System.in)) {\n            String[] donutMenu = {\"\", \"초코 도넛\", \"레몬 도넛\", \"딸기 도넛\"};\n            int[] donutPrices = {0, 2000, 2200, 2100};\n\n            System.out.println(\"도넛 주문 시스템에 오신 것을 환영합니다!\");\n            System.out.println(\"1: 초코 도넛 (2000원)\");\n            System.out.println(\"2: 레몬 도넛 (2200원)\");\n            System.out.println(\"3: 딸기 도넛 (2100원)\");\n            System.out.print(\"도넛 번호를 입력하세요: \");\n            int menuNum = scanner.nextInt();        // 입력한 값이 숫자가 아닌 경우\n            String donut = donutMenu[menuNum];      // 존재하지 않는 번호 입력 시\n            int price = donutPrices[menuNum];\n\n            System.out.println(donut + \"을(를) 선택하셨습니다.\");\n            System.out.println(\"결제 금액: \" + price + \"원\");\n\n        } catch (@@ e) {\n            System.out.println(\"메뉴 번호 오류! 1~3번 중에서 선택해 주세요.\");\n        } catch (Exception e) {\n            System.out.println(\"입력 오류! 숫자를 입력해 주세요.\");\n        } finally {\n            // scanner.close();가 자동으로 처리됨\n            System.out.println(\"도넛 가게를 이용해 주셔서 감사합니다.\");\n        }\n    }\n}"}], "out": "", "blanks": [{"o": ["NumberFormatException", "NullPointerException", "ArithmeticException", "ArrayIndexOutOfBoundsException"], "a": 3, "e": "배열 donutMenu의 범위를 벗어난 인덱스에 접근하면 <code>ArrayIndexOutOfBoundsException<\/code>이 발생합니다. 숫자가 아닌 값을 넣으면 nextInt()가 InputMismatchException을 던지고, 그것은 아래 <code>catch (Exception e)<\/code>가 잡습니다."}]}, {"id": "jv11", "s": "jv", "g": 5, "t": "code", "kind": "word", "topic": "기본", "src": "예제 5-9 · DonutOrderWithException.java", "q": "예외 발생 여부와 관계없이 마지막 인사말이 항상 출력되도록 빈칸 ①에 들어갈 키워드는?", "files": [{"name": "DonutOrderWithException.java (일부)", "start": 22, "code": "        } catch (ArrayIndexOutOfBoundsException e) {\n            System.out.println(\"메뉴 번호 오류! 1~3번 중에서 선택해 주세요.\");\n        } catch (Exception e) {\n            System.out.println(\"입력 오류! 숫자를 입력해 주세요.\");\n        } @@ {\n            // scanner.close();가 자동으로 처리됨\n            System.out.println(\"도넛 가게를 이용해 주셔서 감사합니다.\");\n        }"}], "out": "", "blanks": [{"o": ["final", "finalize", "default", "finally"], "a": 3, "e": "<code>finally<\/code> 블록은 예외가 나든 안 나든 항상 실행됩니다. <code>final<\/code>은 변경 금지 키워드, <code>finalize()<\/code>는 Object의 메서드, <code>default<\/code>는 switch·인터페이스에서 쓰는 키워드입니다."}]}, {"id": "jv12", "s": "jv", "g": 6, "t": "code", "kind": "word", "topic": "상속", "src": "예제 6-1 · InheritExample.java", "q": "ChocoDonut이 Donut의 name, price, show()를 물려받도록 빈칸 ①에 들어갈 키워드는?", "files": [{"name": "InheritExample.java", "code": "package sec01.exam01;\n\nclass Donut {                       // 부모 클래스\n    String name;                    // 공통 변수\n    int price;                      // 공통 변수\n\n    void show() {                   // 공통 메서드\n        System.out.println(name + \"의 가격은 \" + price + \"원\");\n    }\n}\n\nclass ChocoDonut @@ Donut {  // Donut 클래스를 상속받는 ChocoDonut 클래스\n    String topping;                 // name 및 price 사용 가능 + topping\n\n    void addTopping() {             // show() 사용 가능 + addTopping()\n        System.out.println(topping + \" 토핑 추가\");\n    }\n}\n\npublic class InheritExample {\n    public static void main(String[] args) {\n        ChocoDonut choco = new ChocoDonut();\n        choco.name = \"초코 도넛\";   // Donut의 name 사용\n        choco.price = 2000;         // Donut의 price 사용\n        choco.topping = \"초코 칩\"; // ChocoDonut의 topping 사용\n\n        choco.show();               // Donut의 show() 사용\n        choco.addTopping();         // ChocoDonut의 addTopping() 사용\n    }\n}"}], "out": "초코 도넛의 가격은 2000원\n초코 칩 토핑 추가", "blanks": [{"o": ["implements", "inherits", "extends", "super"], "a": 2, "e": "클래스 상속은 <code>extends<\/code>입니다. <code>implements<\/code>는 인터페이스 구현에 쓰고, <cod
