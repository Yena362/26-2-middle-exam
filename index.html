e>inherits<\/code>는 자바 키워드가 아닙니다."}]}, {"id": "jv13", "s": "jv", "g": 6, "t": "code", "kind": "word", "topic": "상속", "src": "예제 6-2 · SuperExample.java", "q": "자식과 이름이 같은 부모 클래스의 필드 name을 출력하려면 빈칸 ①은?", "files": [{"name": "SuperExample.java", "code": "package sec01.exam02;\n\nclass Donut {\n    String name = \"기본 도넛\";\n}\n\nclass ChocoDonut extends Donut {\n    String name = \"초코 도넛\";\n\n    void printName() {\n        System.out.println(\"자식 클래스 name: \" + name);         // 초코 도넛\n        System.out.println(\"부모 클래스 name: \" + @@);   // 기본 도넛\n    }\n}\n\npublic class SuperExample {\n    public static void main(String[] args) {\n        ChocoDonut choco = new ChocoDonut();\n        choco.printName();\n    }\n}"}], "out": "자식 클래스 name: 초코 도넛\n부모 클래스 name: 기본 도넛", "blanks": [{"o": ["this.name", "super().name", "Donut.name", "super.name"], "a": 3, "e": "부모의 멤버는 <code>super.멤버<\/code>로 접근합니다. <code>this.name<\/code>은 자식의 \"초코 도넛\"이고, <code>super()<\/code>는 생성자 첫 줄에서만 쓰는 부모 생성자 호출이며, name은 static이 아니므로 <code>Donut.name<\/code>은 오류입니다."}]}, {"id": "jv14", "s": "jv", "g": 6, "t": "code", "kind": "word", "topic": "오버라이딩", "src": "예제 6-5 · OverridingExample.java", "q": "부모의 show()를 재정의했음을 컴파일러에게 알리는 빈칸 ①(두 곳 공통)은?", "files": [{"name": "OverridingExample.java", "code": "package sec01.exam05;\n\nclass Donut {\n    void show() {\n        System.out.println(\"이것은 기본 도넛이다.\");\n    }\n}\n\nclass ChocoDonut extends Donut {\n    @@\n    void show() {               // 부모 클래스의 show() 메서드 오버라이딩\n        System.out.println(\"이것은 달콤한 초코 도넛이다.\");\n    }\n}\n\nclass LemonDonut extends Donut {\n    @@\n    void show() {               // 부모 클래스의 show() 메서드 오버라이딩\n        System.out.println(\"이것은 상큼한 레몬 도넛이다.\");\n    }\n}\n\npublic class OverridingExample {\n    public static void main(String[] args) {\n        Donut basic = new Donut();\n        ChocoDonut choco = new ChocoDonut();\n        LemonDonut lemon = new LemonDonut();\n\n        basic.show();           // 기본 도넛\n        choco.show();           // 초코 도넛\n        lemon.show();           // 레몬 도넛\n    }\n}"}], "out": "이것은 기본 도넛이다.\n이것은 달콤한 초코 도넛이다.\n이것은 상큼한 레몬 도넛이다.", "blanks": [{"o": ["@Override", "@Overload", "@override", "@Overriding"], "a": 0, "e": "어노테이션 이름은 대소문자를 구분하며 정확히 <code>@Override<\/code>입니다. 오버로딩(Overload)은 같은 이름에 매개변수가 다른 메서드를 만드는 것으로 개념이 다르고, 그런 어노테이션은 없습니다."}]}, {"id": "jv15", "s": "jv", "g": 6, "t": "code", "kind": "word", "topic": "동적할당", "src": "예제 6-7 · DownCastingExample.java", "q": "업캐스팅된 d를 다시 ChocoDonut으로 되돌리는 빈칸 ①은?", "files": [{"name": "DownCastingExample.java", "code": "package sec02.exam07;\n\nclass Donut {                               // 부모 클래스\n    String name;\n\n    void show() {\n        System.out.println(name + \"입니다.\");\n    }\n}\n\nclass ChocoDonut extends Donut {\n    String topping;\n\n    void addTopping() {\n        System.out.println(topping + \" 토핑 추가.\");\n    }\n}\n\npublic class DownCastingExample {\n    public static void main(String[] args) {\n        Donut d = new ChocoDonut();             // 업캐스팅\n        d.name = \"초코 도넛\";\n\n        ChocoDonut choco = @@ d;   // 다운캐스팅(명시적 형 변환)\n\n        d.show();                               // Donut의 show() 사용\n        choco.topping = \"초코 칩\";\n        choco.addTopping();                     // ChocoDonut의 addTopping() 사용\n    }\n}"}], "out": "초코 도넛입니다.\n초코칩 토핑 추가.", "blanks": [{"o": ["(Donut)", "(ChocoDonut)", "new ChocoDonut()", "ChocoDonut"], "a": 1, "e": "다운캐스팅은 자동이 아니므로 <code>(ChocoDonut)<\/code>처럼 괄호로 타입을 명시해야 합니다. <code>new ChocoDonut()<\/code>을 쓰면 새 객체가 만들어져 name이 null인 별개의 도넛이 됩니다."}]}, {"id": "jv16", "s": "jv", "g": 6, "t": "code", "kind": "word", "topic": "추상", "src": "예제 6-9 · AbstractExample.java", "q": "Donut으로는 객체를 만들 수 없고 자식이 show()를 반드시 구현하도록 빈칸 ①(두 곳 공통)에 들어갈 키워드는?", "files": [{"name": "AbstractExample.java", "code": "package sec02.exam09;\n\n@@ class Donut {                    // 추상 클래스\n    String name;\n    int price;\n\n    void setPrice(int price) {\n        this.price = price;\n    }\n\n    @@ void show();                // 추상 메서드\n}\n\nclass ChocoDonut extends Donut {\n    @Override\n    void show() {                       // 추상 메서드 show() 구현\n        System.out.println(\"달콤한 초코 도넛입니다. 가격: \" + price + \"원\");\n    }\n}\n\nclass LemonDonut extends Donut {\n    @Override\n    void show() {                       // 추상 메서드 show() 구현\n        System.out.println(\"상큼한 레몬 도넛입니다. 가격: \" + price + \"원\");\n    }\n}\n\npublic class AbstractExample {\n    public static void main(String[] args) {\n        // Donut d = new Donut(); // 오류 발생. 추상 클래스는 객체 생성 불가\n\n        Donut choco = new ChocoDonut();   // 자식 클래스로 객체 생성\n        choco.setPrice(2000);\n        choco.show();\n\n        Donut lemon = new LemonDonut();   // 다른 자식 클래스도 동일\n        lemon.setPrice(2800);\n        lemon.show();\n    }\n}"}], "out": "달콤한 초코 도넛입니다. 가격: 2000원\n상큼한 레몬 도넛입니다. 가격: 2800원", "blanks": [{"o": ["static", "default", "abstract", "final"], "a": 2, "e": "몸체 없이 선언만 있는 메서드와 그것을 가진 클래스에는 <code>abstract<\/code>를 붙입니다. <code>final<\/code> 클래스는 상속 자체가 불가능해 정반대이고, <code>default<\/code>는 인터페이스 안에서만 씁니다."}]}, {"id": "jv17", "s": "jv", "g": 6, "t": "code", "kind": "word", "topic": "인터페이스", "src": "예제 6-10 · InterfaceExample.java", "q": "Donut이 세 인터페이스를 동시에 구현하도록 빈칸 ①에 들어갈 키워드는?", "files": [{"name": "InterfaceExample.java", "code": "package sec02.exam10;\n\ninterface MakeDonut {           // 인터페이스 선언 1\n    default void make() {       // 인터페이스 안에 미리 만들어 놓은 메서드\n        System.out.println(\"미라클 도넛을 만듭니다.\");\n    }\n}\n\ninterface Fillable {            // 인터페이스 선언 2\n    void fill();\n}\n\ninterface Decoratable {         // 인터페이스 선언 3\n    void decorate();\n}\n\ninterface DonutUtil {           // 인터페이스 선언 4\n    static void printStart() { // 객체 생성 없이 호출 가능\n        System.out.println(\"=== 도넛 만들기 시작 ===\");\n    }\n}\n\nclass Donut @@ MakeDonut, Fillable, Decoratable { // 다중 인터페이스\n    public Donut() {\n        make();                 // 인터페이스 1 안의 default 메서드 자동 실행\n    }\n\n    public void fill() {        // 인터페이스 2 구현\n        System.out.println(\"크림을 채웁니다.\");\n    }\n\n    public void decorate() {    // 인터페이스 3 구현\n        System.out.println(\"초코 토핑을 얹습니다.\");\n    }\n}\n\npublic class IntefaceExample {\n    public static void main(String[] args) {\n        DonutUtil.printStart(); // static 메서드 실행\n        Donut d = new Donut();  // 생성자 안의 make() 자동 실행\n        d.fill();\n        d.decorate();\n    }\n}"}], "out": "=== 도넛 만들기 시작 ===\n미라클 도넛을 만듭니다.\n크림을 채웁니다.\n초코 토핑을 얹습니다.", "blanks": [{"o": ["implements", "extends", "extends implements", "interface"], "a": 0, "e": "클래스가 인터페이스를 구현할 때는 <code>implements<\/code>를 쓰고, 쉼표로 여러 개를 나열할 수 있습니다(다중 구현). 클래스의 <code>extends<\/code>는 하나만 가능하며 인터페이스에는 쓸 수 없습니다."}]}, {"id": "jv18", "s": "jv", "g": 7, "t": "code", "kind": "word", "topic": "오버라이딩", "src": "예제 7-1 · EqualsExample.java", "q": "obj가 Donut 타입인지 검사하는 빈칸 ①에 들어갈 연산자는?", "files": [{"name": "EqualsExample.java", "code": "package sec02.exam01;\n\nclass Donut {\n    String name;\n\n    Donut(String name) {\n        this.name = name;\n    }\n\n    @Override\n    public boolean equals(Object obj) {     // Object의 equals() 오버라이딩\n        if (obj @@ Donut) {\n            Donut other = (Donut) obj;      // Donut으로 다운캐스팅\n            return this.name.equals(other.name);\n        }\n        return false;\n    }\n}\n\npublic class EqualsExample {\n    public static void main(String[] args) {\n        Donut d1 = new Donut(\"초코\");\n        Donut d2 = new Donut(\"초코\");\n\n        System.out.println(\"equals 결과: \" + d1.equals(d2)); // 내용 비교\n        System.out.println(\"== 결과: \" + (d1 == d2));         // 주소 비교\n    }\n}"}], "out": "equals 결과: true\n== 결과: false", "blanks": [{"o": ["instanceof", "instanceOf", "==", "typeof"], "a": 0, "e": "타입 검사 연산자는 모두 소문자인 <code>instanceof<\/code>입니다. <code>instanceOf<\/code>(대문자 O)나 <code>typeof<\/code>는 자바에 없고, <code>==<\/code>는 참조(주소) 비교입니다."}]}, {"id": "jv19", "s": "jv", "g": 7, "t": "code", "kind": "word", "topic": "오버라이딩", "src": "예제 7-1 · EqualsExample.java", "q": "@Override가 오류 없이 붙도록 equals()의 매개변수 타입 빈칸 ①을 채우세요.", "files": [{"name": "EqualsExample.java (3~18행)", "start": 3, "code": "class Donut {\n    String name;\n\n    Donut(String name) {\n        this.name = name;\n    }\n\n    @Override\n    public boolean equals(@@ obj) {     // Object의 equals() 오버라이딩\n        if (obj instanceof Donut) {\n            Donut other = (Donut) obj;      // Donut으로 다운캐스팅\n            return this.name.equals(other.name);\n        }\n        return false;\n    }\n}"}], "out": "", "blanks": [{"o": ["Donut", "Object", "String", "Class"], "a": 1, "e": "Object 클래스의 원형이 <code>equals(Object obj)<\/code>이므로 매개변수도 <code>Object<\/code>여야 오버라이딩입니다. <code>Donut<\/code>으로 바꾸면 오버로딩이 되어 @Override에서 컴파일 오류가 납니다."}]}, {"id": "jv20", "s": "jv", "g": 7, "t": "code", "kind": "word", "topic": "오버라이딩", "src": "예제 7-2 · ToStringExample.java", "q": "System.out.println(d1)이 \"초코 도넛(2000원)\"을 출력하도록 빈칸 ①에 들어갈 반환형은?", "files": [{"name": "ToStringExample.java", "code": "package sec02.exam02;\n\nclass Donut {\n    String name;\n    int price;\n\n    Donut(String name, int price) {\n        this.name = name;\n        this.price = price;\n    }\n\n    @Override\n     public @@ toString() {     // Object의 toString() 오버라이딩\n        return name + \" 도넛(\" + price + \"원)\";\n    }\n}\n\npublic class ToStringExample {\n    public static void main(String[] args) {\n        Donut d1 = new Donut(\"초코\", 2000);\n        System.out.println(d1);         // 자동으로 toString() 호출\n    }\n}"}], "out": "초코 도넛(2000원)", "blanks": [{"o": ["void", "Object", "string", "String"], "a": 3, "e": "Object의 원형이 <code>public String toString()<\/code>입니다. 자바는 대소문자를 구분하므로 <code>string<\/code>은 타입이 아니고, 반환형을 Object나 void로 바꾸면 오버라이딩 규칙에 어긋나 오류가 납니다."}]}, {"id": "jv21", "s": "jv", "g": 7, "t": "code", "kind": "word", "topic": "기본", "src": "예제 7-3 · WrapperExample.java", "q": "정수 j를 문자열로 바꾸는 빈칸 ①에 들어갈 Integer의 메서드는?", "files": [{"name": "WrapperExample.java", "code": "package sec02.exam03;\n\npublic class WrapperExample {\n    public static void main(String[] args) {\n\n        Integer num1 = 100;                 // 오토박싱: int → Integer\n        System.out.println(\"오토박싱된 값: \" + num1);\n\n        int i = num1;                       // 언박싱: Integer → int\n        System.out.println(\"언박싱된 값: \" + i);\n\n        String s = \"123\";\n        int j = Integer.parseInt(s);        // 문자열을 숫자로 변환\n        System.out.println(\"문자열을 정수로 변환: \" + j);\n\n        String str = Integer.@@(j);     // 숫자를 문자열로 변환\n        System.out.println(\"정수를 문자열로 변환: \" + str);\n\n        String yes = \"true\";\n        Boolean flag = Boolean.parseBoolean(yes);  // 문자열 → boolean 객체\n        if (flag) {\n            System.out.println(\"참이다.\");\n        } else {\n            System.out.println(\"거짓이다.\");\n        }\n    }\n}"}], "out": "오토박싱된 값: 100\n언박싱된 값: 100\n문자열을 정수로 변환: 123\n정수를 문자열로 변환: 123\n참이다.", "blanks": [{"o": ["valueOf", "parseString", "toString", "toText"], "a": 2, "e": "<code>Integer.toString(int)<\/code>가 문자열을 반환합니다. <code>Integer.valueOf(j)<\/code>는 String이 아닌 <b>Integer 객체<\/b>를 반환하므로 String 변수에 대입하면 컴파일 오류입니다. (문자열 쪽 valueOf는 <code>String.valueOf()<\/code>)"}]}, {"id": "jv22", "s": "jv", "g": 7, "t": "code", "kind": "word", "topic": "기본", "src": "예제 7-4 · StringExample.java", "q": "\"문자 수: 4\"가 출력되도록 빈칸 ①을 채우세요.", "files": [{"name": "StringExample.java", "code": "package sec02.exam04;\n\npublic class StringExample {\n    public static void main(String[] args) {\n        String s1 = \"레몬도넛\";\n\n        System.out.println(\"문자열: \" + s1);\n        System.out.println(\"문자 수: \" + s1.@@);\n        System.out.println(\"첫 글자: \" + s1.charAt(0));\n        System.out.println(\"부분 문자열: \" + s1.substring(0, 2));\n        System.out.println(\"바뀐 문자열: \" + s1.replace(\"레몬\", \"초코\"));\n\n        String s2 = new String(\"레몬도넛\");\n        System.out.println(\"s1 == s2: \" + (s1 == s2));          // false\n        System.out.println(\"s1.equals(s2): \" + s1.equals(s2)); // true\n\n        String s3 = \"레몬도넛\";       // 문자열 풀의 \"레몬도넛\" 참조\n        System.out.println(\"s1 == s3: \" + (s1 == s3));          // true\n        s1 = s1 + \" 포장\";\n        System.out.println(\"s1 변경 후 == s3: \" + (s1 == s3));  // false\n    }\n}"}], "out": "문자열: 레몬도넛\n문자 수: 4\n첫 글자: 레\n부분 문자열: 레몬\n바뀐 문자열: 초코도넛\ns1 == s2: false\ns1.equals(s2): true\ns1 == s3: true\ns1 변경 후 == s3: false", "blanks": [{"o": ["length", "length()", "size()", "count()"], "a": 1, "e": "String의 길이는 <b>메서드<\/b> <code>length()<\/code>입니다. 배열의 <code>length<\/code>(괄호 없음)와 헷갈리기 쉬운 부분이고, String에는 size()나 count()가 없습니다."}]}, {"id": "jv23", "s": "jv", "g": 7, "t": "code", "kind": "word", "topic": "기본", "src": "예제 7-4 · StringExample.java", "q": "\"첫 글자: 레\"가 출력되도록 빈칸 ①에 들어갈 메서드는?", "files": [{"name": "StringExample.java (5~11행)", "start": 5, "code": "        String s1 = \"레몬도넛\";\n\n        System.out.println(\"문자열: \" + s1);\n        System.out.println(\"문자 수: \" + s1.length());\n        System.out.println(\"첫 글자: \" + s1.@@(0));\n        System.out.println(\"부분 문자열: \" + s1.substring(0, 2));\n        System.out.println(\"바뀐 문자열: \" + s1.replace(\"레몬\", \"초코\"));"}], "out": "", "blanks": [{"o": ["indexOf", "substring", "getChar", "charAt"], "a": 3, "e": "<code>charAt(index)<\/code>는 해당 위치의 문자(char)를 돌려줍니다. <code>indexOf(0)<\/code>는 문자 코드 0의 위치를 찾아 -1을, <code>substring(0)<\/code>은 \"레몬도넛\" 전체를 돌려주고, getChar()는 없습니다."}]}, {"id": "jv24", "s": "jv", "g": 7, "t": "code", "kind": "word", "topic": "기본", "src": "예제 7-5 · StringBufferExample.java", "q": "\" 맛있는\"을 지워 \"delete 후: 도넛 가게\"가 나오도록 빈칸 ①에 들어갈 메서드는?", "files": [{"name": "StringBufferExample.java", "code": "package sec02.exam05;\n\npublic class StringBufferExample {\n    public static void main(String[] args) {\n\n        StringBuffer sb = new StringBuffer(\"도넛\");\n        System.out.println(\"초기 문자열: \" + sb);\n\n        sb.append(\" 가게\");                 // 문자열 뒤에 추가\n        System.out.println(\"append 후: \" + sb);\n\n        sb.insert(2, \" 맛있는\");            // 문자열 중간에 삽입\n        System.out.println(\"insert 후: \" + sb);\n\n        sb.@@(2, 6);                    // \" 맛있는\" 삭제\n        System.out.println(\"delete 후: \" + sb);\n\n        sb.replace(0, 2, \"초코\");           // 문자열 변경\n        System.out.println(\"replace 후: \" + sb);\n\n        sb.reverse();                       // 문자열 뒤집기\n        System.out.println(\"reverse 후: \" + sb);\n\n        String result = sb.toString();  // String으로 변환\n        System.out.println(\"최종 문자열(String): \" + result);\n    }\n}"}], "out": "초기 문자열: 도넛\nappend 후: 도넛 가게\ninsert 후: 도넛 맛있는 가게\ndelete 후: 도넛 가게\nreplace 후: 초코 가게\nreverse 후: 게가 코초\n최종 문자열(String): 게가 코초", "blanks": [{"o": ["delete", "remove", "deleteCharAt", "substring"], "a": 0, "e": "<code>delete(start, end)<\/code>는 start부터 end-1까지 지웁니다. <code>deleteCharAt<\/code>은 인덱스 하나만 받고, StringBuffer에는 remove()가 없으며, <code>substring<\/code>은 원본을 바꾸지 않고 새 String만 돌려줍니다."}]}, {"id": "jv25", "s": "jv", "g": 7, "t": "code", "kind": "word", "topic": "기본", "src": "예제 7-6 · StringTokenizerExample.java", "q": "쉼표로 나눈 다음 토큰을 String으로 꺼내는 빈칸 ①은?", "files": [{"name": "StringTokenizerExample.java", "code": "package sec02.exam06;\n\nimport java.util.StringTokenizer; // StringTokenizer는 java.util에 있음\n\npublic class StringTokenizerExample {\n    public static void main(String[] args) {\n        String donutMenu = \"초코,레몬,딸기,크림\";\n\n        // 쉼표(,)를 기준으로 문자열을 분리\n        StringTokenizer st = new StringTokenizer(donutMenu, \",\");\n\n        System.out.println(\"메뉴에 있는 도넛 종류:\");\n\n        while (st.hasMoreTokens()) {        // 토큰이 남아 있는 동안 반복\n            String donut = st.@@();     // 다음 토큰 꺼냄\n            System.out.println(\"- \" + donut + \" 도넛\");\n        }\n    }\n}"}], "out": "메뉴에 있는 도넛 종류:\n- 초코 도넛\n- 레몬 도넛\n- 딸기 도넛\n- 크림 도넛", "blanks": [{"o": ["next", "nextElement", "nextToken", "getToken"], "a": 2, "e": "<code>nextToken()<\/code>이 String을 반환합니다. <code>nextElement()<\/code>도 존재하지만 반환형이 <b>Object<\/b>라 String 변수에 그대로 대입하면 컴파일 오류이고, <code>next()<\/code>는 Scanner의 메서드입니다."}]}, {"id": "jv26", "s": "jv", "g": 7, "t": "code", "kind": "word", "topic": "기본", "src": "예제 7-7 · MathExample.java", "q": "할인가를 반올림해 long 변수에 저장하는 빈칸 ①의 메서드는?", "files": [{"name": "MathExample.java", "code": "package sec02.exam07;\n\npublic class MathExample {\n    public static void main(String[] args) {\n        int price = 3500;\n        double discount = 0.15;\n\n        double newPrice = price * (1 - discount);\n        long rounded = Math.@@(newPrice); // 반올림\n\n        System.out.println(\"원래 가격: \" + price + \"원\");\n        System.out.println(\"할인율: \" + (int)(discount * 100) + \"%\");\n        System.out.println(\"할인가(반올림): \" + rounded + \"원\");\n\n        int donuts = (int)(Math.random() * 5) + 1;  // 랜덤 개수 생성(1~5)\n        System.out.println(\"랜덤 구매 개수: \" + donuts + \"개\");\n        System.out.println(\"총 가격: \" + (rounded * donuts) + \"원\");\n    }\n}"}], "out": "원래 가격: 3500원\n할인율: 15%\n할인가(반올림): 2975원\n랜덤 구매 개수: 3개\n총 가격: 8925원", "blanks": [{"o": ["rint", "round", "ceil", "floor"], "a": 1, "e": "<code>Math.round(double)<\/code>만 <b>long<\/b>을 반환합니다. <code>rint<\/code>(가장 가까운 정수), <code>ceil<\/code>(올림), <code>floor<\/code>(내림)는 모두 double을 반환하므로 long 변수에 바로 대입하면 컴파일 오류입니다."}]}, {"id": "jv27", "s": "jv", "g": 7, "t": "code", "kind": "word", "topic": "기본", "src": "예제 7-8 · CalendarExample.java", "q": "8월 25일에서 7일 뒤인 \"9월 1일\"이 출력되도록 빈칸 ①에 들어갈 메서드는?", "files": [{"name": "CalendarExample.java", "code": "package sec02.exam08;\n\nimport java.util.Calendar;\n\npublic class CalendarExample {\n    public static void main(String[] args) {\n        Calendar cal = Calendar.getInstance();    // 현재 날짜와 시간\n\n        int year = cal.get(Calendar.YEAR);\n        int month = cal.get(Calendar.MONTH) + 1;  // 월은 0부터 시작!\n        int day = cal.get(Calendar.DAY_OF_MONTH);\n\n        int hour = cal.get(Calendar.HOUR_OF_DAY); // 24시간 형식\n        int minute = cal.get(Calendar.MINUTE);\n\n        System.out.println(\"오늘: \" + year + \"년 \" + month + \"월 \" + day + \"일\");\n        System.out.println(\"현재 시간: \" + hour + \"시 \" + minute + \"분\");\n\n        cal.@@(Calendar.DATE, 7);              // 7일 뒤로 이동\n\n        year = cal.get(Calendar.YEAR);\n        month = cal.get(Calendar.MONTH) + 1;      // 월은 0부터 시작!\n        day = cal.get(Calendar.DAY_OF_MONTH);\n\n        System.out.println(\"7일후: \" + year + \"년 \" + month + \"월 \" + day + \"일\");\n    }\n}"}], "out": "오늘: 2025년 8월 25일\n현재 시간: 9시 42분\n7일후: 2025년 9월 1일", "blanks": [{"o": ["set", "roll", "plus", "add"], "a": 3, "e": "<code>add(필드, 양)<\/code>는 날짜를 더하면서 월·연도까지 넘겨 줍니다. <code>set(Calendar.DATE, 7)<\/code>은 \"8월 7일\"로 바꿔 버리고, <code>roll<\/code>은 상위 필드(월)를 바꾸지 않아 \"8월 1일\"이 됩니다. Calendar에는 plus()가 없습니다."}]}, {"id": "jv28", "s": "jv", "g": 7, "t": "code", "kind": "word", "topic": "기본", "src": "예제 7-9 · LocalDateExample.java", "q": "\"일주일 후\" 날짜를 출력하도록 빈칸 ①에 들어갈 메서드는?", "files": [{"name": "LocalDateExample.java", "code": "package sec02.exam09;\n\nimport java.time.LocalDate;\n\npublic class LocalDateExample {\n    public static void main(String[] args) {\n        LocalDate today = LocalDate.now();   // now()를 사용하여 현재 날짜 생성\n        LocalDate birthday = LocalDate.of(1999, 7, 25); // 특정 날짜 생성\n\n        System.out.println(\"오늘 날짜: \" + today);\n        System.out.println(\"생일: \" + birthday);\n\n        System.out.println(\"일주일 후: \" + today.@@(1));\n        System.out.println(\"한 달 전: \" + today.minusMonths(1));\n    }\n}"}], "out": "오늘 날짜: 2025-08-25\n생일: 1999-07-25\n일주일 후: 2025-09-01\n한 달 전: 2025-07-25", "blanks": [{"o": ["plusWeeks", "plusWeek", "addWeeks", "plusDays"], "a": 0, "e": "LocalDate는 <code>plusDays/plusWeeks/plusMonths/plusYears<\/code>처럼 복수형 이름을 씁니다. <code>plusDays(1)<\/code>은 하루 뒤(08-26)가 나오고, plusWeek·addWeeks는 존재하지 않습니다."}]}, {"id": "jv29", "s": "jv", "g": 7, "t": "code", "kind": "word", "topic": "기본", "src": "예제 7-10 · LocalTimeExample.java", "q": "영업 시작 시각 09:00을 만드는 빈칸 ①의 메서드는?", "files": [{"name": "LocalTimeExample.java", "code": "package sec02.exam10;\n\nimport java.time.LocalTime;\n\npublic class LocalTimeExample {\n    public static void main(String[] args) {\n        LocalTime now = LocalTime.now();            // 현재 시간\n        LocalTime open = LocalTime.@@(9, 0);       // 09:00\n        LocalTime close = open.plusHours(10);       // 10시간 후\n\n        System.out.println(\"현재 시간: \" + now);\n        System.out.println(\"도넛 가게 오픈: \" + open);\n        System.out.println(\"도넛 가게 마감: \" + close);\n    }\n}"}], "out": "현재 시간: 09:33:32.670143637\n도넛 가게 오픈: 09:00\n도넛 가게 마감: 19:00", "blanks": [{"o": ["now", "parse", "of", "at"], "a": 2, "e": "특정 시각은 <code>LocalTime.of(시, 분)<\/code>으로 만듭니다. <code>now()<\/code>는 인자 없이 현재 시각을, <code>parse()<\/code>는 \"09:00\" 같은 문자열 하나를 받습니다."}]}, {"id": "jv30", "s": "jv", "g": 7, "t": "code", "kind": "word", "topic": "기본", "src": "예제 7-12 · DateTimeFormatterExample.java", "q": "원하는 날짜 형식으로 포맷터를 생성하는 빈칸 ①의 메서드는?", "files": [{"name": "DateTimeFormatterExample.java", "code": "package sec02.exam12;\n\nimport java.time.LocalDateTime;\nimport java.time.format.DateTimeFormatter;\n\npublic class DateTimeFormatterExample {\n    public static void main(String[] args) {\n        LocalDateTime now = LocalDateTime.now();\n        // 포맷터 생성\n        DateTimeFormatter f = DateTimeFormatter.@@(\"yyyy년 M월 d일 a h시 m분\");\n        String formatted = now.format(f);\n        System.out.println(\"포맷된 날짜/시간: \" + formatted);\n    }\n}"}], "out": "포맷된 날짜/시간: 2025년 8월 25일 AM 10시 46분", "blanks": [{"o": ["format", "ofPattern", "pattern", "ofFormat"], "a": 1, "e": "패턴 문자열로 포맷터를 만드는 정적 메서드는 <code>DateTimeFormatter.ofPattern()<\/code>입니다. <code>format()<\/code>은 만들어진 포맷터로 날짜를 문자열로 바꿀 때(11행) 씁니다."}]}, {"id": "jl0", "s": "jv", "g": 6, "t": "code", "kind": "line", "topic": "상속", "src": "InheritConstructorExample.java", "q": "부모 생성자에 매개변수가 있을 때 자식 클래스를 완성하세요. 빈칸 ①~⑤에 들어갈 줄을 각각 고르세요.", "files": [{"name": "InheritConstructorExample.java", "code": "package sec01.exam11;\n\nclass Donut {                               // 부모 클래스\n    String name;\n    int price;\n\n    Donut(String name, int price) {         // 매개변수가 있는 생성자만 있음\n        this.name = name;\n        this.price = price;\n        System.out.println(\"Donut 생성자 실행\");\n    }\n\n    void show() {\n        System.out.println(name + \" / \" + price + \"원\");\n    }\n}\n\n@@L0@@    // Donut을 상속받는 자식 클래스\n    String topping;\n\n    ChocoDonut(String name, int price, String topping) {\n@@L1@@    // 부모 생성자 호출 (반드시 첫 줄)\n@@L2@@    // 자식 필드 초기화\n        System.out.println(\"ChocoDonut 생성자 실행\");\n    }\n\n    @Override\n    void show() {\n@@L3@@    // 부모의 show() 먼저 실행\n        System.out.println(\"토핑: \" + topping);\n    }\n}\n\npublic class InheritConstructorExample {\n    public static void main(String[] args) {\n@@L4@@\n        c.show();\n    }\n}"}], "out": "Donut 생성자 실행\nChocoDonut 생성자 실행\n초코 도넛 / 2000원\n토핑: 초코 칩", "blanks": [{"o": ["class ChocoDonut implements Donut {", "class ChocoDonut extends Donut, Object {", "class ChocoDonut extends Donut {", "class ChocoDonut super Donut {"], "a": 2, "e": "클래스 상속은 <code>extends<\/code> 하나만 씁니다. <code>implements<\/code>는 인터페이스용이고, 자바 클래스는 다중 상속이 안 됩니다.", "ind": 0}, {"o": ["this(name, price);", "super(name, price);", "Donut(name, price);", "super.Donut(name, price);"], "a": 1, "e": "부모에 기본 생성자가 없으므로 자식 생성자 첫 줄에서 <code>super(name, price)<\/code>로 부모 생성자를 직접 불러야 합니다. <code>this(...)<\/code>는 자기 클래스의 다른 생성자를 부르는데, ChocoDonut에는 인자 2개짜리 생성자가 없습니다.", "ind": 8}, {"o": ["topping = this.topping;", "super.topping = topping;", "String topping = topping;", "this.topping = topping;"], "a": 3, "e": "<code>this.topping<\/code>이 필드, <code>topping<\/code>이 매개변수입니다. 방향을 거꾸로 쓰면 필드가 null로 남아 \"토핑: null\"이 출력되고, 부모에는 topping 필드가 없습니다.", "ind": 8}, {"o": ["super.show();", "this.show();", "Donut.show();", "super.show;"], "a": 0, "e": "오버라이딩한 메서드 안에서 부모 버전을 부를 때는 <code>super.show()<\/code>입니다. <code>this.show()<\/code>는 자기 자신을 다시 불러 StackOverflowError가 나고, show()는 static이 아니라 <code>Donut.show()<\/code>는 오류입니다.", "ind": 8}, {"o": ["ChocoDonut c = new ChocoDonut(\"초코 도넛\", 2000, \"초코 칩\");", "ChocoDonut c = new ChocoDonut();", "ChocoDonut c = new Donut(\"초코 도넛\", 2000);", "ChocoDonut c = ChocoDonut(\"초코 도넛\", 2000, \"초코 칩\");"], "a": 0, "e": "객체는 <code>new 클래스명(인자)<\/code>로 동적 할당합니다. 인자 없는 생성자는 정의하지 않았고, 부모 객체는 자식 타입 변수에 담을 수 없으며, <code>new<\/code>를 빼면 메서드 호출로 해석되어 오류입니다.", "ind": 8}]}, {"id": "jl1", "s": "jv", "g": 6, "t": "code", "kind": "line", "topic": "상속", "src": "ConstructorChainExample.java", "q": "3단계 상속에서 생성자가 호출되는 순서를 확인하는 코드입니다. 실행 결과가 아래와 같도록 빈칸 ①~④를 고르세요.", "files": [{"name": "ConstructorChainExample.java", "code": "package sec01.exam12;\n\nclass Food {\n    Food() {\n        System.out.println(\"1. Food 생성자\");\n    }\n}\n\nclass Donut extends Food {\n    String name;\n\n    Donut() {\n@@L0@@    // 같은 클래스의 다른 생성자 호출\n        System.out.println(\"3. Donut() 기본 생성자\");\n    }\n\n    Donut(String name) {\n        // 첫 줄에 super();가 자동으로 들어감\n        this.name = name;\n        System.out.println(\"2. Donut(String) 생성자: \" + name);\n    }\n}\n\nclass LemonDonut extends Donut {\n    LemonDonut() {\n@@L1@@    // 부모의 기본 생성자 호출\n        System.out.println(\"4. LemonDonut 생성자\");\n    }\n}\n\npublic class ConstructorChainExample {\n    public static void main(String[] args) {\n@@L2@@    // 객체 생성 → 생성자 연쇄 호출\n@@L3@@    // 부모에게 물려받은 필드\n    }\n}"}], "out": "1. Food 생성자\n2. Donut(String) 생성자: 기본 도넛\n3. Donut() 기본 생성자\n4. LemonDonut 생성자\n이름: 기본 도넛", "blanks": [{"o": ["this(\"기본 도넛\");", "super(\"기본 도넛\");", "Donut(\"기본 도넛\");", "this.name = \"기본 도넛\";"], "a": 0, "e": "<code>this(...)<\/code>는 같은 클래스의 다른 생성자를 호출합니다. Food에는 String 생성자가 없어 <code>super(\"기본 도넛\")<\/code>은 오류이고, <code>this.name = ...<\/code>만 쓰면 2번 줄이 출력되지 않습니다.", "ind": 8}, {"o": ["super(\"레몬 도넛\");", "this();", "super();", "Food();"], "a": 2, "e": "<code>super()<\/code>는 부모의 기본 생성자 Donut()을 부릅니다(생략해도 자동 삽입). <code>super(\"레몬 도넛\")<\/code>을 쓰면 Donut(String)이 바로 호출되어 3번 줄이 빠지고 이름도 바뀝니다. <code>this()<\/code>는 자기 자신을 다시 불러 컴파일 오류(recursive constructor invocation)입니다.", "ind": 8}, {"o": ["LemonDonut lemon = new LemonDonut();", "LemonDonut lemon = new Donut();", "LemonDonut lemon = LemonDonut();", "LemonDonut lemon;"], "a": 0, "e": "자식 객체를 <code>new LemonDonut()<\/code>으로 만들면 Food → Donut(String) → Donut() → LemonDonut 순으로 생성자가 실행됩니다. 초기화하지 않은 지역변수 <code>lemon<\/code>은 사용할 수 없습니다.", "ind": 8}, {"o": ["System.out.println(\"이름: \" + lemon.super.name);", "System.out.println(\"이름: \" + lemon.name);", "System.out.println(\"이름: \" + Donut.name);", "System.out.println(\"이름: \" + name);"], "a": 1, "e": "상속받은 필드는 자식 객체에서 <code>lemon.name<\/code>으로 그대로 씁니다. name은 static이 아니라 <code>Donut.name<\/code>은 오류이고, main에는 name이라는 지역변수가 없습니다.", "ind": 8}]}, {"id": "jl2", "s": "jv", "g": 6, "t": "code", "kind": "line", "topic": "추상·동적할당", "src": "PolyArrayExample.java", "q": "추상 클래스 타입의 배열에 여러 자식 객체를 담아 합계를 구합니다. 빈칸 ①~⑥을 고르세요.", "files": [{"name": "PolyArrayExample.java", "code": "package sec02.exam11;\n\nabstract class Donut {                      // 추상 클래스\n    String name;\n\n    Donut(String name) {\n        this.name = name;\n    }\n\n@@L0@@    // 추상 메서드: 몸체 없음\n\n    void info() {\n        System.out.println(name + \" - \" + getPrice() + \"원\");\n    }\n}\n\nclass ChocoDonut extends Donut {\n    ChocoDonut() {\n        super(\"초코 도넛\");\n    }\n\n    @Override\n@@L1@@    // 추상 메서드 구현\n        return 2000;\n    }\n}\n\nclass LemonDonut extends Donut {\n    LemonDonut() {\n        super(\"레몬 도넛\");\n    }\n\n    @Override\n    int getPrice() {\n        return 2200;\n    }\n}\n\npublic class PolyArrayExample {\n    public static void main(String[] args) {\n@@L2@@    // 부모 타입 배열 동적 할당\n        box[0] = new ChocoDonut();\n@@L3@@    // 업캐스팅하여 저장\n        box[2] = new ChocoDonut();\n\n        int total = 0;\n@@L4@@    // 배열의 모든 도넛 순회\n            d.info();                           // 실제 객체의 getPrice() 호출\n@@L5@@\n        }\n        System.out.println(\"합계: \" + total + \"원\");\n    }\n}"}], "out": "초코 도넛 - 2000원\n레몬 도넛 - 2200원\n초코 도넛 - 2000원\n합계: 6200원", "blanks": [{"o": ["abstract int getPrice();", "abstract int getPrice() { }", "int getPrice();", "abstract int getPrice() { return 0; }"], "a": 0, "e": "추상 메서드는 <code>abstract<\/code>를 붙이고 중괄호 없이 세미콜론으로 끝냅니다. 몸체가 있으면 abstract를 붙일 수 없고, abstract 없이 몸체도 없으면 오류입니다.", "ind": 4}, {"o": ["int getPrice() {", "private int getPrice() {", "int getPrice(int price) {", "void getPrice() {"], "a": 0, "e": "오버라이딩은 이름·매개변수·반환형이 같아야 하고, 접근 범위를 좁힐 수 없습니다. 매개변수가 다르면 오버로딩이 되어 <code>@Override<\/code>에서 오류가 나고 추상 메서드도 구현되지 않습니다.", "ind": 4}, {"o": ["Donut[] box = new Donut();", "Donut box = new Donut[3];", "Donut[] box = new Donut[2];", "Donut[] box = new Donut[3];"], "a": 3, "e": "객체 배열은 <code>new 타입[크기]<\/code>로 참조 칸만 먼저 만듭니다. 추상 클래스도 배열 타입으로는 쓸 수 있습니다. 크기를 2로 하면 <code>box[2]<\/code>에서 ArrayIndexOutOfBoundsException이 납니다.", "ind": 8}, {"o": ["box[1] = new Donut(\"레몬 도넛\");", "box[1] = LemonDonut();", "box[1] = (Donut) \"레몬 도넛\";", "box[1] = new LemonDonut();"], "a": 3, "e": "자식 객체를 부모 타입 칸에 넣는 것은 자동 업캐스팅입니다. 추상 클래스 Donut은 <code>new<\/code>로 직접 만들 수 없습니다.", "ind": 8}, {"o": ["for (Donut d : box) {", "for (int d : box) {", "for (Donut d = box) {", "for (Donut d : Donut) {"], "a": 0, "e": "향상된 for문은 <code>for (원소타입 변수 : 배열)<\/code> 형식입니다. 원소 타입은 Donut입니다.", "ind": 8}, {"o": ["total = d.getPrice();", "total += d.getPrice();", "total += d.price;", "total += getPrice();"], "a": 1, "e": "<code>+=<\/code>로 누적해야 6200이 됩니다. <code>=<\/code>는 마지막 값 2000만 남고, Donut에는 price 필드가 없으며, static main 안에서 인스턴스 메서드를 객체 없이 부를 수 없습니다. 같은 <code>d.getPrice()<\/code>라도 실제 객체 종류에 따라 다른 메서드가 실행되는 것이 동적 바인딩입니다.", "ind": 12}]}, {"id": "jl3", "s": "jv", "g": 6, "t": "code", "kind": "line", "topic": "인터페이스", "src": "MultiInterfaceExample.java", "q": "한 클래스가 두 인터페이스를 구현하고, 인터페이스 타입으로 객체를 다룹니다. 빈칸 ①~⑤를 고르세요.", "files": [{"name": "MultiInterfaceExample.java", "code": "package sec02.exam11;\n\ninterface Sellable {                        // 판매 가능\n@@L0@@    // public abstract가 자동으로 붙음\n}\n\ninterface Eatable {                         // 먹을 수 있음\n    void eat();\n}\n\n@@L1@@    // 두 인터페이스 동시 구현\n    String name;\n    int price;\n\n    Donut(String name, int price) {\n        this.name = name;\n        this.price = price;\n    }\n\n    @Override\n@@L2@@    // 인터페이스 메서드는 public으로 구현\n        return price;\n    }\n\n    @Override\n    public void eat() {\n        System.out.println(name + \"을(를) 먹습니다.\");\n    }\n}\n\npublic class MultiInterfaceExample {\n    static void printPrice(Sellable s) {    // 인터페이스 타입 매개변수\n        System.out.println(\"가격: \" + s.getPrice() + \"원\");\n    }\n\n    public static void main(String[] args) {\n@@L3@@    // 인터페이스 타입으로 참조\n        printPrice(s);\n\n        // s.eat();  // 오류: Sellable 타입에는 eat()이 없음\n@@L4@@    // 같은 객체를 Eatable로 형 변환\n        e.eat();\n\n        System.out.println(s instanceof Eatable);\n    }\n}"}], "out": "가격: 2100원\n딸기 도넛을(를) 먹습니다.\ntrue", "blanks": [{"o": ["int getPrice();", "int getPrice() { }", "private int getPrice();", "int price;"], "a": 0, "e": "인터페이스의 일반 메서드는 몸체 없이 선언만 하며 자동으로 <code>public abstract<\/code>입니다. 인터페이스 필드는 상수라서 <code>int price;<\/code>처럼 초기화하지 않으면 오류입니다.", "ind": 4}, {"o": ["class Donut extends Sellable, Eatable {", "class Donut implements Sellable extends Eatable {", "class Donut implements Sellable {", "class Donut implements Sellable, Eatable {"], "a": 3, "e": "인터페이스는 <code>implements<\/code> 뒤에 쉼표로 여러 개 나열할 수 있습니다(다중 구현). Eatable을 빼면 eat()의 <code>@Override<\/code>가 재정의할 대상이 없어 오류입니다.", "ind": 0}, {"o": ["public int getPrice() {", "int getPrice() {", "protected int getPrice() {", "public void getPrice() {"], "a": 0, "e": "인터페이스 메서드는 public이므로 구현 메서드도 반드시 <code>public<\/code>이어야 합니다. 접근 제한자를 생략(default)하거나 protected로 쓰면 \"weaker access privileges\" 컴파일 오류입니다.", "ind": 4}, {"o": ["Sellable s = new Donut(\"딸기 도넛\", 2100);", "Sellable s = new Sellable(\"딸기 도넛\", 2100);", "Sellable s = Donut(\"딸기 도넛\", 2100);", "Donut s = new Sellable();"], "a": 0, "e": "인터페이스는 <code>new<\/code>로 객체를 만들 수 없고, 구현 클래스 객체를 인터페이스 타입 변수로 참조합니다.", "ind": 8}, {"o": ["Eatable e = s;", "Eatable e = (Eatable) s;", "Eatable e = new Eatable();", "Eatable e = (Donut) s.eat();"], "a": 1, "e": "Sellable 타입에서 Eatable 타입으로는 자동 변환되지 않으므로 <code>(Eatable)<\/code>로 명시적 형 변환합니다. 실제 객체가 두 인터페이스를 모두 구현해서 실행 시 문제없습니다.", "ind": 8}]}, {"id": "jl4", "s": "jv", "g": 6, "t": "code", "kind": "line", "topic": "인터페이스", "src": "DefaultMethodExample.java", "q": "인터페이스의 default·static 메서드와 default 메서드 오버라이딩 코드입니다. 빈칸 ①~⑤를 고르세요.", "files": [{"name": "DefaultMethodExample.java", "code": "package sec02.exam12;\n\ninterface Shop {\n@@L0@@    // 구현을 가진 default 메서드\n        System.out.println(\"가게 문을 엽니다.\");\n    }\n\n@@L1@@    // 객체 없이 호출하는 static 메서드\n        System.out.println(\"영업시간 09:00 ~ 19:00\");\n    }\n\n    void sell(String item);                 // 추상 메서드\n}\n\nclass DonutShop implements Shop {\n    @Override\n    public void open() {                    // default 메서드 오버라이딩\n@@L2@@    // 인터페이스의 원래 open() 호출\n        System.out.println(\"도넛을 진열합니다.\");\n    }\n\n    @Override\n@@L3@@\n        System.out.println(item + \" 판매 완료!\");\n    }\n}\n\npublic class DefaultMethodExample {\n    public static void main(String[] args) {\n@@L4@@    // 인터페이스명으로 static 호출\n        Shop shop = new DonutShop();\n        shop.open();\n        shop.sell(\"크림 도넛\");\n    }\n}"}], "out": "영업시간 09:00 ~ 19:00\n가게 문을 엽니다.\n도넛을 진열합니다.\n크림 도넛 판매 완료!", "blanks": [{"o": ["default void open() {", "void open() {", "public open() {", "abstract void open() {"], "a": 0, "e": "인터페이스 안에서 몸체가 있는 일반 메서드를 만들려면 <code>default<\/code>를 붙입니다. 붙이지 않으면 추상 메서드로 보는데 몸체가 있어 오류입니다.", "ind": 4}, {"o": ["void info() {", "final void info() {", "private void info();", "static void info() {"], "a": 3, "e": "객체 생성 없이 <code>인터페이스명.메서드()<\/code>로 부르는 메서드는 <code>static<\/code>입니다. 인터페이스 메서드에는 final을 붙일 수 없습니다.", "ind": 4}, {"o": ["Shop.super.open();", "super.open();", "this.open();", "Shop.open();"], "a": 0, "e": "인터페이스의 default 메서드 원본은 <code>인터페이스명.super.메서드()<\/code>로 부릅니다. <code>super.open()<\/code>은 부모 클래스(Object)를 가리켜 오류, <code>this.open()<\/code>은 자기 자신을 다시 불러 StackOverflowError입니다.", "ind": 8}, {"o": ["void sell(String item) {", "public void sell(String item) {", "public void sell() {", "public String sell(String item) {"], "a": 1, "e": "추상 메서드 구현은 이름·매개변수·반환형이 같고 <code>public<\/code>이어야 합니다.", "ind": 4}, {"o": ["Shop.info();", "shop.info();", "DonutShop.info();", "new Shop().info();"], "a": 0, "e": "인터페이스의 static 메서드는 구현 클래스에 상속되지 않아 반드시 <code>Shop.info()<\/code>처럼 인터페이스 이름으로 부릅니다. 이 줄에서는 shop 변수도 아직 선언되지 않았습니다.", "ind": 8}]}, {"id": "jl5", "s": "jv", "g": 6, "t": "code", "kind": "line", "topic": "동적할당·다형성", "src": "DynamicBindingExample.java", "q": "업캐스팅한 변수로 메서드와 필드를 사용할 때의 차이를 보는 코드입니다. 실행 결과를 보고 빈칸 ①~④를 고르세요.", "files": [{"name": "DynamicBindingExample.java", "code": "package sec02.exam13;\n\nclass Donut {\n    String name = \"기본 도넛\";\n\n    void show() {\n        System.out.println(\"Donut의 show(): \" + name);\n    }\n}\n\nclass ChocoDonut extends Donut {\n    String name = \"초코 도넛\";             // 부모와 같은 이름의 필드\n    String topping = \"초코 칩\";\n\n    @Override\n    void show() {                           // 메서드 오버라이딩\n        System.out.println(\"ChocoDonut의 show(): \" + name);\n    }\n\n    void addTopping() {                     // 자식에만 있는 메서드\n        System.out.println(topping + \" 토핑 추가\");\n    }\n}\n\npublic class DynamicBindingExample {\n    public static void main(String[] args) {\n@@L0@@    // 업캐스팅: 부모 타입 변수에 자식 객체\n\n        d.show();                               // 동적 바인딩 → 실제 객체의 메서드\n        System.out.println(\"d.name = \" + d.name);   // 필드는 변수 타입 기준\n\n@@L1@@    // 실제 객체 타입 확인\n@@L2@@    // 다운캐스팅\n@@L3@@\n            System.out.println(\"c.name = \" + c.name);\n        }\n    }\n}"}], "out": "ChocoDonut의 show(): 초코 도넛\nd.name = 기본 도넛\n초코 칩 토핑 추가\nc.name = 초코 도넛", "blanks": [{"o": ["ChocoDonut d = new Donut();", "Donut d = new ChocoDonut();", "Donut d = new Donut();", "ChocoDonut d = (ChocoDonut) new Donut();"], "a": 1, "e": "부모 타입 변수에 자식 객체를 담는 것이 업캐스팅입니다. <code>new Donut()<\/code>을 담으면 \"Donut의 show()\"가 나오고 if문도 거짓이 됩니다. 부모 객체를 자식으로 강제 형 변환하면 실행 중 ClassCastException이 납니다.", "ind": 8}, {"o": ["if (d instanceOf ChocoDonut) {", "if (d == ChocoDonut) {", "if (d instanceof ChocoDonut) {", "if (ChocoDonut instanceof d) {"], "a": 2, "e": "타입 검사는 <code>변수 instanceof 클래스<\/code> 순서이며 연산자는 모두 소문자입니다.", "ind": 8}, {"o": ["ChocoDonut c = d;", "ChocoDonut c = new ChocoDonut(d);", "Donut c = (ChocoDonut) d;", "ChocoDonut c = (ChocoDonut) d;"], "a": 3, "e": "부모 타입 → 자식 타입은 자동 변환이 안 되므로 <code>(ChocoDonut)<\/code>로 다운캐스팅합니다. 결과를 Donut 변수에 담으면 다시 Donut 타입이라 addTopping()을 부를 수 없습니다.", "ind": 12}, {"o": ["d.addTopping();", "c.addTopping();", "Donut.addTopping();", "super.addTopping();"], "a": 1, "e": "<code>d<\/code>의 타입은 Donut이라 자식에만 있는 addTopping()은 보이지 않습니다. 다운캐스팅한 <code>c<\/code>로 불러야 합니다. 메서드는 실제 객체 기준(동적 바인딩), 필드는 변수 타입 기준이라 <code>d.name<\/code>은 \"기본 도넛\"입니다.", "ind": 12}]}, {"id": "jl6", "s": "jv", "g": 6, "t": "code", "kind": "line", "topic": "오버라이딩", "src": "OverrideRuleExample.java", "q": "오버라이딩 규칙(접근 제한자, 반환형, final)과 오버로딩을 함께 쓰는 코드입니다. 빈칸 ①~⑤를 고르세요.", "files": [{"name": "OverrideRuleExample.java", "code": "package sec01.exam13;\n\nclass Donut {\n    protected int price = 1500;\n\n    public void show() {\n        System.out.println(\"기본 도넛: \" + price + \"원\");\n    }\n\n    protected int getPrice() {\n        return price;\n    }\n\n    final void bake() {                     // final 메서드: 오버라이딩 금지\n        System.out.println(\"180도에서 굽습니다.\");\n    }\n}\n\nclass CreamDonut extends Donut {\n    @Override\n@@L0@@    // 접근 범위는 같거나 더 넓게\n        System.out.println(\"크림 도넛: \" + getPrice() + \"원\");\n    }\n\n    @Override\n@@L1@@    // protected → public 확장 가능\n        return price + 500;\n    }\n\n    // void bake() { }  // 오류: final 메서드는 재정의 불가\n\n    void show(String msg) {                 // 오버로딩 (매개변수가 다름)\n        System.out.println(msg + \" / \" + getPrice() + \"원\");\n    }\n}\n\npublic class OverrideRuleExample {\n    public static void main(String[] args) {\n        Donut d = new CreamDonut();\n@@L2@@    // CreamDonut의 show() 실행\n        d.bake();\n@@L3@@    // 오버라이딩된 getPrice()\n        CreamDonut c = (CreamDonut) d;\n@@L4@@    // 오버로딩된 show(String)\n    }\n}"}], "out": "크림 도넛: 2000원\n180도에서 굽습니다.\n가격: 2000\n오늘의 추천 / 2000원", "blanks": [{"o": ["public void show() {", "void show() {", "protected void show() {", "public static void show() {"], "a": 0, "e": "부모가 public이면 자식도 public이어야 합니다. 접근 범위를 좁히면 오류이고, 인스턴스 메서드를 static으로 바꿔 재정의할 수도 없습니다.", "ind": 4}, {"o": ["private int getPrice() {", "public long getPrice() {", "public int getPrice() {", "int getPrice() {"], "a": 2, "e": "protected → public처럼 <b>넓히는<\/b> 것은 허용됩니다. 반환형을 int에서 long으로 바꾸거나, default(생략)·private로 좁히면 컴파일 오류입니다.", "ind": 4}, {"o": ["d.show(\"오늘의 추천\");", "d.show();", "Donut.show();", "super.show();"], "a": 1, "e": "<code>d.show()<\/code>는 Donut 타입 변수지만 실제 객체가 CreamDonut이라 자식의 show()가 실행됩니다. Donut에는 show(String)이 없어 <code>d.show(\"...\")<\/code>는 오류입니다.", "ind": 8}, {"o": ["System.out.println(\"가격: \" + d.getPrice());", "System.out.println(\"가격: \" + d.price);", "System.out.println(\"가격: \" + super.getPrice());", "System.out.println(\"가격: \" + Donut.getPrice());"], "a": 0, "e": "<code>d.getPrice()<\/code>는 오버라이딩된 메서드라 2000을 돌려줍니다. 필드 <code>d.price<\/code>는 1500 그대로이고, static main에서는 super를 쓸 수 없습니다.", "ind": 8}, {"o": ["d.show(\"오늘의 추천\");", "c.show(\"오늘의 추천\");", "c.show();", "c.super.show(\"오늘의 추천\");"], "a": 1, "e": "오버로딩된 <code>show(String)<\/code>은 CreamDonut에만 있으므로 다운캐스팅한 <code>c<\/code>로 불러야 합니다. <code>c.show()<\/code>는 \"크림 도넛: 2000원\"을 출력합니다.", "ind": 8}]}, {"id": "jl7", "s": "jv", "g": 5, "t": "code", "kind": "line", "topic": "동적할당", "src": "ObjectArrayExample.java", "q": "객체 배열을 동적으로 할당하고 static 변수로 생성 개수를 셉니다. 실행 결과가 아래와 같도록 빈칸 ①~④를 고르세요.", "files": [{"name": "ObjectArrayExample.java", "code": "package sec01.exam14;\n\nclass Donut {\n    String name;\n    int price;\n    static int count = 0;                   // 생성된 도넛 수 (모든 객체 공유)\n\n    Donut(String name, int price) {\n        this.name = name;\n        this.price = price;\n        count++;\n    }\n}\n\npublic class ObjectArrayExample {\n    public static void main(String[] args) {\n        String[] names = {\"초코\", \"레몬\", \"딸기\", \"크림\"};\n        int[] prices = {2000, 2200, 2100, 2500};\n\n@@L0@@    // 참조 4칸만 만든 상태 (모두 null)\n        System.out.println(\"생성 전 count: \" + Donut.count);\n\n        for (int i = 0; i < box.length; i++) {\n@@L1@@    // 각 칸에 객체 생성\n        }\n        System.out.println(\"생성 후 count: \" + Donut.count);\n\n@@L2@@    // 같은 객체를 가리킴 (주소 복사)\n        copy.price = 1800;\n        System.out.println(\"box[0] 가격: \" + box[0].price);\n\n        int max = 0;\n        String best = \"\";\n        for (Donut d : box) {\n@@L3@@    // 가장 비싼 도넛 찾기\n                max = d.price;\n                best = d.name;\n            }\n        }\n        System.out.println(\"가장 비싼 도넛: \" + best + \" \" + max + \"원\");\n    }\n}"}], "out": "생성 전 count: 0\n생성 후 count: 4\nbox[0] 가격: 1800\n가장 비싼 도넛: 크림 2500원", "blanks": [{"o": ["Donut[] box = new Donut(names.length);", "Donut box = new Donut[names.length];", "Donut[] box = new Donut[names.length];", "Donut[] box = new Donut[names.length()];"], "a": 2, "e": "객체 배열은 <code>new Donut[크기]<\/code>로 할당하며, 이때는 참조 칸만 생기고 각 칸은 null입니다. 생성자가 실행되지 않으므로 count는 0입니다. 배열 길이는 <code>length<\/code>(괄호 없음)입니다.", "ind": 8}, {"o": ["box[i] = new Donut(names[i], prices[i]);", "box[i] = Donut(names[i], prices[i]);", "box[i].name = names[i];", "box = new Donut(names[i], prices[i]);"], "a": 0, "e": "각 칸마다 <code>new<\/code>로 객체를 만들어야 합니다. 칸이 null인 상태에서 <code>box[i].name<\/code>에 접근하면 NullPointerException이 납니다.", "ind": 12}, {"o": ["Donut copy = box[0];", "Donut copy = new Donut(box[0].name, box[0].price);", "Donut copy = box;", "Donut copy = box[0].clone();"], "a": 0, "e": "<code>copy = box[0]<\/code>은 주소만 복사하므로 copy를 바꾸면 box[0]도 바뀝니다(1800). <code>new<\/code>로 새 객체를 만들면 box[0]은 2000 그대로입니다.", "ind": 8}, {"o": ["if (d.price > max) {", "if (d.price < max) {", "if (box.price > max) {", "if (d > max) {"], "a": 0, "e": "최댓값을 찾으려면 현재 최댓값보다 클 때 갱신합니다. <code>&lt;<\/code>를 쓰면 처음 max가 0이라 한 번도 갱신되지 않습니다.", "ind": 12}]}, {"id": "jl8", "s": "jv", "g": 3, "t": "code", "kind": "line", "topic": "동적할당", "src": "PascalExample.java", "q": "가변 2차원 배열을 행마다 동적으로 할당해 파스칼의 삼각형을 만듭니다. 빈칸 ①~⑤를 고르세요.", "files": [{"name": "PascalExample.java", "code": "package sec03.exam18;\n\npublic class PascalExample {\n    public static void main(String[] args) {\n        int n = 5;\n@@L0@@    // 행만 먼저 할당 (열은 나중에)\n\n        for (int i = 0; i < n; i++) {\n@@L1@@    // i번째 행에 i+1칸 할당\n@@L2@@    // 양 끝은 1\n            for (int j = 1; j < i; j++) {\n@@L3@@\n            }\n        }\n\n        for (int[] row : tri) {\n            for (int v : row) {\n                System.out.print(v + \" \");\n            }\n            System.out.println();\n        }\n@@L4@@\n    }\n}"}], "out": "1 \n1 1 \n1 2 1 \n1 3 3 1 \n1 4 6 4 1 \n마지막 행 길이: 5", "blanks": [{"o": ["int[][] tri = new int[][n];", "int[][] tri = new int[n][];", "int[] tri = new int[n][];", "int[][] tri = new int[n];"], "a": 1, "e": "가변 배열은 <b>앞쪽(행) 크기만<\/b> 정하고 뒤쪽은 비워 둡니다: <code>new int[n][]<\/code>. 열 크기만 정하는 <code>new int[][n]<\/code>은 문법 오류입니다.", "ind": 8}, {"o": ["tri[i] = new int[i];", "tri[i] = new int[n][i + 1];", "tri[i][] = new int[i + 1];", "tri[i] = new int[i + 1];"], "a": 3, "e": "i번째 행은 i+1칸이 필요합니다. <code>new int[i]<\/code>면 0번 행이 0칸이라 <code>tri[0][0]<\/code>에서 ArrayIndexOutOfBoundsException이 납니다.", "ind": 12}, {"o": ["tri[i][0] = tri[i][i - 1] = 1;", "tri[0][i] = tri[i][0] = 1;", "tri[i] = 1;", "tri[i][0] = tri[i][i] = 1;"], "a": 3, "e": "각 행의 첫 칸(0)과 마지막 칸(i)이 1입니다. <code>i - 1<\/code>은 i가 0일 때 -1이 되어 예외가 납니다.", "ind": 12}, {"o": ["tri[i][j] = tri[i][j - 1] + tri[i][j];", "tri[i][j] = tri[i - 1][j] + tri[i - 1][j + 1];", "tri[i][j] = tri[i - 1][j - 1] + tri[i - 1][j];", "tri[i][j] = tri[i - 1][j - 1] * tri[i - 1][j];"], "a": 2, "e": "파스칼 삼각형은 <b>윗행<\/b>의 왼쪽 위(j-1)와 바로 위(j)를 더한 값입니다. <code>j + 1<\/code>을 쓰면 윗행 범위를 벗어납니다.", "ind": 16}, {"o": ["System.out.println(\"마지막 행 길이: \" + tri[n].length);", "System.out.println(\"마지막 행 길이: \" + tri[n - 1].length());", "System.out.println(\"마지막 행 길이: \" + tri[][n - 1].length);", "System.out.println(\"마지막 행 길이: \" + tri[n - 1].length);"], "a": 3, "e": "마지막 행의 인덱스는 n-1이고 배열 길이는 괄호 없는 <code>length<\/code>입니다. <code>tri[n]<\/code>은 범위를 벗어납니다.", "ind": 8}]}, {"id": "jl9", "s": "jv", "g": 6, "t": "code", "kind": "line", "topic": "추상·인터페이스", "src": "TemplateExample.java", "q": "추상 클래스가 인터페이스를 구현하고, 순서가 고정된 final 메서드 안에서 자식이 구현한 메서드를 부릅니다. 빈칸 ①~⑤를 고르세요.", "files": [{"name": "TemplateExample.java", "code": "package sec02.exam14;\n\ninterface Decoratable {\n    void decorate();\n}\n\n@@L0@@    // 추상 클래스가 인터페이스 구현\n    String name;\n\n    DonutMaker(String name) {\n        this.name = name;\n    }\n\n@@L1@@    // 만드는 순서는 고정 (오버라이딩 금지)\n        System.out.println(\"[\" + name + \"] 반죽 → 튀기기\");\n        fill();\n        decorate();\n        System.out.println(\"[\" + name + \"] 완성!\");\n    }\n\n    abstract void fill();                   // 속재료는 자식이 결정\n}\n\n@@L2@@    // decorate()와 fill() 모두 구현해야 함\n    CustardMaker() {\n        super(\"커스터드\");\n    }\n\n    @Override\n    void fill() {\n        System.out.println(\"커스터드 크림 채우기\");\n    }\n\n    @Override\n@@L3@@    // 인터페이스 메서드 구현은 public\n        System.out.println(\"슈가 파우더 뿌리기\");\n    }\n}\n\npublic class TemplateExample {\n    public static void main(String[] args) {\n@@L4@@    // 추상 클래스 타입으로 참조\n        maker.make();\n    }\n}"}], "out": "[커스터드] 반죽 → 튀기기\n커스터드 크림 채우기\n슈가 파우더 뿌리기\n[커스터드] 완성!", "blanks": [{"o": ["class DonutMaker implements Decoratable {", "abstract class DonutMaker extends Decoratable {", "interface DonutMaker implements Decoratable {", "abstract class DonutMaker implements Decoratable {"], "a": 3, "e": "추상 메서드 fill()을 가지고 decorate()도 구현하지 않았으므로 클래스는 <code>abstract<\/code>여야 합니다. 클래스가 인터페이스를 받을 때는 <code>implements<\/code>입니다.", "ind": 0}, {"o": ["abstract void make() {", "final abstract void make() {", "final void make() {", "static void make() {"], "a": 2, "e": "<code>final<\/code> 메서드는 자식이 재정의할 수 없어 만드는 순서가 고정됩니다. abstract와 final은 함께 쓸 수 없고, static 메서드에서는 인스턴스 필드 name과 fill()을 쓸 수 없습니다.", "ind": 4}, {"o": ["class CustardMaker implements DonutMaker {", "class CustardMaker extends DonutMaker, Decoratable {", "class CustardMaker extends DonutMaker {", "abstract class CustardMaker extends DonutMaker {"], "a": 2, "e": "추상 클래스는 <code>extends<\/code>로 상속합니다. CustardMaker까지 abstract로 만들면 main에서 <code>new CustardMaker()<\/code>를 할 수 없습니다.", "ind": 0}, {"o": ["void decorate() {", "public void decorate() {", "public void decorate(String s) {", "protected void decorate() {"], "a": 1, "e": "인터페이스에서 온 메서드는 <code>public<\/code>으로 구현해야 합니다. 매개변수가 다르면 구현이 아니라 오버로딩입니다.", "ind": 4}, {"o": ["DonutMaker maker = new DonutMaker(\"커스터드\");", "DonutMaker maker = new CustardMaker();", "Decoratable maker = new CustardMaker();", "CustardMaker maker = new DonutMaker();"], "a": 1, "e": "추상 클래스는 객체를 만들 수 없지만 참조 변수 타입으로는 쓸 수 있습니다. Decoratable 타입에는 make()가 없어 다음 줄에서 오류가 납니다.", "ind": 8}]}, {"id": "jl10", "s": "jv", "g": 6, "t": "code", "kind": "line", "topic": "인터페이스·동적할당", "src": "PaymentExample.java", "q": "결제 방식을 인터페이스로 만들고 배열 하나로 여러 결제 객체를 처리합니다. 빈칸 ①~⑤를 고르세요.", "files": [{"name": "PaymentExample.java", "code": "package sec02.exam15;\n\ninterface Payment {\n@@L0@@    // 상수 (public static final 자동)\n    int pay(int amount);\n}\n\nclass Card implements Payment {\n    @Override\n    public int pay(int amount) {\n@@L1@@    // 카드는 수수료 추가\n    }\n}\n\nclass Cash implements Payment {\n    @Override\n    public int pay(int amount) {\n        return amount;\n    }\n}\n\nclass Point implements Payment {\n    int point = 1000;\n\n    @Override\n    public int pay(int amount) {\n@@L2@@    // 가진 포인트만큼만 사용\n        point -= used;\n        return amount - used;\n    }\n}\n\npublic class PaymentExample {\n    public static void main(String[] args) {\n@@L3@@    // 인터페이스 배열\n        int price = 2500;\n\n        for (Payment p : pays) {\n@@L4@@    // 실제 클래스 이름\n            System.out.println(kind + \" 결제: \" + p.pay(price) + \"원\");\n        }\n        System.out.println(\"수수료 상수: \" + Payment.FEE);\n    }\n}"}], "out": "Card 결제: 2600원\nCash 결제: 2500원\nPoint 결제: 1500원\n수수료 상수: 100", "blanks": [{"o": ["int FEE;", "int FEE = 100;", "private int FEE = 100;", "final int FEE;"], "a": 1, "e": "인터페이스의 필드는 자동으로 <code>public static final<\/code> 상수라서 선언과 동시에 값을 넣어야 하고 private일 수 없습니다.", "ind": 4}, {"o": ["return amount + FEE;", "return amount + Payment.FEE();", "return amount + fee;", "return amount - FEE;"], "a": 0, "e": "구현 클래스 안에서는 인터페이스 상수를 이름 그대로 <code>FEE<\/code>로 씁니다. 상수는 메서드가 아니라 괄호가 없고, 대소문자도 구분합니다.", "ind": 8}, {"o": ["int used = Math.max(point, amount);", "int used = point - amount;", "int used = Math.min(point, amount);", "int used = Math.min(point);"], "a": 2, "e": "포인트(1000)와 금액(2500) 중 <b>작은 값<\/b>만큼 쓰므로 <code>Math.min<\/code>입니다. max를 쓰면 2500을 써서 0원이 됩니다.", "ind": 8}, {"o": ["Payment[] pays = new Payment[] {Card, Cash, Point};", "Payment pays = {new Card(), new Cash(), new Point()};", "Payment[] pays = {new Payment(), new Payment(), new Payment()};", "Payment[] pays = {new Card(), new Cash(), new Point()};"], "a": 3, "e": "인터페이스 타입 배열에 구현 객체들을 <code>new<\/code>로 만들어 넣습니다. 인터페이스 자체는 <code>new Payment()<\/code>로 만들 수 없습니다.", "ind": 8}, {"o": ["String kind = p.toString();", "String kind = p.getName();", "String kind = p.getClass().getSimpleName();", "String kind = Payment.class;"], "a": 2, "e": "<code>getClass()<\/code>는 실제 객체의 클래스를 알려 주므로 같은 Payment 변수라도 Card, Cash, Point가 출력됩니다. toString()을 오버라이딩하지 않으면 \"Card@1b6d3586\" 같은 값이 나옵니다.", "ind": 12}]}, {"id": "jl11", "s": "jv", "g": 7, "t": "code", "kind": "line", "topic": "오버라이딩", "src": "ObjectMethodExample.java", "q": "Object 클래스의 toString()과 equals()를 오버라이딩해 객체 배열에서 같은 도넛을 찾습니다. 빈칸 ①~⑤를 고르세요.", "files": [{"name": "ObjectMethodExample.java", "code": "package sec02.exam13;\n\nclass Donut {\n    String name;\n    int price;\n\n    Donut(String name, int price) {\n        this.name = name;\n        this.price = price;\n    }\n\n    @Override\n@@L0@@    // 출력 형식 재정의\n        return name + \"(\" + price + \"원)\";\n    }\n\n    @Override\n@@L1@@    // 이름이 같으면 같은 도넛\n@@L2@@\n@@L3@@\n        return name.equals(other.name);\n    }\n}\n\npublic class ObjectMethodExample {\n    public static void main(String[] args) {\n        Donut[] menu = {\n            new Donut(\"초코\", 2000),\n            new Donut(\"레몬\", 2200),\n            new Donut(\"딸기\", 2100)\n        };\n        Donut order = new Donut(\"레몬\", 0);\n\n        for (int i = 0; i < menu.length; i++) {\n@@L4@@    // 내용 비교\n                System.out.println(\"찾음: \" + menu[i] + \" (\" + i + \"번)\");\n            }\n        }\n        System.out.println(\"== 비교: \" + (menu[1] == order));\n        System.out.println(menu[0]);            // toString() 자동 호출\n    }\n}"}], "out": "찾음: 레몬(2200원) (1번)\n== 비교: false\n초코(2000원)", "blanks": [{"o": ["public void toString() {", "String toString() {", "public String toString(Donut d) {", "public String toString() {"], "a": 3, "e": "Object의 원형은 <code>public String toString()<\/code>입니다. 반환형을 바꾸거나 public을 빼면 오류이고, 매개변수를 넣으면 오버로딩이 되어 @Override에서 오류입니다.", "ind": 4}, {"o": ["public boolean equals(Donut obj) {", "boolean equals(Object obj) {", "public boolean equals(Object obj) {", "public int equals(Object obj) {"], "a": 2, "e": "원형이 <code>public boolean equals(Object obj)<\/code>라서 매개변수도 Object여야 오버라이딩입니다. Donut으로 바꾸면 오버로딩이 됩니다.", "ind": 4}, {"o": ["if (!(obj instanceof Donut)) return false;", "if (obj instanceof Donut) return false;", "if (!(obj instanceOf Donut)) return false;", "if (obj != Donut) return false;"], "a": 0, "e": "Donut이 <b>아니면<\/b> false를 돌려줘야 하므로 <code>!( ... instanceof Donut)<\/code>입니다. 느낌표를 빼면 Donut일 때 항상 false가 되어 아무것도 찾지 못합니다.", "ind": 8}, {"o": ["Donut other = (Donut) obj;", "Donut other = obj;", "Object other = (Donut) obj;", "Donut other = new Donut(obj);"], "a": 0, "e": "Object 타입에는 name 필드가 없으므로 <code>(Donut)<\/code>으로 다운캐스팅해 Donut 변수에 담아야 <code>other.name<\/code>을 쓸 수 있습니다.", "ind": 8}, {"o": ["if (menu[i] == order) {", "if (menu[i].name == order) {", "if (equals(menu[i], order)) {", "if (menu[i].equals(order)) {"], "a": 3, "e": "<code>==<\/code>는 주소 비교라 서로 다른 객체면 false입니다. 내용 비교는 오버라이딩한 <code>equals()<\/code>를 호출합니다.", "ind": 12}]}, {"id": "jl12", "s": "jv", "g": 6, "t": "code", "kind": "line", "topic": "상속·동적할당", "src": "PolyParamExample.java", "q": "3단계 상속에서 부모 타입 매개변수와 반환형으로 여러 객체를 다룹니다. 빈칸 ①~⑤를 고르세요.", "files": [{"name": "PolyParamExample.java", "code": "package sec02.exam16;\n\nclass Donut {\n    int getPrice() { return 1500; }\n    String getName() { return \"기본\"; }\n}\n\nclass ChocoDonut extends Donut {\n    @Override\n    int getPrice() {\n@@L0@@    // 부모 가격 + 500\n    }\n\n    @Override\n    String getName() { return \"초코\"; }\n}\n\nclass MintChoco extends ChocoDonut {        // 3단계 상속\n    @Override\n    int getPrice() {\n        return super.getPrice() + 300;      // ChocoDonut 가격 + 300\n    }\n\n    @Override\n    String getName() { return \"민트초코\"; }\n}\n\npublic class PolyParamExample {\n@@L1@@    // 어떤 도넛이든 받는 매개변수\n        System.out.println(d.getName() + \" 도넛: \" + d.getPrice() + \"원\");\n    }\n\n@@L2@@    // 번호에 맞는 객체를 만들어 반환\n        if (no == 1) return new ChocoDonut();\n        if (no == 2) return new MintChoco();\n        return new Donut();\n    }\n\n    public static void main(String[] args) {\n        int sum = 0;\n        for (int no = 0; no <= 2; no++) {\n@@L3@@    // 반환된 객체를 부모 타입으로 받음\n            receipt(d);\n@@L4@@\n        }\n        System.out.println(\"합계: \" + sum + \"원\");\n    }\n}"}], "out": "기본 도넛: 1500원\n초코 도넛: 2000원\n민트초코 도넛: 2300원\n합계: 5800원", "blanks": [{"o": ["return getPrice() + 500;", "return super.getPrice() + 500;", "return Donut.getPrice() + 500;", "return super.getPrice + 500;"], "a": 1, "e": "부모 버전을 부르려면 <code>super.getPrice()<\/code>입니다. super 없이 <code>getPrice()<\/code>를 부르면 자기 자신을 계속 호출해 StackOverflowError가 납니다. MintChoco의 <code>super.getPrice()<\/code>는 ChocoDonut의 2000을 받아 2300이 됩니다.", "ind": 8}, {"o": ["static void receipt(ChocoDonut d) {", "static void receipt(Object d) {", "static void receipt(Donut d) {", "void receipt(Donut d) {"], "a": 2, "e": "매개변수를 최상위 부모 타입 <code>Donut<\/code>으로 받아야 모든 자식 객체를 받을 수 있습니다(다형성). Object로 받으면 getName()을 부를 수 없고, static이 없으면 main에서 호출할 수 없습니다.", "ind": 4}, {"o": ["static void pick(int no) {", "static Donut pick(int no) {", "static ChocoDonut pick(int no) {", "static Donut pick() {"], "a": 1, "e": "세 종류 객체를 모두 돌려주려면 반환형이 공통 부모 <code>Donut<\/code>이어야 합니다. ChocoDonut이면 <code>return new Donut()<\/code>에서 오류입니다.", "ind": 4}, {"o": ["ChocoDonut d = pick(no);", "Donut d = new pick(no);", "Donut d = (MintChoco) pick(no);", "Donut d = pick(no);"], "a": 3, "e": "pick()의 반환형이 Donut이므로 Donut 변수로 받습니다. 무조건 MintChoco로 형 변환하면 no가 0일 때 ClassCastException이 납니다.", "ind": 12}, {"o": ["sum = d.getPrice();", "sum += getPrice();", "sum += d.getPrice;", "sum += d.getPrice();"], "a": 3, "e": "1500 + 2000 + 2300 = 5800이 되도록 <code>+=<\/code>로 누적합니다. 메서드 호출에는 괄호가 필요합니다.", "ind": 12}]}, {"id": "jl13", "s": "jv", "g": 6, "t": "code", "kind": "line", "topic": "인터페이스·상속", "src": "InterfaceInheritExample.java", "q": "인터페이스끼리의 상속과, 클래스 상속·인터페이스 구현을 동시에 하는 코드입니다. 빈칸 ①~⑤를 고르세요.", "files": [{"name": "InterfaceInheritExample.java", "code": "package sec02.exam17;\n\ninterface Menu {\n    String getName();\n}\n\n@@L0@@    // 인터페이스가 인터페이스를 상속\n    int getPrice();\n}\n\nclass Bakery {\n    void open() {\n        System.out.println(\"베이커리 오픈\");\n    }\n}\n\n@@L1@@    // 상속과 구현을 동시에\n    @Override\n@@L2@@    // Menu에서 물려받은 메서드도 구현\n        return \"카페 도넛 세트\";\n    }\n\n    @Override\n    public int getPrice() {\n        return 4500;\n    }\n\n    @Override\n    void open() {\n@@L3@@    // Bakery의 open() 실행\n        System.out.println(\"커피 머신 가동\");\n    }\n}\n\npublic class InterfaceInheritExample {\n    public static void main(String[] args) {\n        DonutCafe cafe = new DonutCafe();\n        cafe.open();\n\n@@L4@@    // 자동 형 변환 (업캐스팅)\n        System.out.println(\"메뉴: \" + m.getName());\n\n        PriceMenu pm = cafe;\n        System.out.println(pm.getName() + \" = \" + pm.getPrice() + \"원\");\n        System.out.println(m instanceof Bakery);\n    }\n}"}], "out": "베이커리 오픈\n커피 머신 가동\n메뉴: 카페 도넛 세트\n카페 도넛 세트 = 4500원\ntrue", "blanks": [{"o": ["interface PriceMenu extends Menu {", "interface PriceMenu implements Menu {", "class PriceMenu extends Menu {", "abstract interface PriceMenu implements Menu {"], "a": 0, "e": "인터페이스가 인터페이스를 물려받을 때는 <code>extends<\/code>를 씁니다. 클래스는 인터페이스를 extends할 수 없습니다.", "ind": 0}, {"o": ["class DonutCafe extends Bakery implements PriceMenu {", "class DonutCafe implements PriceMenu extends Bakery {", "class DonutCafe extends Bakery, PriceMenu {", "class DonutCafe extends PriceMenu implements Bakery {"], "a": 0, "e": "순서는 항상 <code>extends 부모클래스 implements 인터페이스<\/code>입니다. 순서를 바꾸거나 쉼표로 섞으면 컴파일 오류입니다.", "ind": 0}, {"o": ["String getName() {", "public String getName(String s) {", "public String getName() {", "public void getName() {"], "a": 2, "e": "PriceMenu를 구현하면 부모 인터페이스 Menu의 getName()까지 모두 <code>public<\/code>으로 구현해야 합니다.", "ind": 4}, {"o": ["Bakery.open();", "this.open();", "super.open();", "super();"], "a": 2, "e": "부모 클래스 메서드는 <code>super.open()<\/code>으로 호출합니다. <code>this.open()<\/code>은 자기 자신을 다시 불러 StackOverflowError, <code>super()<\/code>는 생성자 첫 줄에서만 쓸 수 있습니다.", "ind": 8}, {"o": ["Menu m = new Menu();", "Menu m = (Bakery) cafe;", "Menu m = cafe;", "Menu m = cafe.getName();"], "a": 2, "e": "DonutCafe는 PriceMenu를 통해 Menu도 구현하므로 <code>Menu m = cafe<\/code>로 자동 형 변환됩니다. Bakery 타입은 Menu가 아니라서 그대로 대입할 수 없습니다.", "ind": 8}]}], "bdw": [{"n": 1, "files": "01 디지털 트랜스포메이션 · 02 빅데이터란?"}, {"n": 2, "files": "03 데이터 사이언티스트/엔지니어 업무 · 04 산업별 빅데이터 활용사례"}, {"n": 3, "files": "05 정형데이터 활용사례 · 06 비정형데이터 활용사례"}, {"n": 4, "files": "07 빅데이터 분석 기획 · 08 빅데이터 분석 프로세스"}, {"n": 5, "files": "09 데이터와 통계 분석 · 10 통계적 추정과 검정"}, {"n": 6, "files": "11 상관분석과 회귀분석 · 12 데이터 마이닝 개요"}, {"n": 7, "files": "13 분류와 군집화 · 14 데이터 마이닝 실습"}], "lxt": {"1": "운영체제 개념 · 역사 · 배포판 · 그래픽 · 파일/메모리", "2": "가상화 · VirtualBox · Ubuntu 설치 · 명령어 · VM 관리", "3": "데스크탑 UI · 터미널 · 계정 · 빌드 환경 · 패키지 · SSH"}, "notes": "<nav class=\"note-toc\"><a class=\"chip\" href=\"#n0\" data-toc=\"n0\">한눈에 보기<\/a><a class=\"chip\" href=\"#n1\" data-toc=\"n1\">1주차<\/a><a class=\"chip\" href=\"#n2\" data-toc=\"n2\">2주차<\/a><a class=\"chip\" href=\"#n3\" data-toc=\"n3\">3주차<\/a><a class=\"chip\" href=\"#n4\" data-toc=\"n4\">4주차<\/a><a class=\"chip\" href=\"#n5\" data-toc=\"n5\">5주차<\/a><a class=\"chip\" href=\"#n6\" data-toc=\"n6\">6주차<\/a><a class=\"chip\" href=\"#n7\" data-toc=\"n7\">7주차<\/a><\/nav><h2 id=\"n0\">한눈에 보기<\/h2><p>7주는 하나의 흐름이다. 도구(1주) → 학습의 종류(2주) → 퍼셉트론과 그 한계(3주) → 은닉층·활성화 함수로 만드는 신경망(4주) → 행렬로 계산하는 순전파와 Softmax(5주) → 손실과 미니배치(6주) → 기울기로 가중치 갱신(7주).<\/p><div class=\"tbl\"><table><tr><th>주차<\/th><th>한 줄 요약<\/th><th>꼭 외울 것<\/th><\/tr><tr><td>1<\/td><td>Python·NumPy·Matplotlib은 딥러닝 구현 도구<\/td><td><code>x*y<\/code>는 원소별 곱, <code>np.dot<\/code>은 행렬 곱 / 브로드캐스팅 / <code>arange<\/code>(끝 제외) vs <code>linspace<\/code>(끝 포함) / <code>copy()<\/code> vs 참조<\/td><\/tr><tr><td>2<\/td><td>AI ⊃ ML ⊃ DL, 지도/비지도, 매개변수적/비매개변수적<\/td><td>라벨 유무가 지도/비지도를 가른다 / 매개변수 수 고정 = 매개변수적(선형·로지스틱·SVM·신경망), 데이터에 따라 변함 = 비매개변수적(K-NN·결정트리·랜덤포레스트)<\/td><\/tr><tr><td>3<\/td><td>퍼셉트론 = 가중합 &gt; θ 이면 1<\/td><td>AND·OR·NAND 가중치/임계값 / b = −θ / XOR = AND(NAND, OR), 직선 하나로 못 나눠 단층 불가<\/td><\/tr><tr><td>4<\/td><td>층마다 z = Wa + b, a = f(z)<\/td><td>활성화 함수 없으면 층을 쌓아도 선형 / Step(미분 불가)·Sigmoid(기울기 소실)·Tanh(0 중심)·ReLU(Dying ReLU) / (m×n)(n×p) = m×p<\/td><\/tr><tr><td>5<\/td><td>행렬 곱으로 순전파, 출력층은 Identity 또는 Softmax<\/td><td>[[1,2,3],[4,5,6]]·[0.1,0.2,0.3] + [0.5,0.6] = [1.9, 3.8] / Softmax([2,1,0.1]) = [0.659, 0.242, 0.099] / overflow는 max(z)를 빼서 해결<\/td><\/tr><tr><td>6<\/td><td>데이터 중심(End-to-End) 학습, 손실 함수, 미니배치<\/td><td>SSE(회귀) vs 교차 엔트로피(분류) / log(0) → <code>np.clip<\/code> / MNIST 28×28, 60,000/10,000 / 입력 횟수 = ⌈N / 배치⌉<\/td><\/tr><tr><td>7<\/td><td>기울기를 구해 θ := θ − α∇J(θ)<\/td><td>중앙 차분 O(h²) &gt; 전방 차분 O(h), h ≈ 10⁻⁵ / 학습률 크면 발산, 작으면 느림 / Adagrad·RMSprop·Adam / delta = pred − true, weight_delta = delta × input<\/td><\/tr><\/table><\/div><p><b>자주 나오는 계산 유형<\/b><\/p><ul><li>퍼셉트론 출력: 가중합을 구해 θ와 비교 (같으면 0, <code>&gt;<\/code>일 때만 1)<\/li><li>행렬 곱 결과와 크기: [[1,2],[3,4]]·[[5,6],[7,8]] = [[19,22],[43,50]]<\/li><li>활성화 함수 값: z = −1, 0, 1 → Sigmoid 0.27/0.5/0.73, ReLU 0/0/1, Tanh −0.76/0/0.76<\/li><li>손실: y_true [1,0,0], y_pred [0.7,0.2,0.1] → SSE 0.07, CE ≈ 0.357<\/li><li>미분: f = x², x = 2, h = 0.1 → 전방 4.1, 중앙 4.0<\/li><li>가중치 갱신: 0.1 − 0.01 × (−1.19) = 0.1119<\/li><\/ul><p>강의 슬라이드에서 계산이 틀린 곳 다섯 군데는 해당 주차에 \"슬라이드 오류 주의\"로 표시했다(5주차 배열 계산 2건, 6주차 log 값·배치 64 입력 횟수, 7주차 갱신 코드). 시험에서 슬라이드 값 그대로 나오면 교수님 의도를 확인하자.<\/p><h2 id=\"n1\">1주차 · Python, NumPy, Matplotlib<\/h2><p>Python은 딥러닝 구현의 기본 언어이고, NumPy로 배열을 계산하고 Matplotlib으로 결과를 그린다. 이 세 도구가 3~5주차 신경망 코드의 바탕이다.<\/p><h3>1-1 Python 기초<\/h3><ul><li><b>왜 Python인가:<\/b> 문법이 간단하고 라이브러리(NumPy, Matplotlib)가 풍부하며, TensorFlow·PyTorch 같은 딥러닝 프레임워크와 쉽게 연동된다. 무료 오픈소스.<\/li><li><b>실행 방식:<\/b> 대화형 모드(터미널에서 <code>python<\/code> → <code>&gt;&gt;&gt;<\/code> 프롬프트)와 스크립트 파일 실행 둘 다 지원. 설치 시 \"Add Python to PATH\" 선택.<\/li><li><b>동적 타입:<\/b> 변수에 타입을 선언하지 않는다. <code>x = 10<\/code> → <code>int<\/code>, 다시 <code>x = \"Python\"<\/code> → <code>str<\/code>.<\/li><li><b>연산:<\/b> <code>7 / 5<\/code> = 1.4 (나눗셈은 실수), <code>3 ** 2<\/code> = 9 (거듭제곱), <code>10 % 3<\/code> = 1 (나머지).<\/li><\/ul><div class=\"tbl\"><table><tr><th>구조<\/th><th>접근 방식<\/th><th>예<\/th><\/tr><tr><td>리스트 <code>[ ]<\/code<\/td><td>순서가 있고 <b>인덱스<\/b>로 접근<\/td><td><code>a = [1,2,3]; a[0]<\/code> → 1, <code>a.append(4)<\/code<\/td><\/tr><tr><td>딕셔너리 <code>{ }<\/code<\/td><td>**키(key)**로 접근<\/td><td><code>d = {'이름':'홍길동'}; d['이름']<\/code<\/td><\/tr><\/table><\/div><ul><li><b>제어 구조:<\/b> <code>if / elif / else<\/code>, <code>for i in range(5)<\/code>, <code>while<\/code>. 코드 블록은 <b>들여쓰기<\/b>로 구분한다.<\/li><li><b>함수와 모듈:<\/b> <code>def<\/code>로 재사용 가능한 코드 블록을 만든다(가독성·유지보수성). 모듈은 함수·클래스를 담은 파일이고 <code>import<\/code>로 가져온다(<code>import math; math.sqrt(16)<\/code> → 4.0).<\/li><\/ul><h3>1-2 개발 환경과 NumPy<\/h3><p><b>Python 단독 vs Anaconda.<\/b> Anaconda는 NumPy·Pandas·Matplotlib 등이 기본 포함되고 Navigator(GUI)와 <code>conda<\/code>로 환경을 관리한다. 초보자는 Anaconda, 경량 프로젝트·서버는 Python 단독이 권장된다. 설치 파일은 약 500MB 이상.<\/p><p><b>가상 환경<\/b>은 프로젝트별로 독립된 Python 환경이다. 패키지 충돌을 막고, Python 버전을 고정하고, 같은 환경에서 실행되도록 재현성을 보장한다.<\/p><pre class=\"nc\">$ conda create -n myenv python=3.8   # 생성\n$ conda activate myenv               # 활성화\n(myenv) $ conda install numpy matplotlib\n(myenv) $ conda deactivate          # 비활성화<\/pre><p><b>NumPy<\/b>는 Python의 수치 계산 라이브러리다. 배열·행렬 연산, 브로드캐스팅, 풍부한 수학 함수를 제공한다.<\/p><div class=\"tbl\"><table><tr><th>목적<\/th><th>코드<\/th><th>결과<\/th><\/tr><tr><td>배열 생성<\/td><td><code>np.array([1,2,3])<\/code<\/td><td><code>[1 2 3]<\/code<\/td><\/tr><tr><td>0 / 1로 채우기<\/td><td><code>np.zeros((2,3))<\/code>, <code>np.ones((3,3))<\/code<\/td><td>2×3 영행렬, 3×3 일행렬<\/td><\/tr><tr><td>간격으로 만들기<\/td><td><code>np.arange(0,10,2)<\/code<\/td><td><code>[0 2 4 6 8]<\/code> (끝값 10 제외)<\/td><\/tr><tr><td>개수로 나누기<\/td><td><code>np.linspace(0,1,5)<\/code<\/td><td><code>[0 0.25 0.5 0.75 1]<\/code> (끝값 포함)<\/td><\/tr><tr><td>형태·자료형<\/td><td><code>a.shape<\/code>, <code>a.dtype<\/code<\/td><td><code>(2, 2)<\/code>, <code>int64<\/code<\/td><\/tr><tr><td>형태 바꾸기<\/td><td><code>a.reshape(4,1)<\/code<\/td><td>원소 수가 같아야 함, 다르면 <code>ValueError<\/code<\/td><\/tr><tr><td>인덱싱<\/td><td><code>a[1,1]<\/code<\/td><td>두 번째 행, 두 번째 열<\/td><\/tr><tr><td>슬라이싱<\/td><td><code>a[:, 0]<\/code<\/td><td>모든 행의 첫 번째 열<\/td><\/tr><tr><td>조건 필터<\/td><td><code>data[data &gt; 20]<\/code<\/td><td>20보다 큰 값만<\/td><\/tr><tr><td>원소별 연산<\/td><td><code>x + y<\/code>, <code>x * y<\/code<\/td><td>같은 위치끼리 계산<\/td><\/tr><tr><td>행렬 곱<\/td><td><code>np.dot(A, B)<\/code<\/td><td><code>[[1,2],[3,4]]·[[5,6],[7,8]]<\/code> = <code>[[19,22],[43,50]]<\/code<\/td><\/tr><tr><td>집계<\/td><td><code>np.sum<\/code>, <code>np.mean<\/code>, <code>np.max<\/code>, <code>np.min<\/code<\/td><td>합, 평균, 최대, 최소<\/td><\/tr><tr><td>난수<\/td><td><code>np.random.rand(3,3)<\/code<\/td><td>0~1 균등분포 3×3<\/td><\/tr><tr><td>연립방정식<\/td><td><code>np.linalg.solve(A, b)<\/code<\/td><td><code>3x+y=9, x+2y=8<\/code> → <code>[2. 3.]<\/code<\/td><\/tr><\/table><\/div><ul><li><b>x * y<\/b><b>는 원소별 곱, <\/b><b>np.dot<\/b><b>이 행렬 곱이다.<\/b> 시험에서 자주 헷갈리는 부분.<\/li><li><b>브로드캐스팅:<\/b> 크기가 다른 배열끼리 연산할 때 작은 쪽이 큰 쪽 크기로 자동 확장된다. <code>np.array([1,2,3]) + 2<\/code> → <code>[3 4 5]<\/code>. 반복문 없이 대량 연산이 가능하다.<\/li><li><b>NumPy 배열 vs 리스트:<\/b> 배열은 자료형과 크기가 고정되어 벡터화 연산이 빠르다. 리스트는 유연하지만 수치 연산이 느리다.<\/li><li><b>스케일링 두 가지:<\/b><ul><li>Min-Max: <code>(x − min) / (max − min)<\/code> → 0~1 사이. <code>[50,60,70,80,90]<\/code> → <code>[0, 0.25, 0.5, 0.75, 1]<\/code><\/li><li>표준화(정규화): <code>(x − mean) / std<\/code> → 평균 0, 표준편차 1<\/li><\/ul><\/li><li><b>복사 vs 참조:<\/b> <code>b = a.copy()<\/code>는 새 배열을 만들어 원본과 분리된다. <code>c = b<\/code>는 같은 배열을 가리키므로 <code>b<\/code>를 바꾸면 <code>c<\/code>도 바뀐다.<\/li><\/ul><h3>1-3 Matplotlib<\/h3><p>Matplotlib은 Python에서 가장 널리 쓰이는 시각화 라이브러리로, <code>pyplot<\/code> 모듈(<code>import matplotlib.pyplot as plt<\/code>)로 그래프를 그린다. 설치는 <code>conda install matplotlib<\/code> 또는 <code>pip install matplotlib<\/code>.<\/p><div class=\"tbl\"><table><tr><th>그래프<\/th><th>함수<\/th><th>언제 쓰나<\/th><\/tr><tr><td>선 그래프<\/td><td><code>plt.plot()<\/code<\/td><td>시간에 따른 변화<\/td><\/tr><tr><td>막대 그래프<\/td><td><code>plt.bar()<\/code<\/td><td>범주형 데이터 비교<\/td><\/tr><tr><td>히스토그램<\/td><td><code>plt.hist()<\/code<\/td><td>데이터 분포 (<code>bins<\/code>로 구간 수)<\/td><\/tr><tr><td>산점도<\/td><td><code>plt.scatter()<\/code<\/td><td>두 변수 간 관계<\/td><\/tr><tr><td>박스플롯<\/td><td><code>plt.boxplot()<\/code<\/td><td>분포와 이상치<\/td><\/tr><tr><td>파이 차트<\/td><td><code>plt.pie()<\/code<\/td><td>비율<\/td><\/tr><\/table><\/div><ul><li><b>꾸미기:<\/b> <code>plt.title()<\/code>, <code>plt.xlabel()/ylabel()<\/code>, <code>plt.legend()<\/code>(plot의 <code>label=<\/code> 필요), <code>plt.grid(True)<\/code>, <code>plt.xlim()/ylim()<\/code>, 선 옵션 <code>color<\/code>, <code>linestyle<\/code>(<code>'-' '--' '-.' ':'<\/code>), <code>linewidth<\/code>.<\/li><li><b>plt.show()<\/b><b>:<\/b> 작성한 그래프를 화면에 표시한다.<\/li><li><b>서브플롯:<\/b> <code>fig, axes = plt.subplots(2, 2)<\/code>로 여러 그래프를 한 화면에 배치하고, <code>axes[0, 0].plot(...)<\/code>, <code>set_title()<\/code>로 각각 그린다. <code>plt.tight_layout()<\/code>으로 간격을 조정한다.<\/li><li><b>이미지:<\/b> <code>from matplotlib.image import imread<\/code> → <code>plt.imshow(img)<\/code>, <code>plt.axis('off')<\/code>로 축 숨기기.<\/li><li><b>전역 글꼴:<\/b> <code>mpl.rcParams['font.size'] = 20<\/code>.<\/li><\/ul><pre class=\"nc\">import numpy as np\nimport matplotlib.pyplot as plt\n\nx = np.linspace(0, 10, 100)\nplt.plot(x, np.sin(x), label=\"sin(x)\", color=\"blue\", linestyle=\"--\")\nplt.title(\"Sine Function\"); plt.xlabel(\"x-axis\"); plt.ylabel(\"y-axis\")\nplt.legend(); plt.grid(True)\nplt.show()<\/pre><h2 id=\"n2\">2주차 · 머신러닝, 지도/비지도학습, 매개변수적 학습<\/h2><p>머신러닝은 규칙을 직접 프로그래밍하는 대신 데이터에서 학습하는 기술이고, 딥러닝은 그 하위 분야다. 이번 주는 학습을 두 기준으로 나눈다: 라벨 유무(지도/비지도)와 매개변수 고정 여부(매개변수적/비매개변수적).<\/p><h3>2-1 머신러닝의 정의와 역사<\/h3><p><b>머신러닝:<\/b> 인공지능(AI)의 하위 집합으로, 컴퓨터가 명시적인 프로그래밍 없이 데이터를 통해 학습하고 경험을 바탕으로 개선되는 능력을 갖추도록 하는 기술. 핵심은 데이터 기반 학습, 자동 개선, 예측과 의사결정, 알고리즘 활용이다.<\/p><p><b>AI ⊃ 머신러닝 ⊃ 딥러닝.<\/b> 머신러닝은 데이터에서 패턴을 찾는 알고리즘의 집합이고, 딥러닝은 인공 신경망을 깊게 쌓아 복잡한 문제를 푸는 하위 분야다.<\/p><div class=\"tbl\"><table><tr><th>연도<\/th><th>인물·사건<\/th><th>의미<\/th><\/tr><tr><td>1950년대<\/td><td>앨런 튜링, 튜링 테스트<\/td><td>기계가 학습할 수 있는지 기준 제시, 컴퓨터 과학의 창시자<\/td><\/tr><tr><td>1958년<\/td><td>프랭크 로젠블랫, 퍼셉트론<\/td><td>최초의 인공 신경망 모델, 마크 I 퍼셉트론 하드웨어<\/td><\/tr><tr><td>1959년<\/td><td>아서 사무엘<\/td><td>\"머신러닝\" 용어 최초 사용, 체커 게임 자가 학습 프로그램<\/td><\/tr><tr><td>1970년대<\/td><td>신경망 침체기<\/td><td>퍼셉트론이 <b>XOR 문제를 풀지 못함<\/<\/td><\/tr><tr><td>1986년<\/td><td>제프리 힌튼, 백프로파게이션<\/td><td>다층 신경망 학습 가능, \"딥러닝의 아버지\"<\/td><\/tr><tr><td>1990년대<\/td><td>SVM 등장<\/td><td>고급 알고리즘 발전<\/td><\/tr><tr><td>2010년대<\/td><td>GPU와 빅데이터<\/td><td>딥러닝 급성장<\/td><\/tr><tr><td>2012년<\/td><td>AlexNet<\/td><td>ImageNet 우승(85% 정확도), 이미지 처리 혁신<\/td><\/tr><\/table><\/div><ul><li><b>얀 르쿤:<\/b> 합성곱 신경망(CNN) 개발, 컴퓨터 비전 혁신. <b>앤드류 응:<\/b> Google Brain으로 딥러닝 대중화.<\/li><li><b>딥러닝 급성장 요인 3가지:<\/b> 대규모 데이터(빅데이터), GPU 등 하드웨어 성능 향상, 새 신경망 구조(CNN, RNN, Transformer).<\/li><\/ul><div class=\"tbl\"><table><tr><th>분야<\/th><th>문제<\/th><th>주요 기술<\/th><\/tr><tr><td>머신러닝<\/td><td>자율주행<\/td><td>LiDAR·카메라·레이더, 객체 인식(YOLO, SSD), 심층 강화학습<\/td><\/tr><tr><td>머신러닝<\/td><td>추천 시스템<\/td><td>협업 필터링, 콘텐츠 기반 필터링, 임베딩<\/td><\/tr><tr><td>머신러닝<\/td><td>금융 사기 탐지<\/td><td>이상 탐지, 랜덤 포레스트, XGBoost, 오토인코더<\/td><\/tr><tr><td>딥러닝<\/td><td>이미지 분류<\/td><td>CNN, 필터로 특징(엣지, 질감) 자동 추출<\/td><\/tr><tr><td>딥러닝<\/td><td>언어 번역<\/td><td>RNN, Transformer, Attention<\/td><\/tr><tr><td>딥러닝<\/td><td>생성형 모델<\/td><td>GAN: 생성자와 판별자가 경쟁하며 학습<\/td><\/tr><tr><td>딥러닝<\/td><td>음성 비서<\/td><td>ASR(음성→텍스트) + NLP<\/td><\/tr><tr><td>딥러닝<\/td><td>자율주행<\/td><td>DNN, CNN(표지판·차선), RNN(경로 예측), 심층 강화학습<\/td><\/tr><\/table><\/div><h3>2-2 지도학습과 비지도학습<\/h3><p>학습 방법은 지도학습·비지도학습이 기본이고, 선택적으로 준지도학습과 강화학습이 있다.<\/p><div class=\"tbl\"><table><tr><th>항목<\/th><th>지도학습<\/th><th>비지도학습<\/th><\/tr><tr><td>데이터<\/td><td>라벨(정답)이 있는 데이터<\/td><td>라벨이 없는 데이터<\/td><\/tr><tr><td>목표<\/td><td>입력과 출력 사이의 관계 학습<\/td><td>데이터 안에 숨은 패턴과 구조 발견<\/td><\/tr><tr><td>주요 기법<\/td><td>선형 회귀, 로지스틱 회귀, 의사결정나무, SVM, DNN<\/td><td>K-평균, PCA, 오토인코더, 토픽 모델링(LDA), DBSCAN<\/td><\/tr><tr><td>응용<\/td><td>예측, 분류<\/td><td>군집화, 차원 축소, 이상 탐지<\/td><\/tr><tr><td>대표 사례<\/td><td>고양이 이미지 분류(CNN), 영화 추천(행렬 분해), 날씨 예측(LSTM), 질병 진단(전이 학습), 고객 이탈 예측<\/td><td>고객 세분화(K-평균), 문서 분류(LDA), 이미지 압축(오토인코더), 이상 탐지(DBSCAN), 유전자 분석(PCA)<\/td><\/tr><tr><td>한계<\/td><td>대규모 라벨 데이터가 필요<\/td><td>만들어진 군집의 의미 해석이 어려움<\/td><\/tr><tr><td>해결<\/td><td>준지도학습(소량 라벨 + 비라벨), 전이 학습(사전 학습 모델)<\/td><td>도메인 전문가 해석, 지도학습과 결합<\/td><\/tr><\/table><\/div><ul><li><b>지도학습의 핵심 개념 4가지:<\/b> 목표(입출력 관계 학습), 손실 함수(예측값과 정답의 오차), 최적화(손실을 최소화하도록 모델 조정), 일반화(새 데이터에도 잘 작동).<\/li><li><b>지도학습의 작동:<\/b> 학습(Training) → 새 입력에 대한 예측(Prediction).<\/li><li><b>비지도학습의 핵심 개념:<\/b> 데이터 간 유사성(거리), 차원 축소, 정보 압축.<\/li><li><b>둘의 연결:<\/b> 비지도학습은 지도학습의 전처리와 라벨 생성을 돕는다. 고객 세분화로 만든 라벨을 지도학습에 쓰거나, PCA로 데이터를 간소화해 성능을 개선한다.<\/li><\/ul><h3>2-3 매개변수적 학습 vs 비매개변수적 학습<\/h3><p><b>매개변수적 학습<\/b>은 데이터 크기와 관계없이 <b>고정된 수의 매개변수<\/b>로 데이터를 설명한다. 대표 예가 선형 회귀 y = ax + b다. a(기울기)와 b(절편)는 미리 정해진 숫자가 아니라 학습으로 결정되는 값이고, 데이터가 늘어도 매개변수는 2개 그대로다. 예) 집 크기-가격: y = 200.67x − 13666.67.<\/p><p><b>비매개변수적 학습<\/b>은 매개변수 수가 데이터 크기·복잡성에 따라 변한다. 모델이 데이터 자체를 저장하고 새 데이터와 비교해 예측한다. 데이터 분포에 대한 사전 가정이 없어 복잡한 데이터에 강하다. 예) K-NN은 가장 가까운 이웃 k개를 참조해 예측하므로 데이터가 늘수록 계산량이 늘어난다.<\/p><div class=\"tbl\"><table><tr><th>항목<\/th><th>매개변수적<\/th><th>비매개변수적<\/th><\/tr><tr><td>매개변수 수<\/td><td>고정<\/td><td>데이터 크기에 따라 변함<\/td><\/tr><tr><td>적합한 데이터<\/td><td>단순하고 노이즈가 적음, 소·중규모<\/td><td>복잡하고 비선형, 대규모<\/td><\/tr><tr><td>계산<\/td><td>계산량 적고 빠름<\/td><td>데이터가 많을수록 계산량 증가<\/td><\/tr><tr><td>해석<\/td><td>구조가 단순해 쉬움<\/td><td>구조가 복잡해 어려움<\/td><\/tr><tr><td>잡음<\/td><td>덜 민감<\/td><td>과적합 위험(깊은 결정 트리)<\/td><\/tr><tr><td>라벨<\/td><td>라벨 데이터 필요<\/td><td>비라벨 데이터도 처리<\/td><\/tr><tr><td>주요 기법<\/td><td>선형 회귀(가우스, 최소제곱법), 로지스틱 회귀(1958 Cox), SVM(1990년대 Vapnik), 인공 신경망<\/td><td>K-NN(1951 Fix·Hodges), 결정 트리(Quinlan), 랜덤 포레스트(2001 Breiman), 커널 밀도 추정<\/td><\/tr><tr><td>적합한 응용<\/td><td>예측, 분류 (주택 가격, 스팸 분류, 광고 클릭)<\/td><td>이상 탐지, 클러스터링 (고객 세분화, 사기 탐지)<\/td><\/tr><tr><td>개선 방안<\/td><td>과적합 → 정규화(Lasso, Ridge)<\/td><td>계산량 → KD-트리, 과적합 → 전처리<\/td><\/tr><\/table><\/div><ul><li><b>선택 기준:<\/b> 데이터가 단순하고 빠른 계산·해석이 중요하면 매개변수적, 데이터가 복잡·비선형이고 양이 많거나 라벨이 부족하면 비매개변수적.<\/li><li><b>헷갈림 주의:<\/b> 신경망(ANN, CNN)은 매개변수적 학습에 들어간다. 가중치 개수가 모델 구조로 고정되기 때문이다.<\/li><\/ul><h2 id=\"n3\">3주차 · 퍼셉트론, 논리 게이트, XOR<\/h2><p>퍼셉트론은 입력의 가중합이 임계값을 넘으면 1, 아니면 0을 내는 최초의 인공 신경망이다. 직선 하나로 나눌 수 있는 AND·OR·NAND는 풀지만 XOR은 못 푼다. 층을 쌓아야(다층 퍼셉트론) XOR을 푼다.<\/p><h3>3-1 퍼셉트론<\/h3><ul><li><b>등장:<\/b> 1957년 프랭크 로젠블랫이 고안(2주차 자료에는 1958년으로 나옴). 미 해군 후원, \"전자적인 눈\"으로 이미지를 보고 학습하는 것이 목표였다.<\/li><li><b>한계와 침체:<\/b> 1969년 민스키와 페퍼트가 XOR 같은 비선형 문제를 풀 수 없음을 지적 → 신경망 연구 침체. 1980년대 다층 퍼셉트론과 역전파로 재개.<\/li><\/ul><div class=\"tbl\"><table><tr><th>구성 요소<\/th><th>기호<\/th><th>역할<\/th><th>생물학적 뉴런<\/th><\/tr><tr><td>입력값<\/td><td>x₁ … xₙ<\/td><td>외부에서 들어오는 데이터<\/td><td>수상돌기<\/td><\/tr><tr><td>가중치<\/td><td>w₁ … wₙ<\/td><td>각 입력의 중요도<\/td><td>시냅스<\/td><\/tr><tr><td>가중합<\/td><td>Σ wᵢxᵢ<\/td><td>가중치 × 입력을 모두 더한 값<\/td><td>신호 합산<\/td><\/tr><tr><td>임계값<\/td><td>θ<\/td><td>출력을 결정하는 기준(활성화 기준)<\/td><td>축삭 둔덕<\/td><\/tr><tr><td>출력값<\/td><td>y<\/td><td>1(활성화) 또는 0(비활성화)<\/td><td>축삭<\/td><\/tr><\/table><\/div><div class=\"math\">\\[y = \\begin{cases} 1 &amp; \\text{if } \\sum_{i=1}^{n} w_i x_i &gt; \\theta \\\\ 0 &amp; \\text{otherwise} \\end{cases}\\]<\/div><p><b>계산 예:<\/b> x₁ = 1, x₂ = 0, w₁ = 0.8, w₂ = 0.2, θ = 0.5 → 가중합 = 1×0.8 + 0×0.2 = 0.8 &gt; 0.5 → <b>y = 1<\/b>.<\/p><ul><li><b>선형 결정 경계:<\/b> 퍼셉트론은 데이터를 직선 하나로 나눈다(예: x₁ + 2x₂ = 7). 두 클래스가 직선으로 구분되면 학습할 수 있다.<\/li><li><b>θ가 커지면<\/b> 경계가 원점에서 멀어져 출력 1 영역이 줄고, θ가 작아지면 넓어진다. 가중치를 바꾸면 경계의 기울기가 바뀐다.<\/li><\/ul><h3>3-2 논리 게이트와 바이어스<\/h3><p><b>바이어스 b<\/b>는 임계값을 왼쪽으로 넘긴 것이다. Σwᵢxᵢ &gt; θ 를 Σwᵢxᵢ + b &gt; 0 으로 바꾸면 b = −θ이고, 뉴런이 얼마나 쉽게 활성화(발화)되는지를 조절한다.<\/p><div class=\"tbl\"><table><tr><th>x₁<\/th><th>x₂<\/th><th>AND<\/th><th>OR<\/th><th>NAND<\/th><th>XOR<\/th><\/tr><tr><td>0<\/td><td>0<\/td><td>0<\/td><td>0<\/td><td>1<\/td><td>0<\/td><\/tr><tr><td>0<\/td><td>1<\/td><td>0<\/td><td>1<\/td><td>1<\/td><td>1<\/td><\/tr><tr><td>1<\/td><td>0<\/td><td>0<\/td><td>1<\/td><td>1<\/td><td>1<\/td><\/tr><tr><td>1<\/td><td>1<\/td><td>1<\/td><td>1<\/td><td>0<\/td><td>0<\/td><\/tr><\/table><\/div><ul><li>AND: 모두 1일 때만 1 / OR: 하나라도 1이면 1 / NOT: 반대값 / NAND: AND의 반대(디지털 회로의 범용 게이트) / XOR: 두 입력이 다를 때만 1.<\/li><\/ul><div class=\"tbl\"><table><tr><th>게이트<\/th><th>w₁, w₂<\/th><th>θ<\/th><th>확인<\/th><\/tr><tr><td>AND<\/td><td>0.5, 0.5<\/td><td>0.7<\/td><td>(1,1) → 1.0 &gt; 0.7 → 1, (1,0) → 0.5 ≤ 0.7 → 0<\/td><\/tr><tr><td>AND (다른 예)<\/td><td>0.3, 0.7<\/td><td>0.9<\/td><td>(1,1) → 1.0 &gt; 0.9 → 1<\/td><\/tr><tr><td>OR<\/td><td>0.5, 0.5<\/td><td>0.2<\/td><td>(1,0) → 0.5 &gt; 0.2 → 1<\/td><\/tr><tr><td>NAND<\/td><td>−0.5, −0.5<\/td><td>−0.7<\/td><td>(1,1) → −1.0 ≤ −0.7 → 0, (1,0) → −0.5 &gt; −0.7 → 1<\/td><\/tr><tr><td>NOT<\/td><td>w = −1.0<\/td><td>−0.5<\/td><td>x=0 → 0 &gt; −0.5 → 1, x=1 → −1 → 0<\/td><\/tr><\/table><\/div><ul><li><b>같은 퍼셉트론 구조에 매개변수(w, θ)만 바꾸면<\/b> AND·OR·NAND가 된다. NAND는 AND의 부호를 모두 뒤집은 것이다.<\/li><li><b>개념 점검 계산:<\/b> AND(w=0.5, 0.5, θ=0.7)에 (1,0) → 0.5 ≤ 0.7 → 0. w=0.4, 0.6, θ=0.5에 (1,1) → 1.0 &gt; 0.5 → 1.<\/li><li><b>선형 문제 vs 비선형 문제:<\/b> 직선 하나로 분리되면 선형(AND, OR, NAND), 분리되지 않으면 비선형(XOR).<\/li><\/ul><pre class=\"nc\">def AND(x1, x2):\n    w1, w2, theta = 0.5, 0.5, 0.7\n    return 1 if w1*x1 + w2*x2 &gt; theta else 0<\/pre><h3>3-3 XOR 문제와 다층 퍼셉트론<\/h3><p><b>왜 단층 퍼셉트론은 XOR을 못 푸나.<\/b> XOR에서 (0,0)과 (1,1)은 클래스 0, (0,1)과 (1,0)은 클래스 1이다. 같은 클래스가 대각선으로 떨어져 있어 직선 하나로는 나눌 수 없다. 또 선형식을 아무리 조합해도 선형식이므로(a₁f₁ + a₂f₂ + b도 선형), 단층 구조로는 비선형성을 만들 수 없다. 은닉층과 활성화 함수가 필요하다.<\/p><p><b>게이트 조합으로 푸는 XOR:<\/b> XOR(x₁, x₂) = AND( NAND(x₁, x₂), OR(x₁, x₂) )<\/p><div class=\"tbl\"><table><tr><th>x₁<\/th><th>x₂<\/th><th>① NAND<\/th><th>② OR<\/th><th>③ AND(①, ②) = XOR<\/th><\/tr><tr><td>0<\/td><td>0<\/td><td>1<\/td><td>0<\/td><td>0<\/td><\/tr><tr><td>0<\/td><td>1<\/td><td>1<\/td><td>1<\/td><td>1<\/td><\/tr><tr><td>1<\/td><td>0<\/td><td>1<\/td><td>1<\/td><td>1<\/td><\/tr><tr><td>1<\/td><td>1<\/td><td>0<\/td><td>1<\/td><td>0<\/td><\/tr><\/table><\/div><p>NAND와 OR가 1층(은닉층), AND가 2층(출력층)인 <b>2층 퍼셉트론<\/b>이다. 은닉 뉴런 2개가 각각 새 선형 경계(h₁, h₂)를 만들고, 출력 뉴런 1개가 둘을 결합해 비선형 결정 경계를 만든다.<\/p><pre class=\"nc\">h1 = w11·x1 + w21·x2 + b1\nh2 = w12·x1 + w22·x2 + b2\ny  = w31·h1 + w32·h2 + b3<\/pre><div class=\"tbl\"><table><tr><th>층<\/th><th>역할<\/th><\/tr><tr><td>입력층<\/td><td>입력값을 가중합 계산 없이 그대로 은닉층에 전달<\/td><\/tr><tr><td>은닉층<\/td><td>가중치를 곱하고 바이어스를 더해 데이터를 비선형 변환. 뉴런 수와 층의 깊이가 표현력을 결정<\/td><\/tr><tr><td>출력층<\/td><td>최종 결과. 분류는 클래스 확률, 회귀는 연속값. 뉴런 수 = 출력 차원<\/td><\/tr><\/table><\/div><p><b>텐서<\/b>는 데이터를 표현하는 다차원 배열이다. 0차원 스칼라(x = 5), 1차원 벡터([1 2 3]), 2차원 행렬, 3차원 이상 텐서(T ∈ ℝ³ˣ³ˣ³). 신경망에서 입력은 벡터(배치면 X ∈ ℝ^(m×n) 행렬), 가중치는 행렬, 배치 데이터는 고차원 텐서로 나타내고, 한 층의 계산은 <b>Y = X·W + b<\/b> (b는 브로드캐스팅)이다.<\/p><h2 id=\"n4\">4주차 · 신경망, 활성화 함수, 벡터와 행렬<\/h2><p>신경망은 입력층 → 은닉층 → 출력층으로 신호를 전달하며, 각 층에서 ① 선형 결합 z = Wa + b를 구하고 ② 활성화 함수 a = f(z)를 적용한다. 활성화 함수가 비선형이어야 층을 쌓는 의미가 있다.<\/p><h3>4-1 퍼셉트론에서 신경망으로<\/h3><div class=\"tbl\"><table><tr><th>연도<\/th><th>사건<\/th><th>의미<\/th><\/tr><tr><td>1943<\/td><td>McCulloch &amp; Pitts<\/td><td>뉴런 작동을 논리 회로로 수학적으로 설명. 학습 없는 고정 구조<\/td><\/tr><tr><td>1958<\/td><td>Rosenblatt, 퍼셉트론<\/td><td><b>학습 가능한<\/b> 최초의 신경망. XOR 불가<\/td><\/tr><tr><td>1969<\/td><td>Minsky &amp; Papert<\/td><td>XOR 문제로 한계 노출 → 연구 침체, 지원 감소<\/td><\/tr><tr><td>1986<\/td><td>Hinton·Rumelhart·Williams, 역전파<\/td><td>오차를 출력층에서 입력층으로 거꾸로 전파해 가중치 조정 → MLP 학습 가능<\/td><\/tr><tr><td>1998<\/td><td>Yann LeCun, CNN<\/td><td>MNIST 이미지 분류 성과<\/td><\/tr><tr><td>2006<\/td><td>Hinton, Deep Belief Networks<\/td><td>딥러닝 재발견, ReLU·Dropout 도입<\/td><\/tr><\/table><\/div><div class=\"tbl\"><table><tr><th>구분<\/th><th>MLP(다층 퍼셉트론)<\/th><th>신경망(Neural Network)<\/th><\/tr><tr><td>범위<\/td><td>신경망의 한 종류<\/td><td>상위 개념 (MLP, CNN, RNN 등 포함)<\/td><\/tr><tr><td>연결<\/td><td>완전 연결(이전 층의 모든 뉴런과 연결)<\/td><td>다양함 (CNN은 국소 연결, RNN은 순환)<\/td><\/tr><tr><td>데이터 흐름<\/td><td>순방향(Feedforward)만<\/td><td>순방향, 순환, 병렬<\/td><\/tr><tr><td>은닉층<\/td><td>최소 1개 필요<\/td><td>없어도 됨 (단층 퍼셉트론 포함)<\/td><\/tr><tr><td>적용<\/td><td>구조적 데이터 분류·회귀<\/td><td>이미지, 텍스트 등 다양한 데이터<\/td><\/tr><\/table><\/div><p><b>층별 신호 전달(순전파).<\/b> 입력 a⁽⁰⁾ = x에서 시작해 각 층 l에서 같은 계산을 반복한다. 예) 입력 3개, 은닉 뉴런 2개면 W⁽¹⁾은 2×3, b⁽¹⁾은 2×1.<\/p><div class=\"math\">\\[z^{(l)} = W^{(l)} a^{(l-1)} + b^{(l)}, \\qquad a^{(l)} = f\\left(z^{(l)}\\right)\\]<\/div><p><b>활성화 함수가 없다면:<\/b> a⁽ˡ⁾ = z⁽ˡ⁾이므로 a⁽ᴸ⁾ = W⁽ᴸ⁾⋯W⁽¹⁾ a⁽⁰⁾ + (편향들의 합)이 된다. 이는 <b>단일 선형 변환과 같아서<\/b> 층을 아무리 쌓아도 단층 퍼셉트론처럼 선형 문제만 푼다. 은닉층이 많아지면 표현력은 커지지만 학습 시간이 늘고 과적합이 생길 수 있다.<\/p><h3>4-2 활성화 함수<\/h3><p>활성화 함수는 각 뉴런의 출력(가중합 z)을 비선형으로 변환한다. 선형성을 없애고 비선형성을 더해 XOR 같은 문제를 풀 수 있게 한다.<\/p><div class=\"tbl\"><table><tr><th>함수<\/th><th>수식<\/th><th>출력 범위<\/th><th>장점<\/th><th>단점<\/th><th>NumPy<\/th><\/tr><tr><td>Step<\/td><td>x ≥ 0이면 1, 아니면 0<\/td><td>{0, 1}<\/td><td>단순한 임계값 출력<\/td><td><b>불연속 → 미분 불가 → 학습에 못 씀<\/<\/td><td><code>np.where(x &gt;= 0, 1, 0)<\/code<\/td><\/tr><tr><td>Sigmoid<\/td><td>1 / (1 + e⁻ˣ)<\/td><td>(0, 1)<\/td><td>S자 곡선, 확률로 해석<\/td><td><b>기울기 소실<\/<\/td><td><code>1 / (1 + np.exp(-x))<\/code<\/td><\/tr><tr><td>Tanh<\/td><td>(eˣ − e⁻ˣ) / (eˣ + e⁻ˣ)<\/td><td>(−1, 1)<\/td><td>출력이 0 중심 → Sigmoid보다 학습 유리<\/td><td>기울기 소실 여전히 있음<\/td><td><code>np.tanh(x)<\/code<\/td><\/tr><tr><td>ReLU<\/td><td>max(0, x)<\/td><td>[0, ∞)<\/td><td>계산이 단순해 빠름, 기울기 소실 거의 없음<\/td><td><b>Dying ReLU<\/b> (음수 입력에 항상 0)<\/td><td><code>np.maximum(0, x)<\/code<\/td><\/tr><\/table><\/div><ul><li><b>기울기 소실:<\/b> Sigmoid 출력이 0이나 1에 가까워지면 기울기가 0에 수렴한다. 역전파에서 기울기가 사라져 학습이 느려지고, 층이 깊을수록 심각하다.<\/li><li><b>Dying ReLU:<\/b> 0 이하 입력에 항상 0을 내서 뉴런이 학습하지 못하는 현상. 해결책은 Leaky ReLU, Parametric ReLU.<\/li><li><b>선택 기준:<\/b> 은닉층은 ReLU·Tanh. 출력층은 이진 분류 Sigmoid, 다중 클래스 분류 Softmax, 회귀는 선형(항등) 함수.<\/li><\/ul><h3>4-3 벡터와 행렬<\/h3><p><b>벡터<\/b>는 크기와 방향을 가진 숫자의 나열이다. 예) 사과 1, 귤 1, 복숭아 2인 장바구니 v = [1, 1, 2].<\/p><div class=\"tbl\"><table><tr><th>연산<\/th><th>정의<\/th><th>예<\/th><\/tr><tr><td>덧셈<\/td><td>같은 위치끼리 더함<\/td><td>[1,1,2] + [2,0,1] = [3,1,3] (사과 3, 귤 1, 복숭아 3)<\/td><\/tr><tr><td>스칼라 곱<\/td><td>모든 성분에 c를 곱함. 방향은 유지, 크기만 변함<\/td><td>2·[3,4] = [6,8]<\/td
